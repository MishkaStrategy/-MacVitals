name: Post-Flush Physical Visual Acceptance

on:
  pull_request:
    branches:
      - fix/history-final-flush-a9d
    paths:
      - .github/workflows/post-flush-physical-visual.yml
      - MacVitalsTests/PhysicalVisualAcceptanceTests.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-flush-physical-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-visual:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    concurrency:
      group: macvitals-physical-runtime
      cancel-in-progress: false
      queue: max
    env:
      PRODUCT_BASE_SHA: 9afc7d9ed904bdb394ea0d0a95c1995e265c472e
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-PostFlushPhysicalVisual
      EVIDENCE_DIR: ${{ github.workspace }}/physical-visual-evidence
      READY_FILE: ${{ github.workspace }}/physical-visual-surfaces-ready.txt
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact accepted product ancestry and validation-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(stat -f '%Su' /dev/console)" = "$(id -un)"
          launchctl print "gui/$(id -u)" >/dev/null
          [[ "${PRODUCT_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${VALIDATION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"
          git merge-base --is-ancestor \
            4d143aaa082b0fb15ce86d19ba72c40557939692 \
            "${VALIDATION_SHA}"
          git merge-base --is-ancestor "${PRODUCT_BASE_SHA}" "${VALIDATION_SHA}"
          git diff --quiet "${PRODUCT_BASE_SHA}" "${VALIDATION_SHA}" -- MacVitals project.yml MacVitalsUITests
          git diff --name-only "${PRODUCT_BASE_SHA}" "${VALIDATION_SHA}" > physical-visual-changes.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              ".github/workflows/post-flush-physical-visual.yml",
              "MacVitalsTests/PhysicalVisualAcceptanceTests.swift",
          }
          actual = {
              line.strip()
              for line in Path("physical-visual-changes.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          if actual != expected:
              raise SystemExit(
                  f"physical visual validation scope mismatch: expected={sorted(expected)} actual={sorted(actual)}"
              )
          PY
          {
            printf 'product_base_sha=%s\n' "${PRODUCT_BASE_SHA}"
            printf 'validation_sha=%s\n' "${VALIDATION_SHA}"
            printf 'runner_os=%s\n' "$(uname -s)"
            printf 'runner_arch=%s\n' "$(uname -m)"
          } > physical-visual-source.txt

      - name: Validate accepted product visual contracts statically
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'private var panel: NSPanel?' MacVitals/MenuBar/NotchHUDController.swift
          grep -F 'indicatorPanel.contentViewController = NSHostingController' MacVitals/MenuBar/NotchHUDController.swift
          grep -F 'auxiliaryTopLeftArea: screen.auxiliaryTopLeftArea' MacVitals/MenuBar/NotchHUDController.swift
          grep -F 'auxiliaryTopRightArea: screen.auxiliaryTopRightArea' MacVitals/MenuBar/NotchHUDController.swift
          grep -F 'static let minimumContourClearance: CGFloat = 0' MacVitals/MenuBar/NotchHUDLayout.swift
          grep -F 'NetworkTrafficView()' MacVitals/UI/Overview/OverviewView.swift
          grep -F 'StorageUsageView()' MacVitals/UI/Overview/OverviewView.swift
          grep -F '.accessibilityLabel(NetworkL10n.string("Traffic history"))' MacVitals/UI/Overview/SupplementalMetricDetailView.swift
          grep -F '.accessibilityLabel(StorageL10n.string("Storage history"))' MacVitals/UI/Overview/SupplementalMetricDetailView.swift
          grep -F 'HistoricalConsumptionLeadersView(metric:' MacVitals/UI/Overview/MetricDetailTabbedContainer.swift
          if grep -Eq 'leftPanel|rightPanel|legacy.*panel|pet|dragon' \
              MacVitals/MenuBar/NotchHUDController.swift \
              MacVitals/MenuBar/NotchHUDViews.swift; then
            printf '%s\n' 'Legacy multi-panel or pet/dragon HUD behavior is present' >&2
            exit 1
          fi
          if grep -Eq 'setAllAutomatic\(|set.*RPM|write.*SMC|SMC.*write' \
              MacVitalsTests/PhysicalVisualAcceptanceTests.swift; then
            printf '%s\n' 'Physical visual validation test contains a forbidden fan/SMC write path' >&2
            exit 1
          fi

      - name: Validate canonical runtime evidence tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/collect_runtime_metrics.py \
            scripts/report_runtime_resources.py
          python3 scripts/collect_runtime_metrics.py --self-test
          python3 scripts/report_runtime_resources.py --self-test
          bash -n scripts/collect_runtime_metrics.sh

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Validate physical visual test formatting
        run: swift format lint MacVitalsTests/PhysicalVisualAcceptanceTests.swift

      - name: Prepare validation-only test scheme
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "${EVIDENCE_DIR}" "${DERIVED_DATA}" physical-visual-runtime
          rm -f -- "${READY_FILE}"
          mkdir -p "${EVIDENCE_DIR}"
          cp project.yml physical-visual-project.yml
          cat >> physical-visual-project.yml <<YAML
            MacVitalsPostFlushPhysicalVisual:
              build:
                targets:
                  MacVitals: all
                  MacVitalsTests: [test]
              test:
                gatherCoverageData: false
                language: en
                region: US
                targets:
                  - MacVitalsTests
                environmentVariables:
                  MACVITALS_PHYSICAL_VISUAL_EVIDENCE_DIR: "${EVIDENCE_DIR}"
                  MACVITALS_NOTCH_DIAGNOSTICS_PATH: "${EVIDENCE_DIR}/notch-controller.json"
                  MACVITALS_PHYSICAL_VISUAL_READY_FILE: "${READY_FILE}"
          YAML
          xcodegen generate --spec physical-visual-project.yml
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitalsPostFlushPhysicalVisual \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            > physical-visual-build.log 2>&1
          test -x "${DERIVED_DATA}/Build/Products/Debug/MacVitals.app/Contents/MacOS/MacVitals"

      - name: Run physical visual product-host validation with resources
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_EXECUTABLE="${DERIVED_DATA}/Build/Products/Debug/MacVitals.app/Contents/MacOS/MacVitals"
          TEST_PID=""
          OWNED_PID=""
          CLEANUP_STATUS=0

          command_for_pid() {
            ps -p "$1" -o command= 2>/dev/null || true
          }
          exact_pid_is_owned() {
            local pid="$1" executable="$2" command_line
            [[ "${pid}" =~ ^[0-9]+$ ]] || return 1
            kill -0 "${pid}" 2>/dev/null || return 1
            command_line="$(command_for_pid "${pid}")"
            [[ "${command_line}" == "${executable}" || "${command_line}" == "${executable} "* ]]
          }
          terminate_exact_pid() {
            local pid="$1" executable="$2"
            [[ -n "${pid}" ]] || return 0
            exact_pid_is_owned "${pid}" "${executable}" || return 0
            kill -TERM "${pid}" 2>/dev/null || true
            for _ in {1..50}; do
              exact_pid_is_owned "${pid}" "${executable}" || return 0
              sleep 0.1
            done
            if exact_pid_is_owned "${pid}" "${executable}"; then
              kill -KILL "${pid}" 2>/dev/null || true
            fi
            for _ in {1..20}; do
              exact_pid_is_owned "${pid}" "${executable}" || return 0
              sleep 0.1
            done
            return 1
          }
          cleanup() {
            local original_status="$?"
            trap - EXIT HUP INT TERM
            set +e
            if [[ -n "${TEST_PID}" ]] && kill -0 "${TEST_PID}" 2>/dev/null; then
              kill -TERM "${TEST_PID}" 2>/dev/null || true
              wait "${TEST_PID}" 2>/dev/null || CLEANUP_STATUS=1
            fi
            terminate_exact_pid "${OWNED_PID}" "${EXPECTED_EXECUTABLE}" || CLEANUP_STATUS=1
            rm -f -- "${READY_FILE}"
            if [[ ${original_status} -ne 0 ]]; then
              exit "${original_status}"
            fi
            exit "${CLEANUP_STATUS}"
          }
          trap cleanup EXIT HUP INT TERM

          if pgrep -x MacVitals >/dev/null 2>&1; then
            printf '%s\n' 'Existing MacVitals process detected; visual validation fails closed and will not terminate it:' >&2
            while IFS= read -r pid; do
              [[ "${pid}" =~ ^[0-9]+$ ]] || continue
              ps -p "${pid}" -o pid=,command= >&2 || true
            done < <(pgrep -x MacVitals 2>/dev/null || true)
            exit 1
          fi

          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitalsPostFlushPhysicalVisual \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building \
            -only-testing:MacVitalsTests/PhysicalVisualAcceptanceTests/testAcceptedHUDOverviewAndHistorySurfaces \
            > physical-visual-test.log 2>&1 &
          TEST_PID=$!

          ready=0
          for _ in {1..120}; do
            owned_count=0
            OWNED_PID=""
            while IFS= read -r pid; do
              [[ "${pid}" =~ ^[0-9]+$ ]] || continue
              command_line="$(command_for_pid "${pid}")"
              [[ -n "${command_line}" ]] || continue
              if [[ "${command_line}" == "${EXPECTED_EXECUTABLE}" || "${command_line}" == "${EXPECTED_EXECUTABLE} "* ]]; then
                OWNED_PID="${pid}"
                owned_count=$((owned_count + 1))
              else
                printf 'Foreign MacVitals process appeared and will not be terminated: pid=%s command=%s\n' "${pid}" "${command_line}" >&2
                exit 1
              fi
            done < <(pgrep -x MacVitals 2>/dev/null || true)
            if [[ ${owned_count} -gt 1 ]]; then
              printf '%s\n' 'Multiple validation-owned MacVitals processes appeared' >&2
              exit 1
            fi
            if [[ ${owned_count} -eq 1 && -f "${READY_FILE}" ]]; then
              grep -Fxq 'surfaces-ready' "${READY_FILE}"
              ready=1
              break
            fi
            if ! kill -0 "${TEST_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ ${ready} -ne 1 || -z "${OWNED_PID}" ]]; then
            tail -n 400 physical-visual-test.log || true
            printf '%s\n' 'Physical visual host never reached the surfaces-ready resource window' >&2
            exit 1
          fi
          exact_pid_is_owned "${OWNED_PID}" "${EXPECTED_EXECUTABLE}"

          PROCESS_ID="${OWNED_PID}" \
          EXPECTED_EXECUTABLE_PATH="${EXPECTED_EXECUTABLE}" \
          OUTPUT_ROOT="${GITHUB_WORKSPACE}/physical-visual-runtime" \
            bash scripts/collect_runtime_metrics.sh 60 2 \
            > physical-visual-runtime-collector.log 2>&1
          cat physical-visual-runtime-collector.log

          summaries="$(find physical-visual-runtime -mindepth 2 -maxdepth 2 -type f -name summary.json -print)"
          summary_count="$(printf '%s\n' "${summaries}" | awk 'NF { count += 1 } END { print count + 0 }')"
          [[ "${summary_count}" == "1" ]]
          summary_path="$(printf '%s\n' "${summaries}" | awk 'NF { print; exit }')"
          [[ -n "${summary_path}" && -f "${summary_path}" ]]
          python3 scripts/report_runtime_resources.py \
            "${summary_path}" \
            --scenario post-flush-physical-visual \
            --source-sha "${PRODUCT_BASE_SHA}" \
            --output physical-visual-resource-summary.json \
            | tee physical-visual-resource-summary.txt

          set +e
          wait "${TEST_PID}"
          status=$?
          set -e
          TEST_PID=""
          tail -n 400 physical-visual-test.log > physical-visual-test-diagnostics.txt || true
          cat physical-visual-test-diagnostics.txt
          [[ ${status} -eq 0 ]]
          grep -Eq '\*\* TEST( EXECUTE)? SUCCEEDED \*\*' physical-visual-test.log
          grep -Eq "PhysicalVisualAcceptanceTests.*passed|testAcceptedHUDOverviewAndHistorySurfaces.*passed" \
            physical-visual-test.log

      - name: Verify physical visual and runtime evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import math

          root = Path("physical-visual-evidence")
          if root.is_symlink() or not root.is_dir():
              raise SystemExit("physical visual evidence root is unsafe")
          summary = json.loads((root / "physical-visual-summary.json").read_text(encoding="utf-8"))
          if summary.get("schemaVersion") != 1 or summary.get("result") != "passed":
              raise SystemExit("physical visual summary did not pass")
          if summary.get("preferencesWrittenByValidation") is not False:
              raise SystemExit("visual validation unexpectedly wrote preferences")
          if summary.get("resourceObservationHoldSeconds") != 70:
              raise SystemExit("visual host did not preserve the expected resource observation window")
          if summary.get("hudPanelCountBeforePopover") != 1:
              raise SystemExit("HUD was not a single AppKit panel")
          hud = summary.get("hud") or {}
          for key in ("safeAreaTop", "hardwareNotchWidth", "hardwareNotchCenterX", "frameX", "frameWidth", "frameHeight"):
              if not isinstance(hud.get(key), (int, float)) or not math.isfinite(float(hud[key])):
                  raise SystemExit(f"HUD geometry is missing or non-finite: {key}")
          if hud.get("panelVisible") is not True or hud.get("panelAllocated") is not True:
              raise SystemExit("HUD panel was not physically allocated and visible")
          if hud.get("indicatorCount") != "one" or hud.get("primaryMetric") != "cpu":
              raise SystemExit("accepted single CPU contour profile was not active")
          if float(hud["safeAreaTop"]) <= 0 or float(hud["hardwareNotchWidth"]) <= 0:
              raise SystemExit("physical notched-display evidence is missing")
          network = summary.get("network") or {}
          if int(network.get("historyCount", 0)) < 2:
              raise SystemExit("network history did not become live")
          for key in ("downloadBytesPerSecond", "uploadBytesPerSecond"):
              if not isinstance(network.get(key), (int, float)) or not math.isfinite(float(network[key])):
                  raise SystemExit(f"network rate is invalid: {key}")
          storage = summary.get("storage") or {}
          if int(storage.get("historyCount", 0)) < 2:
              raise SystemExit("storage history did not become live")
          if not (0 <= float(storage.get("usedFraction", -1)) <= 1):
              raise SystemExit("storage usage fraction is invalid")
          history = summary.get("historicalConsumption") or {}
          if int(history.get("memoryLeaderCount", 0)) <= 0 or history.get("firstRecordedAtPresent") is not True:
              raise SystemExit("historical leaders were not available")
          required = {
              "overview.png",
              "network-history.png",
              "storage-history.png",
              "historical-leaders.png",
              "fan-read-only.png",
          }
          if set(summary.get("captures") or []) != required:
              raise SystemExit("unexpected physical visual capture set")
          for name in sorted(required):
              path = root / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size <= 1024:
                  raise SystemExit(f"capture is missing or unsafe: {name}")

          resource = json.loads(Path("physical-visual-resource-summary.json").read_text(encoding="utf-8"))
          if resource.get("schemaVersion") != 1:
              raise SystemExit("runtime resource summary schema is invalid")
          if resource.get("scenario") != "post-flush-physical-visual":
              raise SystemExit("runtime resource scenario mismatch")
          if resource.get("sourceSha") != "9afc7d9ed904bdb394ea0d0a95c1995e265c472e":
              raise SystemExit("runtime resource source SHA mismatch")
          process = resource.get("process") or {}
          if process.get("name") != "MacVitals" or process.get("identityStable") is not True:
              raise SystemExit("runtime process identity was not stable")
          if process.get("aliveAtEnd") is not True:
              raise SystemExit("MacVitals did not remain alive through the runtime sample window")
          measurement = resource.get("measurement") or {}
          if int(measurement.get("sampleCount", 0)) < 30:
              raise SystemExit("runtime resource sample count is insufficient")
          if float(measurement.get("durationSeconds", 0)) < 55:
              raise SystemExit("runtime resource duration is insufficient")
          rss = measurement.get("residentMemoryMiB") or {}
          if not math.isfinite(float(rss.get("growth"))):
              raise SystemExit("runtime RSS growth is non-finite")
          threads = measurement.get("threads") or {}
          if threads.get("max") is None or not math.isfinite(float(threads["max"])):
              raise SystemExit("runtime thread evidence is missing")

          print(json.dumps({
              "result": "passed",
              "screen": [hud.get("screenWidth"), hud.get("screenHeight")],
              "safeAreaTop": hud.get("safeAreaTop"),
              "notchWidth": hud.get("hardwareNotchWidth"),
              "notchCenterX": hud.get("hardwareNotchCenterX"),
              "frame": [hud.get("frameX"), hud.get("frameY"), hud.get("frameWidth"), hud.get("frameHeight")],
              "networkHistoryCount": network.get("historyCount"),
              "storageHistoryCount": storage.get("historyCount"),
              "historicalLeaderCount": history.get("memoryLeaderCount"),
              "resourceSamples": measurement.get("sampleCount"),
              "resourceDurationSeconds": measurement.get("durationSeconds"),
              "rssGrowthMiB": rss.get("growth"),
              "threadsMax": threads.get("max"),
          }, indent=2, sort_keys=True))
          PY

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            printf 'schemaVersion=1\n'
            printf 'productBaseSHA=%s\n' "${PRODUCT_BASE_SHA}"
            printf 'validationSHA=%s\n' "${VALIDATION_SHA}"
            printf 'workflowRunID=%s\n' "${GITHUB_RUN_ID}"
            printf 'workflowRunAttempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'captureScope=MacVitals-owned-window-content-only\n'
            printf 'preferencesWrittenByValidation=false\n'
            for path in \
              physical-visual-source.txt \
              physical-visual-changes.txt \
              physical-visual-build.log \
              physical-visual-test.log \
              physical-visual-test-diagnostics.txt \
              physical-visual-runtime-collector.log \
              physical-visual-resource-summary.json \
              physical-visual-resource-summary.txt; do
              if [[ -f "${path}" && ! -L "${path}" ]]; then
                printf 'file=%s bytes=%s sha256=%s\n' \
                  "${path}" "$(stat -f %z "${path}")" "$(shasum -a 256 "${path}" | awk '{print $1}')"
              fi
            done
            find physical-visual-runtime physical-visual-evidence -type f -print 2>/dev/null \
              | LC_ALL=C sort | while IFS= read -r path; do
                [[ -f "${path}" && ! -L "${path}" ]]
                printf 'file=%s bytes=%s sha256=%s\n' \
                  "${path}" "$(stat -f %z "${path}")" "$(shasum -a 256 "${path}" | awk '{print $1}')"
              done
          } > physical-visual-manifest.txt

      - name: Upload physical visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: post-flush-physical-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            physical-visual-source.txt
            physical-visual-changes.txt
            physical-visual-build.log
            physical-visual-test.log
            physical-visual-test-diagnostics.txt
            physical-visual-runtime-collector.log
            physical-visual-resource-summary.json
            physical-visual-resource-summary.txt
            physical-visual-runtime/
            physical-visual-manifest.txt
            physical-visual-evidence/
          if-no-files-found: warn
          retention-days: 30
