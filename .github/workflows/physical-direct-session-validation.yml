name: Physical Direct-Session Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-direct-session-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  direct-session-validation:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'feature/macvitals-v1'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      MACVITALS_RUN_LONG_STABILITY: "0"

    steps:
      - name: Register runner privacy masks
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace_parent="$(dirname "${GITHUB_WORKSPACE}")"
          for value in "${HOME:-}" "${USER:-}" "$(id -un)" "$(hostname)" "${RUNNER_NAME:-}" "${GITHUB_WORKSPACE}" "${workspace_parent}"; do
            if [[ -n "${value}" && ${#value} -ge 3 ]]; then echo "::add-mask::${value}"; fi
          done

      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact native candidate
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]]
          [[ "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]]
          build_number=$((600000 + 10#${GITHUB_RUN_NUMBER}))
          version="0.0.${build_number}"
          echo "short_sha=${CANDIDATE_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "CANDIDATE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Resolve preinstalled developer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          developer_dir="$(xcode-select -p)"
          [[ -x "${developer_dir}/usr/bin/xcodebuild" ]] || { echo "Full Xcode is unavailable" >&2; exit 1; }
          echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
          swift_path="$(DEVELOPER_DIR="${developer_dir}" xcrun --find swift)"
          echo "$(dirname "${swift_path}")" >> "${GITHUB_PATH}"
          for candidate in "$(command -v xcodegen 2>/dev/null || true)" /opt/homebrew/bin/xcodegen /usr/local/bin/xcodegen; do
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              echo "$(dirname "${candidate}")" >> "${GITHUB_PATH}"
              exit 0
            fi
          done
          echo "xcodegen is unavailable" >&2
          exit 1

      - name: Generate, lint and test arm64
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/run_physical_validation_hardened.py \
            scripts/repair_sanitized_physical_xml.py \
            scripts/validate_fan_evidence.py
          bash -n scripts/run_ci_physical_validation_hardened.sh
          python3 scripts/run_physical_validation_hardened.py self-test
          python3 scripts/repair_sanitized_physical_xml.py --self-test
          python3 scripts/validate_fan_evidence.py --self-test
          bash scripts/run_ci_physical_validation_hardened.sh --self-test
          python3 scripts/materialize_app_icon.py
          python3 scripts/validate_localizations.py
          xcodegen generate
          swift format lint --recursive MacVitals MacVitalsFanProbe MacVitalsFanHelper MacVitalsTests MacVitalsUITests
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests

      - name: Build exact unsigned candidate
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.identity.outputs.build_number }}
          CODE_SIGNING_ALLOWED: NO
        run: |
          set -Eeuo pipefail
          bash scripts/package_release.sh "${CANDIDATE_VERSION}"
          python3 - "${CANDIDATE_SHA}" dist/BUILD_MANIFEST.json <<'PY'
          from pathlib import Path
          import json
          import sys

          expected = sys.argv[1]
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          actual = manifest.get("gitCommit")
          if actual != expected:
              raise SystemExit(
                  f"Physical candidate manifest commit {actual!r} does not match exact checkout {expected!r}"
              )
          print("Physical candidate manifest is bound to the exact checkout")
          PY

      - name: Collect read-only fan RPM evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_root="physical-validation-results"
          probe_root="${PWD}/build/fan-probe"
          probe="${probe_root}/Release/MacVitalsFanProbe"
          raw_evidence="${evidence_root}/fan-evidence.raw.json"
          evidence="${evidence_root}/fan-evidence.json"
          error_log="${evidence_root}/fan-evidence-error.log"
          rm -rf -- "${probe_root}"
          mkdir -p -- "${evidence_root}" "${probe_root}"
          xcodebuild -project MacVitals.xcodeproj -target MacVitalsFanProbe \
            -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO SYMROOT="${probe_root}" build
          [[ -x "${probe}" && ! -L "${probe}" ]] || { echo "Fan probe executable is missing" >&2; exit 1; }
          [[ "$(lipo -archs "${probe}")" == "arm64" ]] || { echo "Fan probe is not exactly arm64" >&2; exit 1; }
          set +e
          "${probe}" > "${raw_evidence}" 2> "${error_log}"
          probe_status=$?
          set -e
          if [[ ${probe_status} -ne 0 ]]; then
            cat "${error_log}" >&2
            exit "${probe_status}"
          fi
          rm -f -- "${error_log}"
          mv -- "${raw_evidence}" "${evidence}"
          python3 scripts/validate_fan_evidence.py \
            --require-available \
            --require-automatic \
            "${evidence}"

      - name: Collect through same-UID direct GUI session
        id: physical
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f physical-direct-session.raw.log physical-direct-session.log
          shim_root="$(mktemp -d /private/tmp/macvitals-launchctl-shim.XXXXXX)"
          trap 'rm -rf "${shim_root}"' EXIT
          cat > "${shim_root}/launchctl" <<'SHIM'
          #!/bin/bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "asuser" ]]; then
            [[ $# -ge 3 ]] || { echo "launchctl asuser shim requires UID and command" >&2; exit 64; }
            requested_uid="$2"
            shift 2
            [[ "${requested_uid}" == "$(id -u)" ]] || { echo "launchctl asuser shim refuses a foreign UID" >&2; exit 77; }
            exec "$@"
          fi
          exec /bin/launchctl "$@"
          SHIM
          chmod 700 "${shim_root}/launchctl"
          set +e
          PATH="${shim_root}:${PATH}" bash scripts/run_ci_physical_validation_hardened.sh \
            "${CANDIDATE_VERSION}" \
            build/MacVitals.xcarchive/Products/Applications/MacVitals.app \
            "${CANDIDATE_SHA}" \
            > physical-direct-session.raw.log 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "Direct-session physical collector exit status: ${status}"

      - name: Sanitize and authorize evidence
        id: privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          REDACT_HOME="${HOME:-}" REDACT_USER="$(id -un 2>/dev/null || true)" REDACT_HOST="$(hostname 2>/dev/null || true)" python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import re

          raw = Path("physical-direct-session.raw.log")
          safe = Path("physical-direct-session.log")
          root = Path("physical-validation-results")
          ready = Path("physical-direct-session-upload-ready.txt")
          ready.unlink(missing_ok=True)

          text = "Direct-session physical log was not created.\n"
          if raw.exists():
              if raw.is_symlink() or not raw.is_file() or raw.stat().st_nlink != 1:
                  raise SystemExit("Unsafe direct-session raw log")
              if raw.stat().st_size > 30 * 1024 * 1024:
                  raise SystemExit("Direct-session raw log exceeds 30 MiB")
              payload = raw.read_bytes()
              if b"\x00" in payload:
                  raise SystemExit("Direct-session raw log is binary")
              text = payload.decode("utf-8", errors="strict")

          home = os.environ.get("REDACT_HOME", "")
          user = os.environ.get("REDACT_USER", "")
          host = os.environ.get("REDACT_HOST", "")
          replacements = [(home, "<HOME>"), (host, "<HOST>")]
          if len(user) >= 3:
              replacements.append((user, "<USER>"))
          path_pattern = re.compile(r"/(?:Users|home)/[^/\s<]+")
          temp_pattern = re.compile(r"/private/(?:tmp|var)/[^\s<]+")
          battery_pattern = re.compile(r"\bInternalBattery-\d+(?:\s+\(id=\d+\))?")

          def clean(value: str) -> str:
              value = path_pattern.sub("<HOME>", value)
              value = temp_pattern.sub("<TEMP>", value)
              value = battery_pattern.sub("<BATTERY_ID>", value)
              for source, replacement in replacements:
                  if source:
                      value = value.replace(source, replacement)
              return value

          def verify_clean(value: str, label: str) -> None:
              forbidden = [source for source, _ in replacements if source]
              forbidden.append("InternalBattery-")
              for source in forbidden:
                  if source and source in value:
                      raise SystemExit(f"Direct-session privacy scan failed for {label}")
              if path_pattern.search(value) or temp_pattern.search(value):
                  raise SystemExit(f"Direct-session path privacy scan failed for {label}")

          text = clean(text)
          verify_clean(text, safe.name)
          safe.write_text(text, encoding="utf-8")
          raw.unlink(missing_ok=True)

          if root.exists():
              if root.is_symlink() or not root.is_dir():
                  raise SystemExit("Unsafe physical evidence root")
              total = 0
              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit("Symlink in physical evidence")
                  if path.is_dir():
                      continue
                  if not path.is_file() or path.stat().st_nlink != 1:
                      raise SystemExit("Unsafe physical evidence file")
                  total += path.stat().st_size
                  if total > 100 * 1024 * 1024:
                      raise SystemExit("Physical evidence exceeds 100 MiB")
                  payload = path.read_bytes()
                  if b"\x00" in payload:
                      raise SystemExit("Binary physical evidence is forbidden")
                  cleaned = clean(payload.decode("utf-8", errors="strict"))
                  verify_clean(cleaned, str(path))
                  path.write_text(cleaned, encoding="utf-8")

          ready.write_text("privacy-scan=passed\n", encoding="utf-8")
          PYCODE
          python3 scripts/repair_sanitized_physical_xml.py physical-validation-results
          python3 scripts/validate_fan_evidence.py \
            --require-available \
            --require-automatic \
            physical-validation-results/fan-evidence.json
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          tail -n 300 physical-direct-session.log

      - name: Upload direct-session physical evidence
        if: always() && steps.privacy.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-direct-session-${{ steps.identity.outputs.short_sha }}
          path: |
            physical-direct-session.log
            physical-direct-session-upload-ready.txt
            physical-validation-results/
            dist/BUILD_STATUS.txt
            dist/BUILD_MANIFEST.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact direct-session candidate
        if: always() && hashFiles('dist/BUILD_MANIFEST.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacVitals-${{ env.CANDIDATE_VERSION }}-${{ steps.identity.outputs.short_sha }}-direct-session-arm64-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Clean generated workspace data
        if: always()
        shell: bash
        run: |
          rm -rf build dist physical-validation-results physical-validation-apps staged-physical-artifacts MacVitals.xcodeproj MacVitals/Resources/AppIcon.icns
          rm -f physical-direct-session.raw.log physical-direct-session.log physical-direct-session-upload-ready.txt
          git clean -ffdX || true

      - name: Enforce direct-session results
        if: always()
        shell: bash
        env:
          PHYSICAL_STATUS: ${{ steps.physical.outputs.status }}
          PRIVACY_READY: ${{ steps.privacy.outputs.ready }}
        run: |
          set -Eeuo pipefail
          [[ "${PRIVACY_READY:-}" == "true" ]] || { echo "Direct-session privacy gate failed" >&2; exit 1; }
          [[ "${PHYSICAL_STATUS:-}" =~ ^[0-9]+$ ]] || { echo "Direct-session collector status is invalid" >&2; exit 1; }
          if [[ "${PHYSICAL_STATUS}" -ne 0 ]]; then
            echo "Direct-session physical collector failed with exit ${PHYSICAL_STATUS}" >&2
            exit "${PHYSICAL_STATUS}"
          fi
