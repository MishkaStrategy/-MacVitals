name: Shared Process Wakeup A/B

on:
  pull_request:
    branches:
      - fix/history-final-flush-a9d
    paths:
      - .github/workflows/shared-process-wakeup-ab.yml
      - MacVitalsTests/ProcessWakeupABTests.swift
      - scripts/process_wakeup_probe.c
      - scripts/run_shared_process_wakeup_ab.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wakeup-ab:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    concurrency:
      group: macvitals-physical-runtime
      cancel-in-progress: false
      queue: max
    env:
      LEGACY_REFERENCE_SHA: c10831e3717ca0bbf50ca0a8f784c8cca3da5411
      PRODUCT_SHA: 9afc7d9ed904bdb394ea0d0a95c1995e265c472e
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRODUCT_DERIVED: ${{ github.workspace }}/DerivedData-WakeupAB-Product
      EVIDENCE_DIR: ${{ github.workspace }}/shared-process-wakeup-evidence
      PROBE: /private/tmp/macvitals-process-wakeup-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact ancestry and validation-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(stat -f '%Su' /dev/console)" = "$(id -un)"
          launchctl print "gui/$(id -u)" >/dev/null
          [[ "${LEGACY_REFERENCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PRODUCT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${VALIDATION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"
          git merge-base --is-ancestor "${LEGACY_REFERENCE_SHA}" "${PRODUCT_SHA}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" "${VALIDATION_SHA}"
          git diff --quiet "${PRODUCT_SHA}" "${VALIDATION_SHA}" -- MacVitals project.yml MacVitalsUITests
          git diff --name-only "${PRODUCT_SHA}" "${VALIDATION_SHA}" > wakeup-ab-changes.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              ".github/workflows/shared-process-wakeup-ab.yml",
              "MacVitalsTests/ProcessWakeupABTests.swift",
              "scripts/process_wakeup_probe.c",
              "scripts/run_shared_process_wakeup_ab.sh",
          }
          actual = {
              line.strip()
              for line in Path("wakeup-ab-changes.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          if actual != expected:
              raise SystemExit(
                  f"wakeup A/B scope mismatch: expected={sorted(expected)} actual={sorted(actual)}"
              )
          PY
          grep -F 'private let provider = ProcessMetricsProvider()' \
            <(git show "${LEGACY_REFERENCE_SHA}:MacVitals/UI/Overview/ProcessConsumersView.swift")
          grep -F 'private let center = ProcessMetricsSamplingCenter.shared' \
            MacVitals/UI/Overview/ProcessConsumersView.swift
          grep -F 'private final class LegacyIndependentProcessConsumersMonitor' \
            MacVitalsTests/ProcessWakeupABTests.swift
          grep -F 'private let provider = ProcessMetricsProvider()' \
            MacVitalsTests/ProcessWakeupABTests.swift
          {
            printf 'legacy_reference_sha=%s\n' "${LEGACY_REFERENCE_SHA}"
            printf 'product_sha=%s\n' "${PRODUCT_SHA}"
            printf 'validation_sha=%s\n' "${VALIDATION_SHA}"
            printf 'runner_os=%s\n' "$(uname -s)"
            printf 'runner_arch=%s\n' "$(uname -m)"
            printf 'hardware_model=%s\n' "$(sysctl -n hw.model)"
            printf 'macos=%s (%s)\n' "$(sw_vers -productVersion)" "$(sw_vers -buildVersion)"
            printf 'comparison=controlled-current-source-architecture-models\n'
            printf 'pair_order=legacy-shared,shared-legacy,legacy-shared\n'
          } > wakeup-ab-source.txt

      - name: Validate measurement tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/run_shared_process_wakeup_ab.sh
          swift format lint MacVitalsTests/ProcessWakeupABTests.swift
          test -f scripts/collect_runtime_metrics.sh
          test -f scripts/report_runtime_resources.py
          xcrun clang \
            -std=c11 \
            -Wall -Wextra -Werror \
            scripts/process_wakeup_probe.c \
            -o "${PROBE}"
          test -x "${PROBE}"
          "${PROBE}" "$$" 1 > wakeup-probe-self-test.json
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path
          value = json.loads(Path("wakeup-probe-self-test.json").read_text(encoding="utf-8"))
          if value.get("schemaVersion") != 1 or float(value.get("durationSeconds", 0)) < 0.9:
              raise SystemExit("wakeup probe self-test is invalid")
          for key in (
              "packageIdleWakeupsDelta",
              "interruptWakeupsDelta",
              "packageIdleWakeupsPerSecond",
              "interruptWakeupsPerSecond",
          ):
              metric = value.get(key)
              if not isinstance(metric, (int, float)) or not math.isfinite(float(metric)) or float(metric) < 0:
                  raise SystemExit(f"invalid wakeup probe field: {key}")
          PY
          python3 scripts/report_runtime_resources.py --self-test
          python3 scripts/validate_runtime_resource_policy.py \
            scripts/run_shared_process_wakeup_ab.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run paired same-runner wakeup A/B
        shell: bash
        env:
          PRODUCT_SHA: ${{ env.PRODUCT_SHA }}
        run: |
          set -Eeuo pipefail
          bash scripts/run_shared_process_wakeup_ab.sh \
            "${GITHUB_WORKSPACE}" \
            "${PRODUCT_DERIVED}" \
            "${EVIDENCE_DIR}" \
            "${PROBE}"

      - name: Build quantitative A/B comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import math
          import statistics

          root = Path("shared-process-wakeup-evidence")
          groups = {}
          for label in ("legacy", "shared"):
              rows = []
              for index in (1, 2, 3):
                  run = root / label / f"run-{index}"
                  wakeups = json.loads((run / "wakeups.json").read_text(encoding="utf-8"))
                  resources = json.loads((run / "resource-summary.json").read_text(encoding="utf-8"))
                  measurement = resources["measurement"]
                  rows.append({
                      "iteration": index,
                      "packageIdleWakeupsPerSecond": float(wakeups["packageIdleWakeupsPerSecond"]),
                      "interruptWakeupsPerSecond": float(wakeups["interruptWakeupsPerSecond"]),
                      "cpuMeanPercent": float(measurement["cpuPercent"]["mean"]),
                      "rssGrowthMiB": float(measurement["residentMemoryMiB"]["growth"]),
                      "threadsMax": float(measurement["threads"]["max"]),
                  })
              for row in rows:
                  for key, value in row.items():
                      if key != "iteration" and not math.isfinite(float(value)):
                          raise SystemExit(f"non-finite {label} measurement: {key}")
              groups[label] = {
                  "runs": rows,
                  "medianPackageIdleWakeupsPerSecond": statistics.median(
                      row["packageIdleWakeupsPerSecond"] for row in rows),
                  "medianInterruptWakeupsPerSecond": statistics.median(
                      row["interruptWakeupsPerSecond"] for row in rows),
                  "medianCpuMeanPercent": statistics.median(row["cpuMeanPercent"] for row in rows),
              }

          legacy = groups["legacy"]
          shared = groups["shared"]
          def ratio(current, old):
              return None if old == 0 else current / old

          result = {
              "schemaVersion": 2,
              "result": "collected-pending-independent-review",
              "productSha": "9afc7d9ed904bdb394ea0d0a95c1995e265c472e",
              "legacyReferenceSha": "c10831e3717ca0bbf50ca0a8f784c8cca3da5411",
              "scenario": "two-concurrent-process-consumers-current-source-controlled-models",
              "sameBinary": True,
              "sameRunner": True,
              "repetitionsPerModel": 3,
              "pairOrder": ["legacy-shared", "shared-legacy", "legacy-shared"],
              "models": {
                  "legacy": "two validation-only monitors with independent current ProcessMetricsProvider actors",
                  "shared": "two real current ProcessConsumersMonitor instances using ProcessMetricsSamplingCenter.shared",
              },
              "metrics": groups,
              "ratiosSharedOverLegacy": {
                  "packageIdleWakeups": ratio(
                      shared["medianPackageIdleWakeupsPerSecond"],
                      legacy["medianPackageIdleWakeupsPerSecond"]),
                  "interruptWakeups": ratio(
                      shared["medianInterruptWakeupsPerSecond"],
                      legacy["medianInterruptWakeupsPerSecond"]),
                  "cpuMean": ratio(
                      shared["medianCpuMeanPercent"],
                      legacy["medianCpuMeanPercent"]),
              },
              "classification": {
                  "packageIdleWakeupsNoRegressionObserved": (
                      shared["medianPackageIdleWakeupsPerSecond"]
                      <= legacy["medianPackageIdleWakeupsPerSecond"]),
                  "interruptWakeupsNoRegressionObserved": (
                      shared["medianInterruptWakeupsPerSecond"]
                      <= legacy["medianInterruptWakeupsPerSecond"]),
                  "cpuNoRegressionObserved": (
                      shared["medianCpuMeanPercent"] <= legacy["medianCpuMeanPercent"]),
              },
              "causalityNote": (
                  "Both models use the exact current product provider and process host, so later provider fixes are controlled. "
                  "The legacy model reproduces PR #71 base ownership (one provider per monitor); the shared model uses the real current center. "
                  "Accepted PR #150 independently proves the production primary+historical topology coalesces through that center."
              ),
          }
          (root / "wakeup-ab-comparison.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Build evidence manifest
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          cp wakeup-ab-source.txt "${EVIDENCE_DIR}/source.txt" 2>/dev/null || true
          cp wakeup-ab-changes.txt "${EVIDENCE_DIR}/changes.txt" 2>/dev/null || true
          cp wakeup-probe-self-test.json "${EVIDENCE_DIR}/probe-self-test.json" 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          root = Path("shared-process-wakeup-evidence")
          entries = []
          if root.is_dir() and not root.is_symlink():
              for path in sorted(root.rglob("*")):
                  if not path.is_file() or path.is_symlink() or path.name == "evidence-manifest.json":
                      continue
                  data = path.read_bytes()
                  entries.append({
                      "path": str(path.relative_to(root)),
                      "size": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
          manifest = {
              "schemaVersion": 2,
              "legacyReferenceSha": os.environ.get("LEGACY_REFERENCE_SHA"),
              "productSha": os.environ.get("PRODUCT_SHA"),
              "validationSha": os.environ.get("VALIDATION_SHA"),
              "workflowRunID": os.environ.get("GITHUB_RUN_ID"),
              "workflowRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "files": entries,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / "evidence-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload wakeup A/B evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-process-wakeup-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared-process-wakeup-evidence
          if-no-files-found: error
          retention-days: 30
