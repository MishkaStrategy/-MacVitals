name: Validate Custom Preset Persistence

on:
  push:
    branches: [validation/custom-preset-persistence]
    paths:
      - .github/workflows/custom-preset-persistence-validation.yml

concurrency:
  group: custom-preset-persistence-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    env:
      PRODUCT_SHA: d918f35ca09f2b5b56cebc67bc39047ae50d34e5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build exact source and run focused tests
        id: validation
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="${RUNNER_TEMP}/macvitals-custom-preset-source"
          result_file="${RUNNER_TEMP}/macvitals-custom-preset-result"
          log_file="${RUNNER_TEMP}/macvitals-custom-preset.log"
          rm -rf -- "${source_dir}" "${result_file}" "${log_file}"
          mkdir -p -- "${source_dir}"
          cd "${source_dir}"

          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64)"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --no-tags --depth=1 origin "${PRODUCT_SHA}"
          git checkout -q --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "${PRODUCT_SHA}" ]]
          [[ "$(uname -s)" == "Darwin" && "$(uname -m)" == "arm64" ]]

          export DEVELOPER_DIR="$(xcode-select -p)"
          xcodegen_path=""
          for candidate in "$(command -v xcodegen 2>/dev/null || true)" /opt/homebrew/bin/xcodegen /usr/local/bin/xcodegen; do
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              xcodegen_path="${candidate}"
              break
            fi
          done
          [[ -n "${xcodegen_path}" ]]

          python3 scripts/materialize_app_icon.py
          "${xcodegen_path}" generate
          rm -rf build/custom-preset-validation

          {
            xcodebuild \
              -project MacVitals.xcodeproj \
              -scheme MacVitals \
              -configuration Release \
              -derivedDataPath build/custom-preset-validation-release \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              build

            xcodebuild \
              -project MacVitals.xcodeproj \
              -scheme MacVitals \
              -configuration Debug \
              -derivedDataPath build/custom-preset-validation-tests \
              -destination 'platform=macOS,arch=arm64' \
              -only-testing:MacVitalsTests/MenuLayoutRulesTests \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              test
          } 2>&1 | tee "${log_file}"

          printf 'success\n' > "${result_file}"

      - name: Record validation result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          result_file="${RUNNER_TEMP}/macvitals-custom-preset-result"
          log_file="${RUNNER_TEMP}/macvitals-custom-preset.log"
          result="failure"
          if [[ -f "${result_file}" && "$(cat "${result_file}")" == "success" ]]; then
            result="success"
          fi

          status_repo="${RUNNER_TEMP}/macvitals-custom-preset-status"
          rm -rf -- "${status_repo}"
          git clone -q --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${status_repo}"
          cd "${status_repo}"
          mkdir -p build-status

          diagnostics=""
          if [[ -f "${log_file}" ]]; then
            diagnostics="$(tail -n 80 "${log_file}")"
          fi

          RESULT="${result}" PRODUCT_SHA="${PRODUCT_SHA}" WORKFLOW_SHA="${GITHUB_SHA}" DIAGNOSTICS="${diagnostics}" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "result": os.environ["RESULT"],
              "architecture": "arm64",
              "sourceSha": os.environ["WORKFLOW_SHA"],
              "productSourceSha": os.environ["PRODUCT_SHA"],
              "releaseBuildRun": True,
              "testsRun": True,
              "testTarget": "MacVitalsTests/MenuLayoutRulesTests",
              "diagnostics": os.environ.get("DIAGNOSTICS", ""),
              "finishedAt": datetime.now(timezone.utc).isoformat(),
          }
          Path("build-status/custom-preset-persistence-validation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/custom-preset-persistence-validation.json
          git commit -m "ci: record custom preset persistence validation [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

          [[ "${result}" == "success" ]]
