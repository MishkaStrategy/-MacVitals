name: Main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
