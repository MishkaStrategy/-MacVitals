name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-arm64:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate localization, app icon and runtime tooling
        run: |
          python3 -m py_compile scripts/materialize_app_icon.py scripts/validate_localizations.py scripts/collect_runtime_metrics.py scripts/validate_runtime_metrics.py scripts/run_physical_validation.py scripts/run_physical_validation_guided.py scripts/prepare_physical_artifact.py scripts/sign_notarize_release.py scripts/signed_release_entrypoint.py
          python3 scripts/materialize_app_icon.py --self-test
          python3 scripts/materialize_app_icon.py
          python3 scripts/validate_localizations.py
          python3 scripts/collect_runtime_metrics.py --self-test
          python3 scripts/validate_runtime_metrics.py --self-test
          python3 scripts/run_physical_validation.py self-test
          python3 scripts/run_physical_validation_guided.py self-test
          python3 scripts/prepare_physical_artifact.py self-test
          python3 scripts/sign_notarize_release.py self-test
          python3 scripts/signed_release_entrypoint.py self-test
          bash -n \
            scripts/package_release.sh \
            scripts/verify_release.sh \
            scripts/collect_runtime_metrics.sh \
            scripts/run_ci_runtime_smoke.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Swift format lint
        run: swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests

      - name: Run arm64 unit and hardware-smoke tests
        run: >-
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals
          -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests

      - name: Package and verify unsigned arm64 main candidate
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGNING_ALLOWED: NO
        run: bash scripts/package_release.sh "0.0.${GITHUB_RUN_NUMBER}"

      - name: Packaged runtime smoke guardrail
        timeout-minutes: 5
        run: |
          set +e
          bash scripts/run_ci_runtime_smoke.sh \
            build/MacVitals.xcarchive/Products/Applications/MacVitals.app \
            > runtime-smoke-run.log 2>&1
          status=$?
          cat runtime-smoke-run.log
          exit $status

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-smoke-evidence-arm64
          path: |
            runtime-smoke-run.log
            runtime-smoke-results/
          if-no-files-found: ignore

      - name: Upload verified unsigned arm64 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacVitals-main-0.0.${{ github.run_number }}-arm64-unsigned
          path: dist/
          if-no-files-found: error
