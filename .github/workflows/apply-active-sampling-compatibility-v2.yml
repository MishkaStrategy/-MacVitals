name: Apply Active Sampling Compatibility V2

on:
  push:
    branches: [feature/power-aware-sampling-intervals]
    paths:
      - .github/workflows/apply-active-sampling-compatibility-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply staged compatibility patch
        shell: bash
        run: |
          set -Eeuo pipefail
          workdir="${RUNNER_TEMP}/macvitals-active-sampling-v2"
          rm -rf -- "${workdir}"
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${workdir}"
          cd "${workdir}"
          python3 .github/scripts/apply_active_sampling_compatibility.py
          rm -f \
            .github/scripts/apply_active_sampling_compatibility.py \
            .github/workflows/apply-active-sampling-compatibility-v2.yml \
            .github/workflows/one-shot-active-sampling-compatibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: expose active power-aware sampling interval"
          git push origin "HEAD:${GITHUB_REF_NAME}"
