name: README Screenshots

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: readme-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Capture real application screenshots
        run: |
          result_bundle="${RUNNER_TEMP}/MacVitals-readme-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xcresult"
          screenshot_dir="${RUNNER_TEMP}/macvitals-readme-screenshots"
          rm -rf "${result_bundle}" "${screenshot_dir}"
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -destination 'platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -resultBundlePath "${result_bundle}" \
            clean test \
            -only-testing:MacVitalsUITests/MacVitalsUITests/testCaptureReadmeScreenshots
          xcrun xcresulttool export attachments \
            --path "${result_bundle}" \
            --output-path "${screenshot_dir}"
          test "$(find "${screenshot_dir}" -type f -name '*.png' | wc -l | tr -d ' ')" -eq 4

      - name: Upload real application screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readme-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/macvitals-readme-screenshots/
          if-no-files-found: error
          retention-days: 30
