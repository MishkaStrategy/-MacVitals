name: README Screenshots

# Run manually on a non-main branch to refresh real documentation images.
on:
  workflow_dispatch:

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Capture real application screenshots
        run: |
          result_bundle="${RUNNER_TEMP}/MacVitals-readme-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xcresult"
          export_dir="${RUNNER_TEMP}/macvitals-readme-export"
          screenshot_dir="docs/screenshots"
          rm -rf "${result_bundle}" "${export_dir}" "${screenshot_dir}"
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -destination 'platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -resultBundlePath "${result_bundle}" \
            clean test \
            -only-testing:MacVitalsUITests/MacVitalsUITests/testCaptureReadmeScreenshots
          xcrun xcresulttool export attachments \
            --path "${result_bundle}" \
            --output-path "${export_dir}"
          python3 - "${export_dir}" "${screenshot_dir}" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          export_dir = Path(sys.argv[1])
          screenshot_dir = Path(sys.argv[2])
          manifest = json.loads((export_dir / "manifest.json").read_text())
          expected = {
              "status-bar-overview",
              "preferences-general",
              "preferences-menu-bar",
              "preferences-fans",
              "preferences-diagnostics",
          }
          attachments = manifest[0]["attachments"]
          found = set()
          screenshot_dir.mkdir(parents=True, exist_ok=True)
          for attachment in attachments:
              name = attachment["suggestedHumanReadableName"].split("_0_", 1)[0]
              if name not in expected:
                  continue
              source = export_dir / attachment["exportedFileName"]
              target = screenshot_dir / f"{name}.png"
              shutil.copyfile(source, target)
              found.add(name)
          if found != expected:
              raise SystemExit(
                  f"screenshot set mismatch: missing={sorted(expected - found)} "
                  f"extra={sorted(found - expected)}"
              )
          PY

          status_image="${screenshot_dir}/status-bar-overview.png"
          crop_script="${RUNNER_TEMP}/crop-status-bar.swift"
          cat > "${crop_script}" <<'SWIFT'
          import AppKit
          import Foundation

          guard CommandLine.arguments.count == 2 else {
            fatalError("Expected a screenshot path")
          }

          let path = CommandLine.arguments[1]
          guard let source = NSImage(contentsOfFile: path) else {
            fatalError("Unable to load status-bar screenshot")
          }

          let cropWidth = min(CGFloat(900), source.size.width)
          let cropHeight = min(CGFloat(820), source.size.height)
          let cropRect = NSRect(
            x: source.size.width - cropWidth,
            y: source.size.height - cropHeight,
            width: cropWidth,
            height: cropHeight)
          let targetSize = NSSize(width: 900, height: 820)
          let output = NSImage(size: targetSize)
          output.lockFocus()
          NSGraphicsContext.current?.imageInterpolation = .high
          source.draw(
            in: NSRect(origin: .zero, size: targetSize),
            from: cropRect,
            operation: .copy,
            fraction: 1)
          output.unlockFocus()

          guard
            let tiff = output.tiffRepresentation,
            let bitmap = NSBitmapImageRep(data: tiff),
            let png = bitmap.representation(using: .png, properties: [:])
          else {
            fatalError("Unable to encode cropped status-bar screenshot")
          }
          try png.write(to: URL(fileURLWithPath: path), options: .atomic)
          SWIFT
          swift "${crop_script}" "${status_image}"

          test "$(find "${screenshot_dir}" -type f -name '*.png' | wc -l | tr -d ' ')" -eq 5
          for image in "${screenshot_dir}"/preferences-*.png; do
            test "$(sips -g pixelWidth "${image}" | awk '/pixelWidth/ {print $2}')" -eq 900
            test "$(sips -g pixelHeight "${image}" | awk '/pixelHeight/ {print $2}')" -eq 728
          done
          test "$(sips -g pixelWidth "${status_image}" | awk '/pixelWidth/ {print $2}')" -eq 900
          test "$(sips -g pixelHeight "${status_image}" | awk '/pixelHeight/ {print $2}')" -eq 820

      - name: Commit real application screenshots
        run: |
          if [ -z "${TARGET_BRANCH}" ] || [ "${TARGET_BRANCH}" = "main" ]; then
            echo "Refusing to auto-commit README screenshots directly to main"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "README screenshots are already current"
            exit 0
          fi
          git commit -m "docs: refresh Russian MacVitals screenshots"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "${TARGET_BRANCH}"
          git rebase "origin/${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload real application screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readme-screenshots-${{ github.sha }}
          path: docs/screenshots/
          if-no-files-found: error
          retention-days: 30
