name: Apply minimal protected-folder guard

on:
  pull_request:
    branches:
      - feature/macvitals-v1
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/process-consumers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/process-consumers
          fetch-depth: 0

      - name: Add fail-closed protected-folder guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          provider_path = Path('MacVitals/Providers/Processes/ProcessMetricsProvider.swift')
          provider = provider_path.read_text(encoding='utf-8')
          marker = 'actor ProcessMetricsProvider {'
          policy = '''nonisolated enum ProcessFilePrivacyPolicy {
            /// Kernel-reported paths are opaque identifiers only. MacVitals must not
            /// open another process's executable, app bundle, icon, or user folder.
            static func permitsFileMetadataAccess(_ path: String?) -> Bool {
              _ = path
              return false
            }
          }

          '''
          if 'enum ProcessFilePrivacyPolicy' not in provider:
            if marker not in provider:
              raise SystemExit('provider marker missing')
            provider = provider.replace(marker, policy + marker, 1)

          unsafe_if = 'if let appPath = applicationBundlePath(from: sample.executablePath) {'
          guarded_if = '''if let appPath = applicationBundlePath(from: sample.executablePath),
                ProcessFilePrivacyPolicy.permitsFileMetadataAccess(appPath)
              {'''
          if unsafe_if in provider:
            provider = provider.replace(unsafe_if, guarded_if, 1)
          elif guarded_if not in provider:
            raise SystemExit('bundle access site missing')

          provider = provider.replace('iconPath: appPath)', 'iconPath: nil)', 1)
          provider = provider.replace('iconPath: path)', 'iconPath: nil)', 1)
          provider_path.write_text(provider, encoding='utf-8')

          view_path = Path('MacVitals/UI/Overview/ProcessConsumersView.swift')
          view = view_path.read_text(encoding='utf-8')
          unsafe_icon = 'if let path = application.iconPath {'
          guarded_icon = '''if let path = application.iconPath,
                ProcessFilePrivacyPolicy.permitsFileMetadataAccess(path)
              {'''
          if unsafe_icon in view:
            view = view.replace(unsafe_icon, guarded_icon, 1)
          elif guarded_icon not in view:
            raise SystemExit('icon access site missing')
          view_path.write_text(view, encoding='utf-8')

          tests_path = Path('MacVitalsTests/ProcessMetricsProviderTests.swift')
          tests = tests_path.read_text(encoding='utf-8')
          privacy_tests = '''  func testProcessMetricsNeverOpenProtectedUserLocations() {
            let protectedPaths = [
              "/Users/test/Desktop/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Documents/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Downloads/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Music/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Movies/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Pictures/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Library/Mobile Documents/Tool.app/Contents/MacOS/Tool",
            ]

            for path in protectedPaths {
              XCTAssertFalse(ProcessFilePrivacyPolicy.permitsFileMetadataAccess(path), path)
            }
          }

          func testProcessMetricsFailClosedForEveryFilePath() {
            XCTAssertFalse(
              ProcessFilePrivacyPolicy.permitsFileMetadataAccess(
                "/Applications/Safari.app/Contents/MacOS/Safari"))
            XCTAssertFalse(ProcessFilePrivacyPolicy.permitsFileMetadataAccess(nil))
          }

          '''
          test_marker = '  private func sample(\n'
          if 'testProcessMetricsNeverOpenProtectedUserLocations' not in tests:
            if test_marker not in tests:
              raise SystemExit('test marker missing')
            tests = tests.replace(test_marker, privacy_tests + test_marker, 1)
          tests_path.write_text(tests, encoding='utf-8')

          assert 'ProcessFilePrivacyPolicy.permitsFileMetadataAccess(appPath)' in provider
          assert 'iconPath: appPath)' not in provider
          assert 'iconPath: path)' not in provider
          assert 'ProcessFilePrivacyPolicy.permitsFileMetadataAccess(path)' in view
          PY

          git diff --check
          git config user.name 'MacVitals Privacy Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            MacVitals/Providers/Processes/ProcessMetricsProvider.swift \
            MacVitals/UI/Overview/ProcessConsumersView.swift \
            MacVitalsTests/ProcessMetricsProviderTests.swift
          if git diff --cached --quiet; then
            echo 'Protected-folder guard already applied.'
            exit 0
          fi
          git commit -m 'fix: block protected-folder access in process metrics'
          git pull --rebase origin agent/process-consumers
          git push origin HEAD:agent/process-consumers
