name: UI Test Compile Guard

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ui-test-compile-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-ui-tests-without-launch:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact source and platform
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Validate scheme isolation
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'yaml'
          project = YAML.load_file('project.yml')
          schemes = project.fetch('schemes')
          main = schemes.fetch('MacVitals')
          main_build = main.fetch('build').fetch('targets')
          main_tests = main.fetch('test').fetch('targets')
          ui_build = schemes.fetch('MacVitalsUITestsBuild')

          abort 'MacVitalsUITests must not be in the main build action' if main_build.key?('MacVitalsUITests')
          abort 'MacVitalsUITests must not be in the main test action' if main_tests.include?('MacVitalsUITests')
          abort 'MacVitalsUITestsBuild must not have a test action' if ui_build.key?('test')
          abort 'MacVitalsUITestsBuild must compile MacVitalsUITests' unless ui_build.fetch('build').fetch('targets').key?('MacVitalsUITests')
          RUBY

      - name: Fail closed on an existing UI test runner
        shell: bash
        run: |
          set -euo pipefail
          existing="$(pgrep -x MacVitalsUITests-Runner 2>/dev/null || true)"
          if [[ -n "${existing}" ]]; then
            echo 'Refusing to compile while a MacVitalsUITests-Runner process already exists.' >&2
            while IFS= read -r pid; do
              [[ "${pid}" =~ ^[0-9]+$ ]] || continue
              ps -p "${pid}" -o pid=,command= >&2 || true
            done <<< "${existing}"
            exit 1
          fi

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Compile UI tests without test action
        shell: bash
        run: |
          set +e
          derived_data="${RUNNER_TEMP}/MacVitals-ui-compile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "${derived_data}"

          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitalsUITestsBuild \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "${derived_data}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            > ui-test-compile.log 2>&1
          build_status=$?

          runner_status=0
          unexpected="$(pgrep -x MacVitalsUITests-Runner 2>/dev/null || true)"
          if [[ -n "${unexpected}" ]]; then
            echo 'MacVitalsUITests-Runner was launched unexpectedly.' >&2
            while IFS= read -r pid; do
              [[ "${pid}" =~ ^[0-9]+$ ]] || continue
              command_line="$(ps -p "${pid}" -o command= 2>/dev/null || true)"
              if [[ "${command_line}" == "${derived_data}/"* ]]; then
                echo "Stopping exact job-owned UI runner pid ${pid}." >&2
                kill -TERM "${pid}" 2>/dev/null || true
                for _ in {1..20}; do
                  kill -0 "${pid}" 2>/dev/null || break
                  sleep 0.25
                done
                if kill -0 "${pid}" 2>/dev/null; then
                  kill -KILL "${pid}" 2>/dev/null || true
                fi
              else
                echo "Foreign UI runner was not terminated: pid=${pid} command=${command_line}" >&2
              fi
            done <<< "${unexpected}"
            runner_status=1
          fi

          grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)' \
            ui-test-compile.log | tail -n 400 > ui-test-compile-diagnostics.txt || true
          cat ui-test-compile-diagnostics.txt

          rm -rf -- "${derived_data}"

          if [[ ${build_status} -ne 0 || ${runner_status} -ne 0 ]]; then
            exit 1
          fi

      - name: Upload UI compile diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-compile-diagnostics
          path: |
            ui-test-compile.log
            ui-test-compile-diagnostics.txt
          if-no-files-found: ignore
