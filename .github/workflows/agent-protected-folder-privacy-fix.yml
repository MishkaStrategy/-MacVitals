name: Apply protected-folder privacy fix

on:
  push:
    branches:
      - agent/process-consumers

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply protected-folder privacy fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/process-consumers
          fetch-depth: 0

      - name: Remove process file-system metadata access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          provider_path = Path('MacVitals/Providers/Processes/ProcessMetricsProvider.swift')
          provider = provider_path.read_text(encoding='utf-8')

          policy = '''nonisolated enum ProcessFilePrivacyPolicy {
            /// Process accounting may use kernel-reported paths as opaque identifiers only.
            /// It must never open an executable, app bundle, icon, or user folder.
            static func permitsFileMetadataAccess(_ executablePath: String?) -> Bool {
              _ = executablePath
              return false
            }
          }

          '''
          marker = 'actor ProcessMetricsProvider {'
          if 'enum ProcessFilePrivacyPolicy' not in provider:
            if marker not in provider:
              raise SystemExit('ProcessMetricsProvider marker missing')
            provider = provider.replace(marker, policy + marker, 1)

          old_descriptor = '''  private func applicationDescriptor(for sample: ProcessCounterSample) -> ApplicationDescriptor {
            if let appPath = applicationBundlePath(from: sample.executablePath) {
              let bundle = Bundle(path: appPath)
              let bundleID = bundle?.bundleIdentifier
              let displayName = (bundle?.object(forInfoDictionaryKey: "CFBundleDisplayName") as? String)
                ?? (bundle?.object(forInfoDictionaryKey: "CFBundleName") as? String)
                ?? URL(fileURLWithPath: appPath).deletingPathExtension().lastPathComponent
              return ApplicationDescriptor(
                id: bundleID ?? appPath,
                name: displayName,
                bundleIdentifier: bundleID,
                iconPath: appPath)
            }

            let path = sample.executablePath
            return ApplicationDescriptor(
              id: path ?? "process:\\(sample.name)",
              name: sample.name,
              bundleIdentifier: nil,
              iconPath: path)
          }
          '''
          new_descriptor = '''  private func applicationDescriptor(for sample: ProcessCounterSample) -> ApplicationDescriptor {
            // `proc_pidpath` is used only as an opaque kernel-reported identifier. Do not
            // create Bundle/URL-resource/NSWorkspace objects from arbitrary process paths:
            // an app may be running from Documents, Desktop, Downloads, Music, iCloud Drive,
            // or another TCC-protected user location.
            let path = sample.executablePath
            let appPath = applicationBundlePath(from: path)
            let displayName = appPath.map {
              URL(fileURLWithPath: $0).deletingPathExtension().lastPathComponent
            } ?? sample.name
            return ApplicationDescriptor(
              id: appPath ?? path ?? "process:\\(sample.name)",
              name: displayName,
              bundleIdentifier: nil,
              iconPath: nil)
          }
          '''
          if old_descriptor in provider:
            provider = provider.replace(old_descriptor, new_descriptor, 1)
          elif new_descriptor not in provider:
            raise SystemExit('Expected applicationDescriptor implementation missing')

          if 'Bundle(path: appPath)' in provider:
            raise SystemExit('Unsafe Bundle(path:) access remains')
          provider_path.write_text(provider, encoding='utf-8')

          view_path = Path('MacVitals/UI/Overview/ProcessConsumersView.swift')
          view = view_path.read_text(encoding='utf-8')
          view = view.replace('import AppKit\n', '', 1)
          old_icon = '''  @ViewBuilder
            private func applicationIcon(_ application: ApplicationProcessUsage) -> some View {
              if let path = application.iconPath {
                Image(nsImage: NSWorkspace.shared.icon(forFile: path))
                  .resizable()
                  .scaledToFit()
                  .accessibilityHidden(true)
              } else {
                Image(systemName: "app.dashed")
                  .font(.title3)
                  .foregroundStyle(.secondary)
                  .accessibilityHidden(true)
              }
            }
          '''
          new_icon = '''  private func applicationIcon(_ application: ApplicationProcessUsage) -> some View {
            // Never resolve icons from arbitrary executable paths. NSWorkspace.icon(forFile:)
            // can trigger macOS protected-folder prompts for another process's location.
            Image(systemName: application.bundleIdentifier == nil ? "app.dashed" : "app")
              .font(.title3)
              .foregroundStyle(.secondary)
              .accessibilityHidden(true)
          }
          '''
          if old_icon in view:
            view = view.replace(old_icon, new_icon, 1)
          elif new_icon not in view:
            raise SystemExit('Expected applicationIcon implementation missing')
          if 'NSWorkspace.shared.icon(forFile:' in view:
            raise SystemExit('Unsafe NSWorkspace icon lookup remains')
          view_path.write_text(view, encoding='utf-8')

          tests_path = Path('MacVitalsTests/ProcessMetricsProviderTests.swift')
          tests = tests_path.read_text(encoding='utf-8')
          privacy_tests = '''  func testProcessMetricsNeverOpenProtectedUserLocations() {
            let protectedPaths = [
              "/Users/test/Desktop/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Documents/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Downloads/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Music/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Movies/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Pictures/Tool.app/Contents/MacOS/Tool",
              "/Users/test/Library/Mobile Documents/Tool.app/Contents/MacOS/Tool",
            ]

            for path in protectedPaths {
              XCTAssertFalse(ProcessFilePrivacyPolicy.permitsFileMetadataAccess(path), path)
            }
          }

          func testProcessMetricsDoNotOpenSystemApplicationFilesEither() {
            XCTAssertFalse(
              ProcessFilePrivacyPolicy.permitsFileMetadataAccess(
                "/Applications/Safari.app/Contents/MacOS/Safari"))
          }

          '''
          test_marker = '  private func sample(\n'
          if 'testProcessMetricsNeverOpenProtectedUserLocations' not in tests:
            if test_marker not in tests:
              raise SystemExit('ProcessMetricsProviderTests marker missing')
            tests = tests.replace(test_marker, privacy_tests + test_marker, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'MacVitals Privacy Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            MacVitals/Providers/Processes/ProcessMetricsProvider.swift \
            MacVitals/UI/Overview/ProcessConsumersView.swift \
            MacVitalsTests/ProcessMetricsProviderTests.swift
          git commit -m 'fix: avoid protected-folder access in process metrics'
          git push origin HEAD:agent/process-consumers
