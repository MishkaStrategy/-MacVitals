name: Physical Test Adaptive Notch Contour

on:
  pull_request:
    branches: [fix/adaptive-notch-contour]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-adaptive-notch-contour
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-adaptive-notch-contour:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'test/adaptive-notch-contour-physical'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      APP_ARTIFACT_ID: '8884404997'
      APP_ARTIFACT_DIGEST: '34856c0477acf98534d735989117d37aa6eb51100994e2a89d6155c5f7be57b8'
      FEATURE_HEAD_SHA: '9c4a01061efd9b078db37e63a3c4bea355d9fe2e'
      SOURCE_WORKFLOW_COMMIT: 'fb378feab39f99f0c9adf071613d235eaa80fadf'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Validate adaptive contour source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'static func screenGeometry(for screen: NSScreen)' \
            MacVitals/MenuBar/NotchHUDLayout.swift
          grep -F 'screen.convertRectToBacking(cutoutRect)' \
            MacVitals/MenuBar/NotchHUDLayout.swift
          grep -F 'screen.convertRectFromBacking(alignedBackingRect)' \
            MacVitals/MenuBar/NotchHUDLayout.swift
          grep -F 'static func outwardIntegralBackingRect' \
            MacVitals/MenuBar/NotchHUDLayout.swift
          grep -F 'return safeAreaTop' \
            MacVitals/MenuBar/NotchHUDLayout.swift
          if grep -F 'maximumSafeAreaTop' MacVitals/MenuBar/NotchHUDLayout.swift; then
            echo 'Legacy safe-area model clamp is still present' >&2
            exit 1
          fi
          grep -F 'if hasHardwareNotch, screenGeometry.notch == nil' \
            MacVitals/MenuBar/NotchHUDController.swift
          grep -F 'func refreshLayout(preferredScreen: NSScreen?)' \
            MacVitals/MenuBar/NotchHUDController.swift
          grep -F 'NSApplication.didChangeScreenParametersNotification' \
            MacVitals/MenuBar/StatusItemController.swift
          grep -F 'NSWindow.didChangeScreenNotification' \
            MacVitals/MenuBar/StatusItemController.swift
          grep -F 'NSWindow.didChangeBackingPropertiesNotification' \
            MacVitals/MenuBar/StatusItemController.swift

      - name: Materialize portable physical script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/physical-test-dual-notch-indicator.yml?ref=${SOURCE_WORKFLOW_COMMIT}" \
            > /tmp/source-workflow.json

          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/source-workflow.json').read_text(encoding='utf-8'))
          source = base64.b64decode(payload['content']).decode('utf-8').splitlines()
          step = next(
              index for index, line in enumerate(source)
              if line.strip() == '- name: Validate physical single and dual indicator modes')
          run_line = next(
              index for index in range(step + 1, len(source))
              if source[index].strip() == 'run: |')
          end = next(
              index for index in range(run_line + 1, len(source))
              if source[index].startswith('      - name:'))
          body = [
              line[10:] if line.startswith('          ') else line
              for line in source[run_line + 1:end]
          ]
          script = '\n'.join(body) + '\n'
          replacements = {
              "printf 'timestamp,cpu_percent,rss_kib,threads\\n'":
                  "printf 'timestamp,cpu_percent,rss_kib\\n'",
              'ps -p "${app_pid}" -o lstart=,%cpu=,rss=,thcount=':
                  'ps -p "${app_pid}" -o lstart=,%cpu=,rss=',
              '.rsplit(" ",3)': '.rsplit(" ",2)',
              "expected_height = resolved_safe_area + (30 if expected_labels else 8)":
                  "expected_height = resolved_safe_area + (32 if expected_labels else 20)",
              "assert abs(d['frameWidth'] - 356) <= 3, d":
                  "assert d['hardwareNotchWidth'] > 0, d\n"
                  "assert d['resolvedSafeAreaTop'] > 0, d\n"
                  "assert abs(d['resolvedSafeAreaTop'] - d['safeAreaTop']) <= 1.0, d\n"
                  "assert d['backingScaleFactor'] >= 1, d\n"
                  "assert math.isclose(d['resolvedNotchWidth'], d['hardwareNotchWidth'], abs_tol=0.5), d\n"
                  "assert abs(d['frameWidth'] - (d['hardwareNotchWidth'] + 144)) <= 3, d",
              "expected_x = d['screenX'] + (d['screenWidth'] - d['frameWidth']) / 2":
                  "expected_x = d['hardwareNotchCenterX'] - d['frameWidth'] / 2",
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f'expected one physical script target: {old!r}')
              script = script.replace(old, new, 1)
          Path('/tmp/run-physical-adaptive-notch.sh').write_text(script, encoding='utf-8')
          PY
          grep -F '32 if expected_labels else 20' /tmp/run-physical-adaptive-notch.sh
          grep -F "d['resolvedSafeAreaTop']" /tmp/run-physical-adaptive-notch.sh
          grep -F "d['hardwareNotchWidth'] + 144" /tmp/run-physical-adaptive-notch.sh
          grep -F "d['hardwareNotchCenterX'] - d['frameWidth'] / 2" \
            /tmp/run-physical-adaptive-notch.sh
          bash -n /tmp/run-physical-adaptive-notch.sh

      - name: Validate physical adaptive notch contour
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash /tmp/run-physical-adaptive-notch.sh

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-adaptive-notch-contour-evidence
          path: physical-evidence/
          if-no-files-found: error
          retention-days: 30
