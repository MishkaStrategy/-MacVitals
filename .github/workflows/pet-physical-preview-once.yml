name: Pet Physical Preview Once

on:
  pull_request:
    branches:
      - agent/status-bar-electric-dragon
    types: [synchronize]
    paths:
      - .github/workflows/pet-physical-preview-once.yml

permissions:
  contents: read

concurrency:
  group: pet-physical-preview-once
  cancel-in-progress: false

jobs:
  physical-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/detailed-electric-dragon-model'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    env:
      DERIVED_DATA: ${{ runner.temp }}/MacVitalsPetPhysicalPreview
      PREVIEW_SECONDS: "900"

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Validate physical GUI session
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -m)" == "arm64" ]] || { echo "Native arm64 is required." >&2; exit 1; }

          console_user="$(stat -f '%Su' /dev/console)"
          runner_user="$(id -un)"
          [[ -n "${console_user}" && "${console_user}" != "root" && "${console_user}" != "loginwindow" ]] || {
            echo "No active macOS GUI session is available." >&2
            exit 1
          }
          [[ "${console_user}" == "${runner_user}" ]] || {
            echo "Runner user ${runner_user} is not active GUI user ${console_user}." >&2
            exit 1
          }

          console_uid="$(id -u)"
          launchctl print "gui/${console_uid}" >/dev/null
          command -v xcodegen >/dev/null
          command -v xcodebuild >/dev/null
          command -v caffeinate >/dev/null
          echo "CONSOLE_UID=${console_uid}" >> "${GITHUB_ENV}"

      - name: Build unsigned arm64 preview
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "${DERIVED_DATA}"
          xcodegen generate
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Show pet for fifteen minutes
        shell: bash
        run: |
          set -Eeuo pipefail
          app_path="${DERIVED_DATA}/Build/Products/Debug/MacVitals.app"
          executable="${app_path}/Contents/MacOS/MacVitals"
          metrics="${RUNNER_TEMP}/pet-physical-preview-metrics.txt"
          pet_pid=""
          caffeinate_pid=""

          cleanup() {
            launchctl asuser "${CONSOLE_UID}" launchctl unsetenv MACVITALS_STATUS_BAR_PET_RUNTIME_SMOKE >/dev/null 2>&1 || true
            if [[ -n "${pet_pid}" ]] && kill -0 "${pet_pid}" >/dev/null 2>&1; then
              kill -TERM "${pet_pid}" >/dev/null 2>&1 || true
              sleep 1
              kill -KILL "${pet_pid}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${caffeinate_pid}" ]] && kill -0 "${caffeinate_pid}" >/dev/null 2>&1; then
              kill -TERM "${caffeinate_pid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT INT TERM

          [[ -x "${executable}" ]] || { echo "Preview executable is missing." >&2; exit 1; }

          pkill -TERM -x MacVitals >/dev/null 2>&1 || true
          sleep 1
          pkill -KILL -x MacVitals >/dev/null 2>&1 || true

          launchctl asuser "${CONSOLE_UID}" launchctl setenv MACVITALS_STATUS_BAR_PET_RUNTIME_SMOKE 1
          launchctl asuser "${CONSOLE_UID}" open -na "${app_path}"

          for _ in {1..80}; do
            pet_pid="$(pgrep -x MacVitals | tail -n 1 || true)"
            [[ -n "${pet_pid}" ]] && break
            sleep 0.25
          done
          [[ -n "${pet_pid}" ]] && kill -0 "${pet_pid}" >/dev/null 2>&1 || {
            echo "MacVitals did not start in the active GUI session." >&2
            exit 1
          }

          launchctl asuser "${CONSOLE_UID}" launchctl unsetenv MACVITALS_STATUS_BAR_PET_RUNTIME_SMOKE
          launchctl asuser "${CONSOLE_UID}" osascript -e 'display notification "Дракон запущен на 15 минут" with title "MacVitals"' >/dev/null 2>&1 || true

          caffeinate -dimsu -t 930 &
          caffeinate_pid="$!"
          printf 'timestamp pid elapsed cpu_percent rss_kib command\n' > "${metrics}"
          finish="$(( $(date +%s) + PREVIEW_SECONDS ))"

          while (( $(date +%s) < finish )); do
            kill -0 "${pet_pid}" >/dev/null 2>&1 || {
              echo "MacVitals exited before preview completion." >&2
              exit 1
            }
            printf '%s ' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${metrics}"
            ps -p "${pet_pid}" -o pid=,etime=,%cpu=,rss=,comm= >> "${metrics}"
            sleep 5
          done

          launchctl asuser "${CONSOLE_UID}" osascript -e 'display notification "15-минутный тест завершён" with title "MacVitals"' >/dev/null 2>&1 || true
          echo "Physical pet preview completed."

      - name: Upload preview metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pet-physical-preview-metrics
          path: ${{ runner.temp }}/pet-physical-preview-metrics.txt
          if-no-files-found: ignore
          retention-days: 1
