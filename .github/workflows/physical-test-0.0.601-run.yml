name: Physical Run MacVitals 0.0.601 Notch HUD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-run-0.0.601-notch-hud
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-run:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-0.0.601-notch-hud'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      VERSION: 0.0.601
      ARTIFACT_ID: '8830297443'
      OUTER_SHA256: 933b0d195a9f5291c28ade9c3595e1b298540d6c5074385c81c0c854932af026
      INNER_SHA256: 8eeba29ecb0d18ba22a8454349590977a2ab51bb5d8aa2789d820ac0ba159100
      MANIFEST_SHA: f7a915a001ab12e1b490986555aa8e089ff225c6
      PREF_DOMAIN: com.mishkacher.MacVitals
      PREF_KEY: experimentalNotchHUDEnabled

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Verify physical GUI runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null
          python3 -m py_compile scripts/diagnose_app_lifetime.py scripts/validate_app_zip.py
          python3 scripts/diagnose_app_lifetime.py --self-test
          python3 scripts/validate_app_zip.py --self-test

      - name: Download and extract exact artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf exact-artifact exact-app physical-evidence app-lifetime-evidence
          mkdir -p exact-artifact exact-app physical-evidence
          outer="exact-artifact/workflow-artifact.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "${outer}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          [[ "$(shasum -a 256 "${outer}" | awk '{print $1}')" == "${OUTER_SHA256}" ]]
          ditto -x -k "${outer}" exact-artifact/content
          inner="exact-artifact/content/MacVitals-${VERSION}.zip"
          [[ "$(shasum -a 256 "${inner}" | awk '{print $1}')" == "${INNER_SHA256}" ]]
          python3 scripts/validate_app_zip.py "${inner}"
          MANIFEST="exact-artifact/content/BUILD_MANIFEST.json" \
          EXPECTED_SHA="${MANIFEST_SHA}" EXPECTED_VERSION="${VERSION}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "buildNumber": "601",
              "gitCommit": os.environ["EXPECTED_SHA"],
              "architectures": ["arm64"],
              "signingStatus": "unsigned",
              "notarizationStatus": "not-notarized",
          }
          for key, item in expected.items():
              if value.get(key) != item:
                  raise SystemExit(f"manifest mismatch: {key}={value.get(key)!r}")
          PY
          ditto -x -k "${inner}" exact-app
          app="${PWD}/exact-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -x "${executable}" && ! -L "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == "arm64" ]]
          if find "${app}" -type l -print -quit | grep -q .; then exit 1; fi
          printf '{"artifactId":8830297443,"version":"0.0.601","sourceCommit":"%s","outerSha256":"%s","innerSha256":"%s","architecture":"arm64","signing":"unsigned","notarization":"not-notarized"}\n' \
            "${MANIFEST_SHA}" "${OUTER_SHA256}" "${INNER_SHA256}" \
            > physical-evidence/artifact-identity.json
          echo "app=${app}" >> "${GITHUB_OUTPUT}"

      - name: Save preference and force HUD on
        shell: bash
        run: |
          set -Eeuo pipefail
          state="${RUNNER_TEMP}/macvitals-601-pref-${GITHUB_RUN_ID}"
          rm -rf "${state}"; mkdir -p "${state}"
          if defaults read "${PREF_DOMAIN}" "${PREF_KEY}" > "${state}/value" 2>/dev/null; then
            echo present > "${state}/status"
          else
            echo absent > "${state}/status"
          fi
          echo "${state}" > physical-evidence/preference-state-path.txt
          defaults write "${PREF_DOMAIN}" "${PREF_KEY}" -bool true
          [[ "$(defaults read "${PREF_DOMAIN}" "${PREF_KEY}")" == "1" ]]

      - name: Verify physical HUD windows
        id: hud
        shell: bash
        env:
          APP_PATH: ${{ steps.candidate.outputs.app }}
        run: |
          set -Eeuo pipefail
          executable="${APP_PATH}/Contents/MacOS/MacVitals"
          "${executable}" -notificationsEnabled NO -showInDock NO -samplingInterval 2 -experimentalNotchHUDEnabled YES \
            > physical-evidence/hud-launch.log 2>&1 &
          pid=$!
          cleanup() { kill -TERM "${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true; }
          trap cleanup EXIT HUP INT TERM
          sleep 15
          kill -0 "${pid}"
          cat > "${RUNNER_TEMP}/verify-hud.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let pid = Int32(ProcessInfo.processInfo.environment["TARGET_PID"]!)!
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          func n(_ d: [String: Any], _ k: String) -> Double? { (d[k] as? NSNumber)?.doubleValue }
          var windows: [[String: Double]] = []
          for item in list {
            guard let owner = item[kCGWindowOwnerPID as String] as? NSNumber,
                  owner.int32Value == pid,
                  let b = item[kCGWindowBounds as String] as? [String: Any],
                  let x = n(b,"X"), let y = n(b,"Y"), let w = n(b,"Width"), let h = n(b,"Height") else { continue }
            windows.append(["x":x,"y":y,"width":w,"height":h])
          }
          let rail = windows.contains { ($0["width"] ?? 0) >= 500 && ($0["width"] ?? 0) <= 1300 && ($0["height"] ?? 0) >= 30 && ($0["height"] ?? 0) <= 60 }
          let detail = windows.contains { ($0["width"] ?? 0) >= 320 && ($0["width"] ?? 0) <= 390 && ($0["height"] ?? 0) >= 150 && ($0["height"] ?? 0) <= 210 }
          let out: [String: Any] = ["railPanelFound":rail,"detailPanelFound":detail,"windowCount":windows.count,"windows":windows]
          let data = try JSONSerialization.data(withJSONObject: out, options: [.prettyPrinted,.sortedKeys])
          FileHandle.standardOutput.write(data); FileHandle.standardOutput.write(Data("\n".utf8))
          guard rail && detail else { exit(1) }
          SWIFT
          TARGET_PID="${pid}" xcrun swift "${RUNNER_TEMP}/verify-hud.swift" > physical-evidence/hud-windows.json
          echo "status=0" >> "${GITHUB_OUTPUT}"

      - name: Run 10-minute physical lifetime test with HUD enabled
        id: lifetime
        shell: bash
        env:
          APP_PATH: ${{ steps.candidate.outputs.app }}
        run: |
          set +e
          caffeinate -ims python3 scripts/diagnose_app_lifetime.py \
            --repository "${PWD}" \
            --app "${APP_PATH}" \
            --duration 600 \
            --interval 2 \
            --output app-lifetime-evidence \
            > physical-evidence/lifetime.log 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          tail -n 100 physical-evidence/lifetime.log

      - name: Restore HUD preference
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          file="physical-evidence/preference-state-path.txt"
          [[ -f "${file}" ]] || exit 0
          state="$(cat "${file}")"
          if [[ "$(cat "${state}/status" 2>/dev/null || echo absent)" == present ]]; then
            case "$(cat "${state}/value")" in
              1|true|TRUE|yes|YES) defaults write "${PREF_DOMAIN}" "${PREF_KEY}" -bool true ;;
              *) defaults write "${PREF_DOMAIN}" "${PREF_KEY}" -bool false ;;
            esac
          else
            defaults delete "${PREF_DOMAIN}" "${PREF_KEY}" >/dev/null 2>&1 || true
          fi
          rm -rf "${state}"; rm -f "${file}"

      - name: Sanitize and upload evidence
        id: privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_VALUE="${HOME:-}" USER_VALUE="$(id -un)" HOST_VALUE="$(hostname)" python3 - <<'PY'
          from pathlib import Path
          import os, re
          roots=[Path("physical-evidence"),Path("app-lifetime-evidence")]
          repl=[(os.environ.get("HOME_VALUE",""),"<HOME>"),(os.environ.get("USER_VALUE",""),"<USER>"),(os.environ.get("HOST_VALUE",""),"<HOST>")]
          path_re=re.compile(r"/(?:Users|home)/[^/\s<]+")
          temp_re=re.compile(r"/private/(?:tmp|var)/[^\s<]+")
          battery_re=re.compile(r"\bInternalBattery-\d+(?:\s+\(id=\d+\))?")
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob("*"):
              if p.is_symlink(): raise SystemExit(f"symlink evidence: {p}")
              if not p.is_file(): continue
              data=p.read_bytes()
              if b"\0" in data: raise SystemExit(f"binary evidence: {p}")
              text=data.decode("utf-8")
              text=path_re.sub("<HOME>",text); text=temp_re.sub("<TEMP>",text); text=battery_re.sub("<BATTERY_ID>",text)
              for source,target in repl:
                if source and len(source)>=3: text=text.replace(source,target)
              p.write_text(text,encoding="utf-8")
          Path("physical-evidence/privacy-passed.txt").write_text("privacy-scan=passed\n",encoding="utf-8")
          PY
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Upload physical evidence
        if: always() && steps.privacy.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-MacVitals-0.0.601-notch-hud
          path: |
            physical-evidence/
            app-lifetime-evidence/
            exact-artifact/content/BUILD_MANIFEST.json
            exact-artifact/content/BUILD_STATUS.txt
            exact-artifact/content/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce result
        if: always()
        shell: bash
        env:
          HUD: ${{ steps.hud.outputs.status }}
          LIFE: ${{ steps.lifetime.outputs.status }}
          PRIVACY: ${{ steps.privacy.outputs.ready }}
        run: |
          [[ "${HUD:-}" == 0 ]]
          [[ "${LIFE:-}" == 0 ]]
          [[ "${PRIVACY:-}" == true ]]
          echo 'Exact MacVitals 0.0.601 physical HUD test passed'
