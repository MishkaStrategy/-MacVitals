name: Validate Power-Aware Sampling V2

on:
  push:
    branches: [validation/power-aware-sampling-intervals]
    paths:
      - .github/workflows/power-aware-sampling-validation-v2.yml

permissions:
  contents: write

concurrency:
  group: power-aware-sampling-validation-v2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 09c82ba26b4fdd4c42d8220b73d4551ce6dfcaf7
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build exact source and run focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="${RUNNER_TEMP}/macvitals-power-aware-v2-source"
          log_file="${RUNNER_TEMP}/macvitals-power-aware-v2.log"
          result_file="${RUNNER_TEMP}/macvitals-power-aware-v2-result"
          artifact_file="${RUNNER_TEMP}/macvitals-power-aware-v2-artifact"
          rm -rf -- "${source_dir}" "${log_file}" "${result_file}" "${artifact_file}"
          mkdir -p "${source_dir}"
          cd "${source_dir}"

          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64)"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin "${PRODUCT_SHA}"
          git checkout -q --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "${PRODUCT_SHA}" ]]
          [[ "$(uname -s)" == "Darwin" && "$(uname -m)" == "arm64" ]]

          export DEVELOPER_DIR="$(xcode-select -p)"
          xcodegen_path="$(command -v xcodegen 2>/dev/null || true)"
          [[ -x "${xcodegen_path}" ]] || xcodegen_path=/opt/homebrew/bin/xcodegen
          [[ -x "${xcodegen_path}" ]]
          python3 scripts/materialize_app_icon.py
          "${xcodegen_path}" generate

          {
            xcodebuild \
              -project MacVitals.xcodeproj -scheme MacVitals \
              -configuration Release \
              -derivedDataPath build/power-aware-v2-release \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

            xcodebuild \
              -project MacVitals.xcodeproj -scheme MacVitals \
              -configuration Debug \
              -derivedDataPath build/power-aware-v2-tests \
              -destination 'platform=macOS,arch=arm64' \
              -only-testing:MacVitalsTests/SamplingIntervalPolicyTests \
              -only-testing:MacVitalsTests/MenuLayoutRulesTests \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
          } 2>&1 | tee "${log_file}"

          app="build/power-aware-v2-release/Build/Products/Release/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -d "${app}" && -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == "arm64" ]]

          short_sha="${PRODUCT_SHA:0:12}"
          archive_name="MacVitals-power-aware-sampling-${short_sha}.zip"
          archive_path="${RUNNER_TEMP}/${archive_name}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" "${archive_path}"
          account_home="$(dscl . -read "/Users/$(id -un)" NFSHomeDirectory | sed -n 's/^NFSHomeDirectory: //p')"
          [[ -n "${account_home}" && -d "${account_home}" ]]
          mkdir -p "${account_home}/Downloads"
          cp -f "${archive_path}" "${account_home}/Downloads/${archive_name}"
          printf '%s\n' "~/Downloads/${archive_name}" > "${artifact_file}"
          printf 'success\n' > "${result_file}"

      - name: Record compact validation result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          log_file="${RUNNER_TEMP}/macvitals-power-aware-v2.log"
          result_file="${RUNNER_TEMP}/macvitals-power-aware-v2-result"
          artifact_file="${RUNNER_TEMP}/macvitals-power-aware-v2-artifact"
          result="failure"
          [[ -f "${result_file}" && "$(cat "${result_file}")" == success ]] && result="success"
          artifact=""
          [[ -f "${artifact_file}" ]] && artifact="$(cat "${artifact_file}")"
          diagnostics="$(grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)|TEST (FAILED|SUCCEEDED)|Executed [0-9]+ tests' "${log_file}" | tail -n 160 || true)"

          status_repo="${RUNNER_TEMP}/macvitals-power-aware-v2-status"
          rm -rf "${status_repo}"
          git clone -q --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${status_repo}"
          cd "${status_repo}"
          mkdir -p build-status
          RESULT="${result}" PRODUCT_SHA="${PRODUCT_SHA}" WORKFLOW_SHA="${GITHUB_SHA}" \
          ARTIFACT="${artifact}" DIAGNOSTICS="${diagnostics}" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "schemaVersion": 1,
              "result": os.environ["RESULT"],
              "architecture": "arm64",
              "sourceSha": os.environ["WORKFLOW_SHA"],
              "productSourceSha": os.environ["PRODUCT_SHA"],
              "releaseBuildRun": True,
              "testsRun": True,
              "testTargets": [
                  "MacVitalsTests/SamplingIntervalPolicyTests",
                  "MacVitalsTests/MenuLayoutRulesTests",
              ],
              "localArtifact": os.environ.get("ARTIFACT") or None,
              "diagnostics": os.environ.get("DIAGNOSTICS", ""),
              "finishedAt": datetime.now(timezone.utc).isoformat(),
          }
          Path("build-status/power-aware-sampling-validation-v2.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/power-aware-sampling-validation-v2.json
          git commit -m "ci: record power-aware sampling validation v2 [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          [[ "${result}" == success ]]
