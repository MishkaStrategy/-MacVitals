name: Network Preview Build

on:
  push:
    branches: [feature/network-traffic-speed-preview]
  workflow_dispatch:

concurrency:
  group: network-preview-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-only:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Resolve developer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          developer_dir="$(xcode-select -p)"
          [[ -x "${developer_dir}/usr/bin/xcodebuild" ]]
          echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
          for candidate in "$(command -v xcodegen 2>/dev/null || true)" /opt/homebrew/bin/xcodegen /usr/local/bin/xcodegen; do
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              echo "$(dirname "${candidate}")" >> "${GITHUB_PATH}"
              exit 0
            fi
          done
          echo "xcodegen is unavailable" >&2
          exit 1

      - name: Build unsigned ARM64 app
        shell: bash
        env:
          CODE_SIGNING_ALLOWED: NO
        run: |
          set -Eeuo pipefail
          rm -rf -- build/network-preview dist/network-preview
          python3 scripts/materialize_app_icon.py
          xcodegen generate
          xcodebuild \
            -project MacVitals.xcodeproj \
            -target MacVitals \
            -configuration Release \
            -derivedDataPath build/network-preview \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          app="build/network-preview/Build/Products/Release/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -d "${app}" && -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == "arm64" ]]
          mkdir -p dist/network-preview
          ditto -c -k --sequesterRsrc --keepParent \
            "${app}" \
            "dist/network-preview/MacVitals-network-preview-${GITHUB_SHA}.zip"

      - name: Upload unsigned preview build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacVitals-network-preview-${{ github.sha }}
          path: dist/network-preview/*.zip
          if-no-files-found: error
          retention-days: 14
