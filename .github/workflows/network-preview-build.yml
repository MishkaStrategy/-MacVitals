name: Network Preview Build

on:
  push:
    branches: [feature/network-traffic-speed-preview]
    paths-ignore:
      - build-status/**
  workflow_dispatch:

concurrency:
  group: network-preview-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-only:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          clean: true

      - name: Resolve developer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          developer_dir="$(xcode-select -p)"
          [[ -x "${developer_dir}/usr/bin/xcodebuild" ]]
          echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
          for candidate in "$(command -v xcodegen 2>/dev/null || true)" /opt/homebrew/bin/xcodegen /usr/local/bin/xcodegen; do
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              echo "$(dirname "${candidate}")" >> "${GITHUB_PATH}"
              exit 0
            fi
          done
          echo "xcodegen is unavailable" >&2
          exit 1

      - name: Build unsigned ARM64 app only
        id: build
        shell: bash
        env:
          CODE_SIGNING_ALLOWED: NO
        run: |
          set -Eeuo pipefail
          rm -rf -- build/network-preview dist/network-preview
          mkdir -p build/network-preview dist/network-preview build-status
          python3 scripts/materialize_app_icon.py
          xcodegen generate

          set +e
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -configuration Release \
            -derivedDataPath build/network-preview \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build > build/network-preview/xcodebuild.log 2>&1
          status=$?
          set -e

          grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)' \
            build/network-preview/xcodebuild.log | tail -n 200 \
            > build/network-preview/diagnostics.txt || true
          cat build/network-preview/diagnostics.txt

          result="failure"
          architecture="unknown"
          artifact=""
          if [[ ${status} -eq 0 ]]; then
            app="build/network-preview/Build/Products/Release/MacVitals.app"
            executable="${app}/Contents/MacOS/MacVitals"
            [[ -d "${app}" && -x "${executable}" ]]
            architecture="$(lipo -archs "${executable}")"
            [[ "${architecture}" == "arm64" ]]

            short_sha="${GITHUB_SHA:0:12}"
            archive_name="MacVitals-network-preview-${short_sha}.zip"
            workspace_archive="dist/network-preview/${archive_name}"
            ditto -c -k --sequesterRsrc --keepParent "${app}" "${workspace_archive}"

            account_home="$(dscl . -read "/Users/$(id -un)" NFSHomeDirectory | sed -n 's/^NFSHomeDirectory: //p')"
            [[ -n "${account_home}" && -d "${account_home}" ]]
            mkdir -p "${account_home}/Downloads"
            cp -f "${workspace_archive}" "${account_home}/Downloads/${archive_name}"
            chmod 0644 "${account_home}/Downloads/${archive_name}"
            artifact="~/Downloads/${archive_name}"
            result="success"
          fi

          RESULT="${result}" \
          SOURCE_SHA="${GITHUB_SHA}" \
          ARCHITECTURE="${architecture}" \
          ARTIFACT="${artifact}" \
          DIAGNOSTICS="build/network-preview/diagnostics.txt" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnostics_path = Path(os.environ["DIAGNOSTICS"])
          diagnostics = diagnostics_path.read_text(encoding="utf-8", errors="replace") if diagnostics_path.exists() else ""
          payload = {
              "schemaVersion": 1,
              "sourceSha": os.environ["SOURCE_SHA"],
              "result": os.environ["RESULT"],
              "architecture": os.environ["ARCHITECTURE"],
              "localArtifact": os.environ["ARTIFACT"] or None,
              "testsRun": False,
              "diagnostics": diagnostics[-12000:],
          }
          Path("build-status/network-preview.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/network-preview.json
          git commit -m "ci: record network preview build result [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          exit ${status}
