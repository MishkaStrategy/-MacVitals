name: Release Candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version to package without a leading v
        required: false
        default: 0.0.0

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate localization, app icon and runtime tooling
        run: |
          python3 -m py_compile scripts/materialize_app_icon.py scripts/validate_localizations.py scripts/validate_runtime_metrics.py
          python3 scripts/materialize_app_icon.py --self-test
          python3 scripts/materialize_app_icon.py
          python3 scripts/validate_localizations.py
          python3 scripts/validate_runtime_metrics.py --self-test
          bash scripts/install_xcodegen.sh --self-test
          bash -n \
            scripts/install_xcodegen.sh \
            scripts/package_release.sh \
            scripts/verify_release.sh \
            scripts/collect_runtime_metrics.sh \
            scripts/run_ci_runtime_smoke.sh

      - name: Install XcodeGen
        run: bash scripts/install_xcodegen.sh

      - name: Generate project
        run: xcodegen generate

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ -n "${version}" ]] || version=0.0.0
          [[ "${version}" =~ ^[0-9]+([.][0-9]+){0,2}$ ]] || {
            echo "Version must contain one to three numeric components: ${version}" >&2
            exit 2
          }
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Swift format lint
        run: swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests

      - name: Unit and hardware-smoke tests
        run: >-
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
          test -only-testing:MacVitalsTests

      - name: Build and verify unsigned release candidate
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGNING_ALLOWED: NO
        run: bash scripts/package_release.sh "${{ steps.version.outputs.value }}"

      - name: Packaged runtime smoke guardrail
        timeout-minutes: 5
        run: >-
          bash scripts/run_ci_runtime_smoke.sh
          build/MacVitals.xcarchive/Products/Applications/MacVitals.app

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-smoke-evidence
          path: runtime-smoke-results/
          if-no-files-found: ignore

      - name: Upload unsigned candidate for internal validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MacVitals-${{ steps.version.outputs.value }}-unsigned
          path: dist/
          if-no-files-found: error

      - name: Record publication gate
        run: |
          {
            echo "## Publication blocked"
            echo
            echo "This workflow produces an unsigned, non-notarized validation artifact only."
            echo "It intentionally does not create a public GitHub Release."
            echo "Public release publication requires a separate Developer ID signing, notarization, stapling and Gatekeeper verification workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
