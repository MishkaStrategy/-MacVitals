name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without a leading v
        required: false
        default: 0.0.0

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ -n "${version}" ]] || version=0.0.0
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify unsigned release artifacts
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGNING_ALLOWED: NO
        run: bash scripts/package_release.sh "${{ steps.version.outputs.value }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacVitals-${{ steps.version.outputs.value }}-unsigned
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MacVitals ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/MacVitals-*.zip
            dist/MacVitals-*.dmg
            dist/SHA256SUMS.txt
            dist/BUILD_STATUS.txt
