name: Physical Test Notch Indicator V4

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-notch-indicator-appkit
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-notch-indicator-v4:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-notch-indicator'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12
    env:
      APP_ARTIFACT_ID: '8834411613'
      APP_ARTIFACT_DIGEST: 'c0e20c958f24ac098824b2eb176dbd88008509844cca595d0c99a7c477efcd38'
      FEATURE_HEAD_SHA: '10d2766b7bc8f4427043ccc3574a4f2d89eed753'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Validate physical notch geometry and runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null
          rm -rf physical-app physical-artifact physical-evidence physical-tools
          mkdir -p physical-app physical-artifact physical-evidence physical-tools

          archive="physical-artifact/candidate.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "${archive}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${APP_ARTIFACT_ID}/zip"
          [[ "$(shasum -a 256 "${archive}" | awk '{print $1}')" == "${APP_ARTIFACT_DIGEST}" ]]
          ditto -x -k "${archive}" physical-artifact/content
          inner="$(find physical-artifact/content -type f -name 'MacVitals-*.zip' -print -quit)"
          python3 scripts/validate_app_zip.py "${inner}"
          ditto -x -k "${inner}" physical-app
          app="${PWD}/physical-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")"
          [[ -x "${executable}" && "$(lipo -archs "${executable}")" == arm64 ]]
          [[ -z "$(pgrep -x MacVitals || true)" ]]

          cat > physical-tools/Preferences.swift <<'SWIFT'
          import CoreFoundation
          import Foundation
          guard CommandLine.arguments.count == 2 else { exit(2) }
          let bundle = CommandLine.arguments[1] as CFString
          CFPreferencesSetAppValue("experimentalNotchHUDEnabled" as CFString, true as CFBoolean, bundle)
          guard CFPreferencesAppSynchronize(bundle) else { exit(3) }
          guard let stored = CFPreferencesCopyAppValue(
            "experimentalNotchHUDEnabled" as CFString,
            bundle
          ) as? Bool, stored else { exit(4) }
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 physical-tools/Preferences.swift -o physical-tools/preferences

          original="missing"
          if defaults read "${bundle_id}" experimentalNotchHUDEnabled >/tmp/notch-original-v4 2>/dev/null; then
            original="$(cat /tmp/notch-original-v4)"
          fi
          cleanup() {
            set +e
            launchctl unsetenv MACVITALS_NOTCH_DIAGNOSTICS_PATH 2>/dev/null || true
            [[ -n "${app_pid:-}" ]] && kill -TERM "${app_pid}" 2>/dev/null || true
            if [[ "${original}" == missing ]]; then
              defaults delete "${bundle_id}" experimentalNotchHUDEnabled 2>/dev/null || true
            elif [[ "${original}" == 1 ]]; then
              physical-tools/preferences "${bundle_id}" || true
            else
              defaults write "${bundle_id}" experimentalNotchHUDEnabled -bool false
            fi
          }
          trap cleanup EXIT
          physical-tools/preferences "${bundle_id}"

          diagnostics="${PWD}/physical-evidence/notch-controller.json"
          launchctl setenv MACVITALS_NOTCH_DIAGNOSTICS_PATH "${diagnostics}"
          /usr/bin/open -na "${app}" --args -ApplePersistenceIgnoreState YES
          app_pid=""
          for _ in {1..120}; do
            app_pid="$(pgrep -x MacVitals | tail -n 1 || true)"
            [[ -n "${app_pid}" && -s "${diagnostics}" ]] && break
            sleep .1
          done
          [[ -n "${app_pid}" && -s "${diagnostics}" ]]

          DIAGNOSTICS="${diagnostics}" FEATURE_HEAD_SHA="${FEATURE_HEAD_SHA}" APP_PID="${app_pid}" \
          python3 - <<'PY' > physical-evidence/summary.json
          import json, os
          d = json.load(open(os.environ['DIAGNOSTICS'], encoding='utf-8'))
          assert d['event'] in ('ordered', 'ordered-next-run-loop'), d
          assert d['enabled'] is True, d
          assert d['panelAllocated'] is True, d
          assert d['panelVisible'] is True, d
          assert d['panelWindowNumber'] > 0, d
          assert d['safeAreaTop'] > 0, d
          expected_height = min(max(d['safeAreaTop'], 30), 44) + 30
          assert abs(d['frameWidth'] - 356) <= 3, d
          assert abs(d['frameHeight'] - expected_height) <= 3, d
          expected_x = d['screenX'] + (d['screenWidth'] - d['frameWidth']) / 2
          assert abs(d['frameX'] - expected_x) <= 3, d
          assert abs((d['frameY'] + d['frameHeight']) - (d['screenY'] + d['screenHeight'])) <= 3, d
          print(json.dumps({
            'result': 'passed',
            'featureHead': os.environ['FEATURE_HEAD_SHA'],
            'processPID': int(os.environ['APP_PID']),
            'physicalSafeAreaTop': d['safeAreaTop'],
            'overlayWindowCount': 1,
            'oldTwoPanelLayoutAbsent': True,
            'appKitPanel': d,
            'validationSource': 'instrumented AppKit NSPanel state',
            'launchMode': 'LaunchServices',
          }, indent=2, sort_keys=True))
          PY

          sleep 30
          kill -0 "${app_pid}"
          printf 'process-alive-after-30s=true\npreferences-restored-on-exit=true\n' \
            > physical-evidence/runtime.txt

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-notch-indicator-evidence-v4
          path: physical-evidence/
          if-no-files-found: error
          retention-days: 30
