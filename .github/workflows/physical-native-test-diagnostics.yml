name: Physical Native Test Diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-native-test-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-test-diagnostics:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'feature/macvitals-v1'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Register runner privacy masks
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace_parent=""
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            workspace_parent="$(dirname "${GITHUB_WORKSPACE}")"
          fi
          for value in \
            "${HOME:-}" \
            "${USER:-}" \
            "$(id -un 2>/dev/null || true)" \
            "$(hostname 2>/dev/null || true)" \
            "${RUNNER_NAME:-}" \
            "${GITHUB_WORKSPACE:-}" \
            "${workspace_parent}"; do
            if [[ -n "${value}" && ${#value} -ge 3 ]]; then
              echo "::add-mask::${value}"
            fi
          done

      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact native candidate
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == "Darwin" ]] || { echo "Physical runner must be macOS" >&2; exit 1; }
          [[ "$(uname -m)" == "arm64" ]] || { echo "Physical runner must be native arm64" >&2; exit 1; }
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Candidate SHA is invalid" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || { echo "Exact candidate checkout mismatch" >&2; exit 1; }
          echo "short_sha=${CANDIDATE_SHA:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Resolve preinstalled developer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          developer_dir=""
          for candidate in \
            "${DEVELOPER_DIR:-}" \
            "$(xcode-select -p 2>/dev/null || true)" \
            /Applications/Xcode.app/Contents/Developer \
            /Applications/Xcode-beta.app/Contents/Developer; do
            if [[ -n "${candidate}" && -x "${candidate}/usr/bin/xcodebuild" ]]; then
              developer_dir="${candidate}"
              break
            fi
          done
          [[ -n "${developer_dir}" ]] || { echo "Full Xcode is unavailable" >&2; exit 1; }
          echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
          swift_path="$(DEVELOPER_DIR="${developer_dir}" xcrun --find swift)"
          echo "$(dirname "${swift_path}")" >> "${GITHUB_PATH}"

          xcodegen_path="$(command -v xcodegen 2>/dev/null || true)"
          if [[ -z "${xcodegen_path}" ]]; then
            for candidate in /opt/homebrew/bin/xcodegen /opt/homebrew/opt/xcodegen/bin/xcodegen /usr/local/bin/xcodegen; do
              if [[ -x "${candidate}" ]]; then
                xcodegen_path="${candidate}"
                break
              fi
            done
          fi
          [[ -x "${xcodegen_path}" ]] || { echo "xcodegen is unavailable" >&2; exit 1; }
          echo "$(dirname "${xcodegen_path}")" >> "${GITHUB_PATH}"

      - name: Generate project
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/materialize_app_icon.py
          python3 scripts/validate_localizations.py
          xcodegen generate

      - name: Run and capture native arm64 tests
        id: native_tests
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f physical-native-tests.raw.log physical-native-tests.log
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests \
            > physical-native-tests.raw.log 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "Native test exit status: ${status}"

      - name: Sanitize native test diagnostics
        id: privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          REDACT_HOME="${HOME:-}" REDACT_USER="$(id -un 2>/dev/null || true)" REDACT_HOST="$(hostname 2>/dev/null || true)" python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import re

          raw = Path("physical-native-tests.raw.log")
          safe = Path("physical-native-tests.log")
          ready = Path("physical-native-tests-upload-ready.txt")
          ready.unlink(missing_ok=True)

          if not raw.is_file() or raw.is_symlink() or raw.stat().st_nlink != 1:
              raise SystemExit("Native test log is missing or unsafe")
          if raw.stat().st_size > 30 * 1024 * 1024:
              raise SystemExit("Native test log exceeds the 30 MiB limit")
          payload = raw.read_bytes()
          if b"\x00" in payload:
              raise SystemExit("Native test log is unexpectedly binary")
          text = payload.decode("utf-8", errors="strict")

          home = os.environ.get("REDACT_HOME", "")
          user = os.environ.get("REDACT_USER", "")
          host = os.environ.get("REDACT_HOST", "")
          replacements = [(home, "<HOME>"), (host, "<HOST>")]
          if len(user) >= 3:
              replacements.append((user, "<USER>"))

          path_pattern = re.compile(r"/(?:Users|home)/[^/\s<]+")
          temp_pattern = re.compile(r"/private/(?:tmp|var)/[^\s<]+")
          text = path_pattern.sub("<HOME>", text)
          text = temp_pattern.sub("<TEMP>", text)
          for value, replacement in replacements:
              if value:
                  text = text.replace(value, replacement)

          forbidden = [value for value, _ in replacements if value]
          for value in forbidden:
              if value in text:
                  raise SystemExit("Native test privacy scan failed")
          if path_pattern.search(text):
              raise SystemExit("Native test path privacy scan failed")

          safe.write_text(text, encoding="utf-8")
          raw.unlink(missing_ok=True)
          ready.write_text("privacy-scan=passed\n", encoding="utf-8")
          PYCODE
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          tail -n 300 physical-native-tests.log

      - name: Upload redacted native test diagnostics
        if: always() && steps.privacy.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-native-tests-${{ steps.identity.outputs.short_sha }}
          path: |
            physical-native-tests.log
            physical-native-tests-upload-ready.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean diagnostic workspace
        if: always()
        shell: bash
        run: |
          rm -rf MacVitals.xcodeproj MacVitals/Resources/AppIcon.icns
          rm -f physical-native-tests.raw.log physical-native-tests.log physical-native-tests-upload-ready.txt
          git clean -ffdX || true

      - name: Enforce native test result
        if: always()
        shell: bash
        env:
          TEST_STATUS: ${{ steps.native_tests.outputs.status }}
          PRIVACY_READY: ${{ steps.privacy.outputs.ready }}
        run: |
          set -Eeuo pipefail
          [[ "${PRIVACY_READY:-}" == "true" ]] || { echo "Native test privacy gate failed" >&2; exit 1; }
          [[ "${TEST_STATUS:-}" =~ ^[0-9]+$ ]] || { echo "Native test status is invalid" >&2; exit 1; }
          if [[ "${TEST_STATUS}" -ne 0 ]]; then
            echo "Native ARM64 tests failed with exit ${TEST_STATUS}; sanitized diagnostics were uploaded" >&2
            exit "${TEST_STATUS}"
          fi
