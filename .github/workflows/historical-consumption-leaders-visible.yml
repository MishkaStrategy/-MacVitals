name: Historical Consumption Leaders Visible Review

on:
  push:
    branches: [validation/historical-consumption-leaders-visible]
    paths-ignore:
      - build-status/**

concurrency:
  group: historical-consumption-leaders-visible
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visible-review:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_SHA: fd62873f2cd55497393835a37040599dcf9c1e3a
      REVIEW_DURATION_SECONDS: "900"
    steps:
      - name: Build and launch visible unsigned ARM64 candidate
        shell: bash
        run: |
          set -Eeuo pipefail

          source_dir="${GITHUB_WORKSPACE}/consumption-leaders-visible-source"
          rm -rf -- "${source_dir}"
          mkdir -p -- "${source_dir}"
          cd "${source_dir}"

          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64)"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin "${PRODUCT_SHA}"
          git checkout -q --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "${PRODUCT_SHA}" ]]
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]

          console_user="$(stat -f '%Su' /dev/console)"
          [[ -n "${console_user}" && "${console_user}" != "root" && "${console_user}" != "loginwindow" ]]
          [[ "${console_user}" == "$(id -un)" ]]

          developer_dir="$(xcode-select -p)"
          [[ -x "${developer_dir}/usr/bin/xcodebuild" ]]
          export DEVELOPER_DIR="${developer_dir}"
          xcodegen_path=""
          for candidate in "$(command -v xcodegen 2>/dev/null || true)" /opt/homebrew/bin/xcodegen /usr/local/bin/xcodegen; do
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              xcodegen_path="${candidate}"
              break
            fi
          done
          [[ -n "${xcodegen_path}" ]]

          rm -rf -- build/consumption-leaders-visible build-status/historical-consumption-leaders-visible.json
          mkdir -p build/consumption-leaders-visible build-status
          python3 scripts/materialize_app_icon.py
          "${xcodegen_path}" generate
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -configuration Release \
            -derivedDataPath build/consumption-leaders-visible \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build > build/consumption-leaders-visible/xcodebuild.log 2>&1

          app="build/consumption-leaders-visible/Build/Products/Release/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -d "${app}" && -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == "arm64" ]]

          if pgrep -x MacVitals >/dev/null 2>&1; then
            pkill -TERM -x MacVitals || true
            sleep 2
          fi
          [[ -z "$(pgrep -x MacVitals || true)" ]]

          short_sha="${PRODUCT_SHA:0:12}"
          visible_app="${HOME}/Downloads/MacVitals-consumption-leaders-visible-${short_sha}.app"
          rm -rf -- "${visible_app}"
          ditto "${app}" "${visible_app}"
          visible_executable="${visible_app}/Contents/MacOS/MacVitals"

          before_crashes="$(find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'MacVitals*.ips' -print 2>/dev/null | wc -l | tr -d ' ')"
          /usr/bin/open -n "${visible_app}" --args -notificationsEnabled NO -showInDock NO

          app_pid=""
          for _ in $(seq 1 60); do
            while IFS= read -r candidate_pid; do
              [[ "${candidate_pid}" =~ ^[0-9]+$ ]] || continue
              command_path="$(ps -p "${candidate_pid}" -o command= | sed 's/[[:space:]]*$//')"
              if [[ "${command_path}" == "${visible_executable}" || "${command_path}" == "${visible_executable} "* ]]; then
                app_pid="${candidate_pid}"
                break
              fi
            done < <(pgrep -x MacVitals || true)
            [[ -n "${app_pid}" ]] && break
            sleep 1
          done
          [[ -n "${app_pid}" ]]

          status_repo="${GITHUB_WORKSPACE}/consumption-leaders-visible-status"
          rm -rf -- "${status_repo}"
          git clone -q --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${status_repo}"
          cd "${status_repo}"
          mkdir -p build-status
          STATE="running" PRODUCT_SHA="${PRODUCT_SHA}" WORKFLOW_SHA="${GITHUB_SHA}" PID="${app_pid}" APP="~/Downloads/MacVitals-consumption-leaders-visible-${short_sha}.app" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "schemaVersion": 1,
              "state": os.environ["STATE"],
              "result": None,
              "physicalGuiRun": True,
              "consoleSessionActive": True,
              "architecture": "arm64",
              "sourceSha": os.environ["WORKFLOW_SHA"],
              "productSourceSha": os.environ["PRODUCT_SHA"],
              "pid": int(os.environ["PID"]),
              "requestedDurationSeconds": 900,
              "startedAt": datetime.now(timezone.utc).isoformat(),
              "visibleApp": os.environ["APP"],
              "xctestRun": False,
          }
          Path("build-status/historical-consumption-leaders-visible.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/historical-consumption-leaders-visible.json
          git commit -m "ci: mark consumption leaders visible review running [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

          started_epoch="$(date +%s)"
          completed=true
          samples=0
          for _ in $(seq 1 $((REVIEW_DURATION_SECONDS / 2))); do
            if ! kill -0 "${app_pid}" 2>/dev/null; then completed=false; break; fi
            samples=$((samples + 1))
            sleep 2
          done
          elapsed="$(( $(date +%s) - started_epoch ))"
          harness_terminated=false
          if kill -0 "${app_pid}" 2>/dev/null; then
            harness_terminated=true
            kill -TERM "${app_pid}" 2>/dev/null || true
          fi
          after_crashes="$(find "${HOME}/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'MacVitals*.ips' -print 2>/dev/null | wc -l | tr -d ' ')"
          new_crashes=$((after_crashes - before_crashes))
          result="failure"
          if [[ "${completed}" == "true" && "${elapsed}" -ge 896 && "${new_crashes}" -eq 0 ]]; then result="success"; fi

          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard FETCH_HEAD
          RESULT="${result}" PRODUCT_SHA="${PRODUCT_SHA}" WORKFLOW_SHA="${GITHUB_SHA}" ELAPSED="${elapsed}" SAMPLES="${samples}" COMPLETED="${completed}" TERMINATED="${harness_terminated}" CRASHES="${new_crashes}" APP="~/Downloads/MacVitals-consumption-leaders-visible-${short_sha}.app" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "schemaVersion": 1,
              "state": "finished",
              "result": os.environ["RESULT"],
              "physicalGuiRun": True,
              "architecture": "arm64",
              "sourceSha": os.environ["WORKFLOW_SHA"],
              "productSourceSha": os.environ["PRODUCT_SHA"],
              "requestedDurationSeconds": 900,
              "observedDurationSeconds": int(os.environ["ELAPSED"]),
              "sampleCount": int(os.environ["SAMPLES"]),
              "completedRequestedDuration": os.environ["COMPLETED"] == "true",
              "terminationInitiatedByHarness": os.environ["TERMINATED"] == "true",
              "newCrashReportCount": int(os.environ["CRASHES"]),
              "finishedAt": datetime.now(timezone.utc).isoformat(),
              "visibleApp": os.environ["APP"],
              "xctestRun": False,
          }
          Path("build-status/historical-consumption-leaders-visible.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          git add build-status/historical-consumption-leaders-visible.json
          git commit -m "ci: record consumption leaders visible review [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          [[ "${result}" == "success" ]]
