name: Physical Test Notch Indicator

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-notch-indicator
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-notch-indicator:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-notch-indicator'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      APP_ARTIFACT_ID: '8834027738'
      APP_ARTIFACT_DIGEST: '436a67d90198decdfc13b831f9484e52bbee2c04f01f0a9a3c3a4c37d643c6ff'
      FEATURE_HEAD_SHA: '0f921830e5396be9a9f8d3bf70e64c612e623a36'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Run physical notch indicator validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null

          rm -rf physical-app physical-artifact physical-evidence physical-tools
          mkdir -p physical-app physical-artifact physical-evidence physical-tools

          archive="physical-artifact/candidate.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "${archive}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${APP_ARTIFACT_ID}/zip"
          [[ "$(shasum -a 256 "${archive}" | awk '{print $1}')" == "${APP_ARTIFACT_DIGEST}" ]]
          ditto -x -k "${archive}" physical-artifact/content
          inner="$(find physical-artifact/content -type f -name 'MacVitals-*.zip' -print -quit)"
          [[ -n "${inner}" ]]
          python3 scripts/validate_app_zip.py "${inner}"
          ditto -x -k "${inner}" physical-app

          app="${PWD}/physical-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == arm64 ]]

          existing="$(pgrep -x MacVitals || true)"
          if [[ -n "${existing}" ]]; then
            echo "A MacVitals process is already running; refusing to disturb it: ${existing}" >&2
            exit 1
          fi

          cat > physical-tools/NotchEvidence.swift <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          guard CommandLine.arguments.count >= 3,
                let targetPID = Int32(CommandLine.arguments[2]) else { exit(2) }
          let command = CommandLine.arguments[1]
          let screens = NSScreen.screens.map { screen -> [String: Any] in
            [
              "frameX": screen.frame.origin.x,
              "frameY": screen.frame.origin.y,
              "frameWidth": screen.frame.width,
              "frameHeight": screen.frame.height,
              "safeAreaTop": screen.safeAreaInsets.top,
              "isMain": screen == NSScreen.main,
            ]
          }
          let raw = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)
            as? [[String: Any]] ?? []
          var windows: [[String: Any]] = []
          for info in raw {
            guard (info[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == targetPID,
                  let number = (info[kCGWindowNumber as String] as? NSNumber)?.uint32Value,
                  let bounds = info[kCGWindowBounds as String] as? [String: Any],
                  let x = (bounds["X"] as? NSNumber)?.doubleValue,
                  let y = (bounds["Y"] as? NSNumber)?.doubleValue,
                  let width = (bounds["Width"] as? NSNumber)?.doubleValue,
                  let height = (bounds["Height"] as? NSNumber)?.doubleValue else { continue }
            windows.append([
              "id": number,
              "name": info[kCGWindowName as String] as? String ?? "",
              "x": x,
              "y": y,
              "width": width,
              "height": height,
              "layer": (info[kCGWindowLayer as String] as? NSNumber)?.intValue ?? -1,
              "alpha": (info[kCGWindowAlpha as String] as? NSNumber)?.doubleValue ?? -1,
            ])
          }

          if command == "list" {
            let result: [String: Any] = ["screens": screens, "windows": windows]
            let data = try JSONSerialization.data(withJSONObject: result, options: [.prettyPrinted, .sortedKeys])
            FileHandle.standardOutput.write(data)
            exit(0)
          }

          guard command == "capture", CommandLine.arguments.count == 5,
                let windowID = UInt32(CommandLine.arguments[3]) else { exit(2) }
          let output = URL(fileURLWithPath: CommandLine.arguments[4])
          guard let image = CGWindowListCreateImage(
            .null, .optionIncludingWindow, CGWindowID(windowID), [.boundsIgnoreFraming, .bestResolution])
          else { exit(3) }
          let representation = NSBitmapImageRep(cgImage: image)
          guard let data = representation.representation(using: .png, properties: [:]) else { exit(4) }
          try data.write(to: output, options: .atomic)
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 \
            -framework AppKit -framework CoreGraphics \
            physical-tools/NotchEvidence.swift -o physical-tools/notch-evidence

          cleanup() {
            set +e
            if [[ -n "${app_pid:-}" ]]; then
              kill -TERM "${app_pid}" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "${app_pid}" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL "${app_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          "${executable}" \
            -experimentalNotchHUDEnabled YES \
            -ApplePersistenceIgnoreState YES \
            > physical-evidence/app.stdout.log \
            2> physical-evidence/app.stderr.log &
          app_pid=$!

          for _ in {1..100}; do
            kill -0 "${app_pid}" 2>/dev/null || {
              echo 'MacVitals exited before the notch indicator appeared' >&2
              cat physical-evidence/app.stderr.log >&2 || true
              exit 1
            }
            physical-tools/notch-evidence list "${app_pid}" > physical-evidence/window-evidence.json
            if EVIDENCE=physical-evidence/window-evidence.json python3 - <<'PY'
          import json, os
          evidence = json.load(open(os.environ['EVIDENCE'], encoding='utf-8'))
          candidates = [w for w in evidence['windows'] if 300 <= w['width'] <= 600 and 45 <= w['height'] <= 100]
          raise SystemExit(0 if len(candidates) == 1 else 1)
          PY
            then break; fi
            sleep 0.2
          done

          APP_PID="${app_pid}" FEATURE_HEAD_SHA="${FEATURE_HEAD_SHA}" \
          EVIDENCE=physical-evidence/window-evidence.json python3 - <<'PY' \
            > physical-evidence/validation-summary.json
          import json, math, os
          evidence = json.load(open(os.environ['EVIDENCE'], encoding='utf-8'))
          screens = evidence['screens']
          main = next((s for s in screens if s['isMain']), screens[0])
          assert main['safeAreaTop'] > 0, f"physical display has no notch safe area: {main}"
          candidates = [w for w in evidence['windows'] if 300 <= w['width'] <= 600 and 45 <= w['height'] <= 100]
          assert len(candidates) == 1, f"expected exactly one indicator overlay, got {candidates}"
          overlay = candidates[0]
          expected_width = 212 + 72 * 2
          expected_height = min(max(main['safeAreaTop'], 30), 44) + 30
          screen_mid_x = main['frameX'] + main['frameWidth'] / 2
          overlay_mid_x = overlay['x'] + overlay['width'] / 2
          assert abs(overlay['width'] - expected_width) <= 3, (overlay, expected_width)
          assert abs(overlay['height'] - expected_height) <= 3, (overlay, expected_height)
          assert abs(overlay_mid_x - screen_mid_x) <= 3, (overlay_mid_x, screen_mid_x)
          assert overlay['alpha'] > 0, overlay
          print(json.dumps({
            'featureHead': os.environ['FEATURE_HEAD_SHA'],
            'processPID': int(os.environ['APP_PID']),
            'physicalSafeAreaTop': main['safeAreaTop'],
            'overlayWindowCount': len(candidates),
            'overlay': overlay,
            'expectedWidth': expected_width,
            'expectedHeight': expected_height,
            'centerDelta': overlay_mid_x - screen_mid_x,
            'oldTwoPanelLayoutAbsent': True,
            'result': 'passed',
          }, indent=2, sort_keys=True))
          PY

          overlay_id="$(python3 - <<'PY'
          import json
          evidence = json.load(open('physical-evidence/window-evidence.json', encoding='utf-8'))
          candidates = [w for w in evidence['windows'] if 300 <= w['width'] <= 600 and 45 <= w['height'] <= 100]
          print(candidates[0]['id'])
          PY
          )"
          physical-tools/notch-evidence capture "${app_pid}" "${overlay_id}" \
            physical-evidence/notch-indicator-window.png
          [[ -s physical-evidence/notch-indicator-window.png ]]

          sleep 30
          kill -0 "${app_pid}"
          printf 'process-alive-after-30s=true\n' > physical-evidence/runtime-check.txt
          printf 'privacy-scope=MacVitals-own-window-only\n' > physical-evidence/privacy.txt

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-notch-indicator-evidence
          path: physical-evidence/
          if-no-files-found: error
          retention-days: 30
