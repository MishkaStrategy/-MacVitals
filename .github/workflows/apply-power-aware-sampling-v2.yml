name: Apply Power-Aware Sampling V2

on:
  push:
    branches: [feature/power-aware-sampling-intervals]
    paths:
      - .github/workflows/apply-power-aware-sampling-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply staged patch
        shell: bash
        run: |
          set -Eeuo pipefail
          workdir="${RUNNER_TEMP}/macvitals-power-aware-v2"
          rm -rf -- "${workdir}"
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${workdir}"
          cd "${workdir}"
          python3 .github/scripts/apply_power_aware_sampling.py
          rm -f \
            .github/scripts/apply_power_aware_sampling.py \
            .github/workflows/apply-power-aware-sampling-v2.yml \
            .github/workflows/one-shot-power-aware-sampling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add power-aware sampling intervals"
          git push origin "HEAD:${GITHUB_REF_NAME}"
