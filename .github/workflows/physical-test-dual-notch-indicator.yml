name: Physical Test Dual Notch Indicator

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-dual-notch-indicator
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-dual-notch-indicator:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-dual-notch-indicator'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      APP_ARTIFACT_ID: '8837073314'
      APP_ARTIFACT_DIGEST: '04d07981b7da667287219ac37609ff8e61bad6081187f3b009f07728730d3b7e'
      FEATURE_HEAD_SHA: '745d3dbe953c89e92f6d91cc77f497f64dab4e84'
      SOURCE_WORKFLOW_COMMIT: 'fb378feab39f99f0c9adf071613d235eaa80fadf'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Materialize portable physical script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/physical-test-dual-notch-indicator.yml?ref=${SOURCE_WORKFLOW_COMMIT}" \
            > /tmp/source-workflow.json

          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/source-workflow.json').read_text(encoding='utf-8'))
          source = base64.b64decode(payload['content']).decode('utf-8').splitlines()
          step = next(
              index for index, line in enumerate(source)
              if line.strip() == '- name: Validate physical single and dual indicator modes')
          run_line = next(
              index for index in range(step + 1, len(source))
              if source[index].strip() == 'run: |')
          end = next(
              index for index in range(run_line + 1, len(source))
              if source[index].startswith('      - name:'))
          body = [
              line[10:] if line.startswith('          ') else line
              for line in source[run_line + 1:end]
          ]
          script = '\n'.join(body) + '\n'
          replacements = {
              "printf 'timestamp,cpu_percent,rss_kib,threads\\n'":
                  "printf 'timestamp,cpu_percent,rss_kib\\n'",
              'ps -p "${app_pid}" -o lstart=,%cpu=,rss=,thcount=':
                  'ps -p "${app_pid}" -o lstart=,%cpu=,rss=',
              '.rsplit(" ",3)': '.rsplit(" ",2)',
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f'expected one runtime sampling target: {old!r}')
              script = script.replace(old, new, 1)
          Path('/tmp/run-physical-dual-notch.sh').write_text(script, encoding='utf-8')
          PY
          grep -F "timestamp,cpu_percent,rss_kib" /tmp/run-physical-dual-notch.sh
          grep -F 'ps -p "${app_pid}" -o lstart=,%cpu=,rss=' /tmp/run-physical-dual-notch.sh
          bash -n /tmp/run-physical-dual-notch.sh

      - name: Validate physical single and dual indicator modes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash /tmp/run-physical-dual-notch.sh

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-dual-notch-indicator-evidence
          path: physical-evidence/
          if-no-files-found: error
          retention-days: 30
