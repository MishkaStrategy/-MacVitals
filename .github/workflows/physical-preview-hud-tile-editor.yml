name: Physical Preview HUD Tile Editor

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-preview-hud-tile-editor
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-preview-hud-tile-editor'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      ARTIFACT_ID: '8832785557'
      ARTIFACT_SHA256: 29a18647946cded72104a8af3dcacc28f6cdc796d084b837ea95efe296ae5572
      FEATURE_HEAD_SHA: 54e7cbfc8fcaf9a6ea81d13b347543ec1e375436

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Capture exact physical preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null

          rm -rf preview-artifact preview-app preview-evidence preview-tools
          mkdir -p preview-artifact preview-app preview-evidence preview-tools

          outer="preview-artifact/workflow-artifact.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "${outer}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          [[ "$(shasum -a 256 "${outer}" | awk '{print $1}')" == "${ARTIFACT_SHA256}" ]]
          ditto -x -k "${outer}" preview-artifact/content
          inner="$(find preview-artifact/content -type f -name 'MacVitals-*.zip' -print -quit)"
          [[ -n "${inner}" ]]
          python3 scripts/validate_app_zip.py "${inner}"
          ditto -x -k "${inner}" preview-app
          app="${PWD}/preview-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == arm64 ]]

          existing="$(pgrep -x MacVitals || true)"
          if [[ -n "${existing}" ]]; then
            echo "A MacVitals process is already running; refusing to disturb the user's instance: ${existing}" >&2
            exit 1
          fi

          cleanup() {
            set +e
            if [[ -n "${app_pid:-}" ]]; then
              kill -TERM "${app_pid}" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "${app_pid}" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL "${app_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          cat > preview-tools/RightClick.swift <<'SWIFT'
          import CoreGraphics
          import Foundation

          guard CommandLine.arguments.count == 3,
                let x = Double(CommandLine.arguments[1]),
                let y = Double(CommandLine.arguments[2]) else { exit(2) }
          let point = CGPoint(x: x, y: y)
          let source = CGEventSource(stateID: .hidSystemState)
          CGEvent(mouseEventSource: source, mouseType: .rightMouseDown, mouseCursorPosition: point, mouseButton: .right)?.post(tap: .cghidEventTap)
          usleep(90_000)
          CGEvent(mouseEventSource: source, mouseType: .rightMouseUp, mouseCursorPosition: point, mouseButton: .right)?.post(tap: .cghidEventTap)
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 -framework CoreGraphics \
            preview-tools/RightClick.swift -o preview-tools/right-click

          cat > preview-tools/WindowList.swift <<'SWIFT'
          import CoreGraphics
          import Foundation

          guard CommandLine.arguments.count == 2, let targetPID = Int32(CommandLine.arguments[1]) else { exit(2) }
          let raw = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          var windows: [[String: Any]] = []
          for info in raw {
            guard (info[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == targetPID,
                  let number = (info[kCGWindowNumber as String] as? NSNumber)?.intValue,
                  let bounds = info[kCGWindowBounds as String] as? [String: Any],
                  let x = (bounds["X"] as? NSNumber)?.doubleValue,
                  let y = (bounds["Y"] as? NSNumber)?.doubleValue,
                  let width = (bounds["Width"] as? NSNumber)?.doubleValue,
                  let height = (bounds["Height"] as? NSNumber)?.doubleValue else { continue }
            windows.append([
              "id": number,
              "name": info[kCGWindowName as String] as? String ?? "",
              "x": x, "y": y, "width": width, "height": height,
              "layer": (info[kCGWindowLayer as String] as? NSNumber)?.intValue ?? -1,
              "alpha": (info[kCGWindowAlpha as String] as? NSNumber)?.doubleValue ?? -1,
            ])
          }
          let data = try JSONSerialization.data(withJSONObject: windows, options: [.prettyPrinted, .sortedKeys])
          FileHandle.standardOutput.write(data)
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 -framework CoreGraphics \
            preview-tools/WindowList.swift -o preview-tools/window-list

          "${executable}" -experimentalNotchHUDEnabled YES -ApplePersistenceIgnoreState YES \
            > preview-evidence/app.stdout.log 2> preview-evidence/app.stderr.log &
          app_pid=$!
          for _ in {1..100}; do
            kill -0 "${app_pid}" 2>/dev/null || { echo 'MacVitals exited before preview' >&2; exit 1; }
            center="$(TARGET_PID="${app_pid}" osascript <<'APPLESCRIPT' 2>/dev/null || true
          set targetPID to (system attribute "TARGET_PID") as integer
          tell application "System Events"
            try
              set targetProcess to first process whose unix id is targetPID
              tell targetProcess
                set statusItem to menu bar item 1 of menu bar 2
                set itemPosition to position of statusItem
                set itemSize to size of statusItem
                return ((item 1 of itemPosition) + ((item 1 of itemSize) / 2) as integer) & "," & ((item 2 of itemPosition) + ((item 2 of itemSize) / 2) as integer)
              end tell
            end try
          end tell
          APPLESCRIPT
          )"
            [[ "${center}" == *,* ]] && break
            sleep 0.2
          done
          [[ "${center:-}" == *,* ]]
          x="${center%,*}"
          y="${center#*,}"
          preview-tools/right-click "${x}" "${y}"

          TARGET_PID="${app_pid}" osascript <<'APPLESCRIPT'
          set targetPID to (system attribute "TARGET_PID") as integer
          tell application "System Events"
            set targetProcess to first process whose unix id is targetPID
            repeat 50 times
              tell targetProcess
                try
                  set statusItem to menu bar item 1 of menu bar 2
                  set hudItem to first menu item of menu 1 of statusItem whose name contains "HUD"
                  click hudItem
                  return
                end try
              end tell
              delay 0.1
            end repeat
            error "HUD Settings menu item did not become available"
          end tell
          APPLESCRIPT

          for _ in {1..100}; do
            preview-tools/window-list "${app_pid}" > preview-evidence/windows.json
            if WINDOWS_JSON="preview-evidence/windows.json" python3 - <<'PY'
          import json, os
          windows = json.load(open(os.environ['WINDOWS_JSON'], encoding='utf-8'))
          raise SystemExit(0 if any(w['width'] >= 700 and w['height'] >= 600 for w in windows) else 1)
          PY
            then break; fi
            sleep 0.2
          done

          WINDOWS_JSON="preview-evidence/windows.json" python3 - <<'PY' > preview-evidence/capture-ids.txt
          import json, os
          windows = json.load(open(os.environ['WINDOWS_JSON'], encoding='utf-8'))
          settings = max((w for w in windows if w['width'] >= 700 and w['height'] >= 600), key=lambda w: w['width'] * w['height'])
          small = [w for w in windows if 20 <= w['height'] <= 60 and w['width'] >= 70 and w['id'] != settings['id']]
          small.sort(key=lambda w: w['width'], reverse=True)
          print(f"settings={settings['id']}")
          for index, window in enumerate(small[:2], 1):
              print(f"hud{index}={window['id']}")
          PY
          source preview-evidence/capture-ids.txt
          /usr/sbin/screencapture -x -l "${settings}" preview-evidence/hud-tile-editor.png
          [[ -s preview-evidence/hud-tile-editor.png ]]
          /usr/bin/sips -Z 1800 preview-evidence/hud-tile-editor.png >/dev/null

          if [[ -n "${hud1:-}" ]]; then
            /usr/sbin/screencapture -x -l "${hud1}" preview-evidence/hud-panel-1.png
            /usr/bin/sips -Z 1200 preview-evidence/hud-panel-1.png >/dev/null
          fi
          if [[ -n "${hud2:-}" ]]; then
            /usr/sbin/screencapture -x -l "${hud2}" preview-evidence/hud-panel-2.png
            /usr/bin/sips -Z 1200 preview-evidence/hud-panel-2.png >/dev/null
          fi

          FEATURE_HEAD_SHA="${FEATURE_HEAD_SHA}" ARTIFACT_ID="${ARTIFACT_ID}" APP_PID="${app_pid}" \
          python3 - <<'PY' > preview-evidence/preview-metadata.json
          import json, os
          print(json.dumps({
            'featureHead': os.environ['FEATURE_HEAD_SHA'],
            'artifactId': int(os.environ['ARTIFACT_ID']),
            'processPID': int(os.environ['APP_PID']),
            'captureScope': 'MacVitals windows only',
            'desktopCaptured': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload physical preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-preview-hud-tile-editor
          path: preview-evidence/
          if-no-files-found: error
          retention-days: 30
