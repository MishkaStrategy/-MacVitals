name: Shared Process Sampling Validation

on:
  pull_request:
    branches:
      - integration/network-history-leaders-post-notch
    paths:
      - .github/workflows/shared-process-sampling-validation-pr.yml
      - MacVitalsTests/ProcessMetricsSamplingCenterValidationTests.swift
      - scripts/validate_shared_process_sampling_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-process-sampling-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-shared-sampling:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    concurrency:
      group: macvitals-physical-runtime
      cancel-in-progress: false
      queue: max
    env:
      PRODUCT_BASE_SHA: a9d46f02e0f9b624845acd302cb2fd32946667cf
      VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-SharedSamplingValidation
      LIVE_DERIVED_DATA: ${{ github.workspace }}/DerivedData-SharedSamplingLiveHost
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact product ancestry and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          [[ "${PRODUCT_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${VALIDATION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"
          git merge-base --is-ancestor \
            4d143aaa082b0fb15ce86d19ba72c40557939692 \
            "${VALIDATION_SHA}"
          git merge-base --is-ancestor "${PRODUCT_BASE_SHA}" "${VALIDATION_SHA}"
          git diff --quiet "${PRODUCT_BASE_SHA}" "${VALIDATION_SHA}" -- MacVitals project.yml MacVitalsUITests
          git diff --name-only "${PRODUCT_BASE_SHA}" "${VALIDATION_SHA}" > shared-sampling-validation-changes.txt
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              ".github/workflows/shared-process-sampling-validation-pr.yml",
              "MacVitalsTests/ProcessMetricsSamplingCenterValidationTests.swift",
              "scripts/validate_shared_process_sampling_contract.py",
          }
          actual = {
              line.strip()
              for line in Path("shared-sampling-validation-changes.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          if actual != expected:
              raise SystemExit(
                  f"shared-sampling validation branch scope mismatch: expected={sorted(expected)} actual={sorted(actual)}"
              )
          PY
          {
            printf 'product_base_sha=%s\n' "${PRODUCT_BASE_SHA}"
            printf 'validation_sha=%s\n' "${VALIDATION_SHA}"
          } > shared-sampling-validation-source.txt

      - name: Validate shared sampling topology and evidence tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/validate_shared_process_sampling_contract.py \
            scripts/collect_runtime_metrics.py \
            scripts/report_runtime_resources.py
          python3 scripts/validate_shared_process_sampling_contract.py --self-test
          python3 scripts/validate_shared_process_sampling_contract.py
          python3 scripts/collect_runtime_metrics.py --self-test
          python3 scripts/report_runtime_resources.py --self-test

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Validate targeted Swift formatting
        run: swift format lint MacVitalsTests/ProcessMetricsSamplingCenterValidationTests.swift

      - name: Run exact shared-center concurrency tests
        shell: bash
        run: |
          set +e
          rm -rf -- "${DERIVED_DATA}"
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            clean test \
            -only-testing:MacVitalsTests/ProcessMetricsSamplingCenterValidationTests/testConcurrentSubscribersReceiveTheSameInFlightSnapshot \
            -only-testing:MacVitalsTests/ProcessMetricsSamplingCenterValidationTests/testRemainingSubscriberKeepsSharedCacheUntilLastSubscriberStops \
            -only-testing:MacVitalsTests/ProcessMetricsSamplingCenterValidationTests/testExpiredIntervalStillCoalescesTwoConsumersIntoOneSnapshot \
            > shared-sampling-validation-tests.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|failed|Failure|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' \
            shared-sampling-validation-tests.log | tail -n 300 \
            > shared-sampling-validation-test-diagnostics.txt || true
          cat shared-sampling-validation-test-diagnostics.txt
          if [[ ${status} -eq 0 ]]; then
            grep -Eq 'Executed 3 tests, with 0 failures' shared-sampling-validation-test-diagnostics.txt || status=1
            grep -Fq '** TEST SUCCEEDED **' shared-sampling-validation-test-diagnostics.txt || status=1
          fi
          exit ${status}

      - name: Prepare live-host validation scheme
        shell: bash
        run: |
          set -euo pipefail
          READY_FILE="${GITHUB_WORKSPACE}/shared-sampling-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          COMPLETE_FILE="${GITHUB_WORKSPACE}/shared-sampling-complete-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          rm -f -- "${READY_FILE}" "${COMPLETE_FILE}"
          cp project.yml shared-sampling-validation-project.yml
          cat >> shared-sampling-validation-project.yml <<YAML
            MacVitalsSharedSamplingValidation:
              build:
                targets:
                  MacVitals: all
                  MacVitalsTests: [test]
              test:
                gatherCoverageData: false
                language: en
                region: US
                targets:
                  - MacVitalsTests
                environmentVariables:
                  MACVITALS_SHARED_SAMPLING_READY_FILE: "${READY_FILE}"
                  MACVITALS_SHARED_SAMPLING_COMPLETE_FILE: "${COMPLETE_FILE}"
          YAML
          xcodegen generate --spec shared-sampling-validation-project.yml
          rm -rf -- "${LIVE_DERIVED_DATA}"
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitalsSharedSamplingValidation \
            -destination 'platform=macOS' \
            -derivedDataPath "${LIVE_DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            > shared-sampling-live-host-build.log 2>&1
          test -x "${LIVE_DERIVED_DATA}/Build/Products/Debug/MacVitals.app/Contents/MacOS/MacVitals"

      - name: Run live primary plus autonomous-history host evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          READY_FILE="${GITHUB_WORKSPACE}/shared-sampling-ready-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          COMPLETE_FILE="${GITHUB_WORKSPACE}/shared-sampling-complete-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          EXPECTED_EXECUTABLE="${LIVE_DERIVED_DATA}/Build/Products/Debug/MacVitals.app/Contents/MacOS/MacVitals"
          TEST_LOG="shared-sampling-live-host-test.log"
          TEST_PID=""
          OWNED_PID=""
          CLEANUP_STATUS=0

          command_for_pid() {
            ps -p "$1" -o command= 2>/dev/null || true
          }

          exact_pid_is_owned() {
            local pid="$1" executable="$2" command_line
            [[ "${pid}" =~ ^[0-9]+$ && -n "${executable}" ]] || return 1
            kill -0 "${pid}" 2>/dev/null || return 1
            command_line="$(command_for_pid "${pid}")"
            [[ "${command_line}" == "${executable}" || "${command_line}" == "${executable} "* ]]
          }

          terminate_exact_pid() {
            local pid="$1" executable="$2"
            [[ -n "${pid}" ]] || return 0
            exact_pid_is_owned "${pid}" "${executable}" || return 0
            kill -TERM "${pid}" 2>/dev/null || true
            for _ in {1..40}; do
              exact_pid_is_owned "${pid}" "${executable}" || return 0
              sleep 0.25
            done
            if exact_pid_is_owned "${pid}" "${executable}"; then
              kill -KILL "${pid}" 2>/dev/null || true
            fi
            for _ in {1..20}; do
              exact_pid_is_owned "${pid}" "${executable}" || return 0
              sleep 0.25
            done
            return 1
          }

          cleanup() {
            local original_status="$?"
            trap - EXIT HUP INT TERM
            set +e
            if [[ -n "${TEST_PID}" ]] && kill -0 "${TEST_PID}" 2>/dev/null; then
              kill -TERM "${TEST_PID}" 2>/dev/null || true
              wait "${TEST_PID}" 2>/dev/null || CLEANUP_STATUS=1
            fi
            terminate_exact_pid "${OWNED_PID}" "${EXPECTED_EXECUTABLE}" || CLEANUP_STATUS=1
            rm -f -- "${READY_FILE}" "${COMPLETE_FILE}"
            if [[ ${original_status} -ne 0 ]]; then
              exit "${original_status}"
            fi
            exit "${CLEANUP_STATUS}"
          }
          trap cleanup EXIT HUP INT TERM

          rm -f -- "${READY_FILE}" "${COMPLETE_FILE}"
          rm -rf -- shared-sampling-runtime
          [[ -x "${EXPECTED_EXECUTABLE}" ]]

          if pgrep -x MacVitals >/dev/null 2>&1; then
            printf '%s\n' 'Existing MacVitals process detected; live shared-sampling validation fails closed and will not terminate it:' >&2
            while IFS= read -r pid; do
              [[ "${pid}" =~ ^[0-9]+$ ]] || continue
              ps -p "${pid}" -o pid=,command= >&2 || true
            done < <(pgrep -x MacVitals 2>/dev/null || true)
            exit 1
          fi

          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitalsSharedSamplingValidation \
            -destination 'platform=macOS' \
            -derivedDataPath "${LIVE_DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building \
            -only-testing:MacVitalsTests/ProcessMetricsSamplingCenterValidationTests/testLivePrimaryConsumerAndAutonomousHistoryShareSamplingHost \
            > "${TEST_LOG}" 2>&1 &
          TEST_PID=$!

          ready=0
          for _ in {1..90}; do
            if [[ -f "${READY_FILE}" ]]; then
              ready=1
              break
            fi
            if ! kill -0 "${TEST_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ ${ready} -ne 1 ]]; then
            tail -n 300 "${TEST_LOG}" || true
            printf '%s\n' 'Live shared-sampling host never reached the primary/history ready marker' >&2
            exit 1
          fi
          grep -Fxq 'primary-and-history-active' "${READY_FILE}"

          owned_count=0
          while IFS= read -r pid; do
            [[ "${pid}" =~ ^[0-9]+$ ]] || continue
            command_line="$(command_for_pid "${pid}")"
            [[ -n "${command_line}" ]] || continue
            if [[ "${command_line}" == "${EXPECTED_EXECUTABLE}" || "${command_line}" == "${EXPECTED_EXECUTABLE} "* ]]; then
              OWNED_PID="${pid}"
              owned_count=$((owned_count + 1))
            else
              printf 'Foreign MacVitals process appeared and will not be terminated: pid=%s command=%s\n' "${pid}" "${command_line}" >&2
              exit 1
            fi
          done < <(pgrep -x MacVitals 2>/dev/null || true)
          [[ ${owned_count} -eq 1 && -n "${OWNED_PID}" ]]
          exact_pid_is_owned "${OWNED_PID}" "${EXPECTED_EXECUTABLE}"

          PROCESS_ID="${OWNED_PID}" \
          EXPECTED_EXECUTABLE_PATH="${EXPECTED_EXECUTABLE}" \
          OUTPUT_ROOT="${GITHUB_WORKSPACE}/shared-sampling-runtime" \
            bash scripts/collect_runtime_metrics.sh 60 2 \
            > shared-sampling-runtime-collector.log 2>&1
          cat shared-sampling-runtime-collector.log

          summaries="$(find shared-sampling-runtime -mindepth 2 -maxdepth 2 -type f -name summary.json -print)"
          summary_count="$(printf '%s\n' "${summaries}" | awk 'NF { count += 1 } END { print count + 0 }')"
          [[ "${summary_count}" == "1" ]]
          summary_path="$(printf '%s\n' "${summaries}" | awk 'NF { print; exit }')"
          [[ -n "${summary_path}" && -f "${summary_path}" ]]
          python3 scripts/report_runtime_resources.py \
            "${summary_path}" \
            --scenario shared-process-multi-consumer \
            --source-sha "${PRODUCT_BASE_SHA}" \
            --output shared-sampling-resource-summary.json \
            | tee shared-sampling-resource-summary.txt

          set +e
          wait "${TEST_PID}"
          test_status=$?
          set -e
          TEST_PID=""
          tail -n 300 "${TEST_LOG}" > shared-sampling-live-host-test-diagnostics.txt || true
          cat shared-sampling-live-host-test-diagnostics.txt
          [[ ${test_status} -eq 0 ]]
          grep -Fq '** TEST SUCCEEDED **' "${TEST_LOG}"
          [[ -f "${COMPLETE_FILE}" ]]
          grep -Fxq 'history-advanced-and-overlapped-live-snapshot' "${COMPLETE_FILE}"

      - name: Upload shared sampling validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-process-sampling-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shared-sampling-validation-source.txt
            shared-sampling-validation-changes.txt
            shared-sampling-validation-tests.log
            shared-sampling-validation-test-diagnostics.txt
            shared-sampling-live-host-build.log
            shared-sampling-live-host-test.log
            shared-sampling-live-host-test-diagnostics.txt
            shared-sampling-runtime-collector.log
            shared-sampling-runtime/
            shared-sampling-resource-summary.json
            shared-sampling-resource-summary.txt
          if-no-files-found: warn
          retention-days: 30
