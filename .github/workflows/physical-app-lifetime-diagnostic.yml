name: Physical App Lifetime Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-app-lifetime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-lifetime-diagnostic:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.event.pull_request.head.ref == 'feature/macvitals-v1'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Register runner privacy masks
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace_parent="$(dirname "${GITHUB_WORKSPACE}")"
          for value in "${HOME:-}" "${USER:-}" "$(id -un)" "$(hostname)" "${RUNNER_NAME:-}" "${GITHUB_WORKSPACE}" "${workspace_parent}"; do
            if [[ -n "${value}" && ${#value} -ge 3 ]]; then echo "::add-mask::${value}"; fi
          done

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact native candidate
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]]
          [[ "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]]
          build_number=$((700000 + 10#${GITHUB_RUN_NUMBER}))
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "CANDIDATE_VERSION=0.0.${build_number}" >> "${GITHUB_ENV}"

      - name: Resolve preinstalled developer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          developer_dir="$(xcode-select -p)"
          [[ -x "${developer_dir}/usr/bin/xcodebuild" ]] || { echo "Full Xcode is unavailable" >&2; exit 1; }
          echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
          swift_path="$(DEVELOPER_DIR="${developer_dir}" xcrun --find swift)"
          echo "$(dirname "${swift_path}")" >> "${GITHUB_PATH}"
          for candidate in "$(command -v xcodegen 2>/dev/null || true)" /opt/homebrew/bin/xcodegen /usr/local/bin/xcodegen; do
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              echo "$(dirname "${candidate}")" >> "${GITHUB_PATH}"
              exit 0
            fi
          done
          echo "xcodegen is unavailable" >&2
          exit 1

      - name: Build exact unsigned diagnostic candidate
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.identity.outputs.build_number }}
          CODE_SIGNING_ALLOWED: NO
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/diagnose_app_lifetime.py
          python3 scripts/diagnose_app_lifetime.py --self-test
          python3 scripts/materialize_app_icon.py
          python3 scripts/validate_localizations.py
          xcodegen generate
          swift format lint --recursive MacVitals MacVitalsFanHelper MacVitalsFanProbe MacVitalsTests MacVitalsUITests
          bash scripts/package_release.sh "${CANDIDATE_VERSION}"
          python3 - "${CANDIDATE_SHA}" dist/BUILD_MANIFEST.json <<'PY'
          from pathlib import Path
          import json
          import sys

          expected = sys.argv[1]
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if manifest.get("gitCommit") != expected:
              raise SystemExit("Diagnostic candidate manifest does not match the exact checkout")
          if manifest.get("architectures") != ["arm64"]:
              raise SystemExit("Diagnostic candidate is not exactly arm64")
          print("Diagnostic candidate is bound to the exact ARM64 checkout")
          PY

      - name: Run 10-minute app lifetime diagnostic
        id: diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- app-lifetime-evidence diagnostic-run.log
          shim_root="$(mktemp -d /private/tmp/macvitals-lifetime-launchctl.XXXXXX)"
          trap 'rm -rf "${shim_root}"' EXIT
          cat > "${shim_root}/launchctl" <<'SHIM'
          #!/bin/bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "asuser" ]]; then
            [[ $# -ge 3 ]] || { echo "launchctl asuser shim requires UID and command" >&2; exit 64; }
            requested_uid="$2"
            shift 2
            [[ "${requested_uid}" == "$(id -u)" ]] || { echo "launchctl asuser shim refuses a foreign UID" >&2; exit 77; }
            exec "$@"
          fi
          exec /bin/launchctl "$@"
          SHIM
          chmod 700 "${shim_root}/launchctl"
          set +e
          PATH="${shim_root}:${PATH}" launchctl asuser "$(id -u)" caffeinate -ims \
            python3 scripts/diagnose_app_lifetime.py \
              --repository "${PWD}" \
              --app build/MacVitals.xcarchive/Products/Applications/MacVitals.app \
              --duration 600 \
              --interval 2 \
              --output app-lifetime-evidence \
              > diagnostic-run.log 2>&1
          status=$?
          set -e
          cat diagnostic-run.log
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Upload app lifetime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-lifetime-${{ env.CANDIDATE_SHA }}
          path: |
            app-lifetime-evidence/
            diagnostic-run.log
          if-no-files-found: error

      - name: Enforce app lifetime result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ steps.diagnostic.outputs.status }}" == "0" ]] || {
            echo "MacVitals did not remain alive for the complete 600-second diagnostic" >&2
            exit 1
          }
