name: Signed Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version without a leading v
        required: true
        default: 1.0.0
      expected_commit:
        description: Exact 40-character commit SHA already merged into main
        required: true
      authorization:
        description: Type SIGN_MACVITALS_RELEASE_CANDIDATE to authorize a private candidate
        required: true

concurrency:
  group: signed-release-candidate-${{ inputs.expected_commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-candidate:
    runs-on: macos-15
    timeout-minutes: 90
    environment: signed-release
    steps:
      - name: Validate manual authorization
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          EXPECTED_COMMIT_INPUT: ${{ inputs.expected_commit }}
          AUTHORIZATION_INPUT: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [[ "${AUTHORIZATION_INPUT}" == "SIGN_MACVITALS_RELEASE_CANDIDATE" ]] || {
            echo "Signed release authorization phrase is incorrect" >&2
            exit 2
          }
          [[ "${RELEASE_VERSION_INPUT}" =~ ^[0-9]+([.][0-9]+){0,2}$ ]] || {
            echo "Version must contain one to three numeric components" >&2
            exit 2
          }
          [[ "${EXPECTED_COMMIT_INPUT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_commit must be an exact lowercase commit SHA" >&2
            exit 2
          }

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0

      - name: Verify exact main-branch checkout
        shell: bash
        env:
          EXPECTED_COMMIT_INPUT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" == "${EXPECTED_COMMIT_INPUT}" ]] || {
            echo "Checked-out commit ${actual} differs from requested commit" >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${EXPECTED_COMMIT_INPUT}" origin/main || {
            echo "Requested commit is not present on origin/main" >&2
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate source and signed-release tooling
        run: |
          python3 -m py_compile \
            scripts/sign_notarize_release.py \
            scripts/signed_release_entrypoint.py
          python3 scripts/sign_notarize_release.py self-test
          python3 scripts/signed_release_entrypoint.py self-test
          python3 scripts/materialize_app_icon.py
          xcodegen generate
          swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests

      - name: Import temporary Developer ID materials
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACVITALS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACVITALS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACVITALS_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACVITALS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID; do
            [[ -n "${!name}" ]] || {
              echo "Required signed-release secret is missing: ${name}" >&2
              exit 1
            }
          done
          [[ "${NOTARY_KEY_ID}" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "Notary API key ID has an invalid format" >&2
            exit 1
          }
          KEYCHAIN_PATH="${RUNNER_TEMP}/macvitals-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          export CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          export NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_P12_BASE64"], validate=True)
          )
          Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["NOTARY_KEY_P8_BASE64"], validate=True)
          )
          PY
          chmod 600 "${CERTIFICATE_PATH}" "${NOTARY_KEY_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 7200 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          {
            echo "MACVITALS_SIGNING_KEYCHAIN=${KEYCHAIN_PATH}"
            echo "MACVITALS_CERTIFICATE_PATH=${CERTIFICATE_PATH}"
            echo "MACVITALS_NOTARY_KEY_PATH=${NOTARY_KEY_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Build and verify private signed candidate
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          EXPECTED_COMMIT_INPUT: ${{ inputs.expected_commit }}
          AUTHORIZATION_INPUT: ${{ inputs.authorization }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.MACVITALS_DEVELOPER_ID_APPLICATION }}
          DEVELOPER_TEAM_ID: ${{ secrets.MACVITALS_DEVELOPER_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.MACVITALS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACVITALS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_APPLICATION DEVELOPER_TEAM_ID NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!name}" ]] || {
              echo "Required signed-release secret is missing: ${name}" >&2
              exit 1
            }
          done
          python3 scripts/signed_release_entrypoint.py run \
            --version "${RELEASE_VERSION_INPUT}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --expected-commit "${EXPECTED_COMMIT_INPUT}" \
            --identity "${DEVELOPER_ID_APPLICATION}" \
            --team-id "${DEVELOPER_TEAM_ID}" \
            --api-key "${MACVITALS_NOTARY_KEY_PATH}" \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            --authorization "${AUTHORIZATION_INPUT}"

      - name: Upload verified private signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacVitals-${{ inputs.version }}-arm64-developer-id-notarized
          path: signed-dist/
          if-no-files-found: error

      - name: Upload signing and notarization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-evidence-${{ inputs.version }}
          path: signed-release-evidence/
          if-no-files-found: ignore

      - name: Confirm publication remains blocked
        run: |
          {
            echo "## Private signed candidate only"
            echo
            echo "This workflow signs only an exact commit already present on main."
            echo "It has read-only repository permissions and does not create a GitHub Release."
            echo "Publication still requires clean-Mac validation, independent review and separate user authorization."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Destroy temporary signing materials
        if: always()
        shell: bash
        run: |
          set +e
          keychain_path="${MACVITALS_SIGNING_KEYCHAIN:-${RUNNER_TEMP}/macvitals-signing.keychain-db}"
          if [[ -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi
          rm -f -- "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}"/AuthKey_*.p8
