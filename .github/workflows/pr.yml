name: Pull Request
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Swift format lint
        run: swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests
      - name: Build
        run: xcodebuild -quiet -project MacVitals.xcodeproj -scheme MacVitals -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests
        run: xcodebuild -quiet -project MacVitals.xcodeproj -scheme MacVitals -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate YAML and plist XML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/dependabot.yml')"
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('.').rglob('*.plist'): ET.parse(path)
          PY
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
