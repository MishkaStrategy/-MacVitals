name: Pull Request

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  physical-evidence-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Skip duplicate product validation
        run: |
          echo "Product source is already validated in PR #37."
          echo "This stacked Draft PR runs only physical notch-indicator evidence workflows."
