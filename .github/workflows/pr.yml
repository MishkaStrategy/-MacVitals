name: Pull Request

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Swift format lint
        run: swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests

      - name: Build arm64
        run: |
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -configuration Debug -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > native-build.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)' native-build.log | tail -n 300 > native-build-diagnostics.txt || true
          cat native-build-diagnostics.txt
          exit $status

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-diagnostics
          path: |
            native-build.log
            native-build-diagnostics.txt
          if-no-files-found: error

      - name: Run arm64 unit tests
        run: |
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests > native-tests.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|failed|Failure|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' native-tests.log | tail -n 400 > native-test-diagnostics.txt || true
          cat native-test-diagnostics.txt
          exit $status

      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics
          path: |
            native-tests.log
            native-test-diagnostics.txt
          if-no-files-found: ignore

      - name: Bilingual preferences accessibility smoke test
        run: |
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES test -only-testing:MacVitalsUITests/MacVitalsUITests/testPreferencesWindowLaunches > native-ui-tests.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|failed|Failure|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' native-ui-tests.log | tail -n 400 > native-ui-test-diagnostics.txt || true
          cat native-ui-test-diagnostics.txt
          exit $status

      - name: Upload native UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-test-diagnostics
          path: |
            native-ui-tests.log
            native-ui-test-diagnostics.txt
          if-no-files-found: ignore

      - name: Package and verify arm64 release candidate
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGNING_ALLOWED: NO
        run: |
          set +e
          bash scripts/package_release.sh "0.0.${GITHUB_RUN_NUMBER}" > release-package.log 2>&1
          status=$?
          tail -n 500 release-package.log > release-package-diagnostics.txt
          cat release-package-diagnostics.txt
          exit $status

      - name: Upload release package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-diagnostics
          path: |
            release-package.log
            release-package-diagnostics.txt
          if-no-files-found: ignore

      - name: Packaged runtime smoke guardrail
        timeout-minutes: 5
        run: |
          set +e
          bash scripts/run_ci_runtime_smoke.sh \
            build/MacVitals.xcarchive/Products/Applications/MacVitals.app \
            > runtime-smoke-run.log 2>&1
          status=$?
          cat runtime-smoke-run.log
          exit $status

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-evidence-arm64
          path: |
            runtime-smoke-run.log
            runtime-smoke-results/
          if-no-files-found: ignore

      - name: Upload arm64 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: MacVitals-0.0.${{ github.run_number }}-arm64-unsigned
          path: dist/
          if-no-files-found: error

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate YAML, plist XML, localizations, icon and scripts
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/dependabot.yml'); YAML.load_file('.github/workflows/pr.yml'); YAML.load_file('.github/workflows/main.yml'); YAML.load_file('.github/workflows/release.yml')"
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('.').rglob('*.plist'):
              ET.parse(path)
          PY
          python3 -m py_compile scripts/materialize_app_icon.py scripts/validate_localizations.py scripts/validate_output_path.py scripts/validate_release_metadata.py scripts/validate_runtime_metrics.py
          python3 scripts/materialize_app_icon.py --self-test
          python3 scripts/materialize_app_icon.py --check-only
          python3 scripts/validate_localizations.py
          python3 scripts/validate_output_path.py --self-test
          python3 scripts/validate_release_metadata.py --self-test
          python3 scripts/validate_runtime_metrics.py --self-test
          bash -n \
            scripts/package_release.sh \
            scripts/verify_release.sh \
            scripts/collect_runtime_metrics.sh \
            scripts/run_ci_runtime_smoke.sh

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
