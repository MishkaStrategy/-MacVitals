name: Pull Request

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  apple-silicon:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Swift format lint
        run: swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests

      - name: Build arm64
        run: |
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -configuration Debug -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > native-build.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)' native-build.log | tail -n 300 > native-build-diagnostics.txt || true
          cat native-build-diagnostics.txt
          exit $status

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-build-diagnostics
          path: |
            native-build.log
            native-build-diagnostics.txt
          if-no-files-found: error

      - name: Run arm64 unit tests
        run: |
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests > native-tests.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|failed|Failure|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' native-tests.log | tail -n 400 > native-test-diagnostics.txt || true
          cat native-test-diagnostics.txt
          exit $status

      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-diagnostics
          path: |
            native-tests.log
            native-test-diagnostics.txt
          if-no-files-found: ignore

      - name: Package and verify arm64 release candidate
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGNING_ALLOWED: NO
        run: |
          set +e
          bash scripts/package_release.sh "0.0.${GITHUB_RUN_NUMBER}" > release-package.log 2>&1
          status=$?
          tail -n 500 release-package.log > release-package-diagnostics.txt
          cat release-package-diagnostics.txt
          exit $status

      - name: Upload release package diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-diagnostics
          path: |
            release-package.log
            release-package-diagnostics.txt
          if-no-files-found: ignore

      - name: Physical validation harness hosted prepare smoke
        run: |
          python3 scripts/run_physical_validation_hardened.py prepare \
            --version "0.0.${GITHUB_RUN_NUMBER}" \
            --app build/MacVitals.xcarchive/Products/Applications/MacVitals.app

      - name: Guided physical validation prepare smoke
        run: |
          printf '6\n' | python3 scripts/run_physical_validation_guided_hardened.py start \
            --dist dist

      - name: Downloaded artifact staging smoke
        run: |
          artifact="${RUNNER_TEMP}/MacVitals-workflow-artifact.zip"
          (
            cd dist
            zip -q "${artifact}" \
              "MacVitals-0.0.${GITHUB_RUN_NUMBER}.zip" \
              "MacVitals-0.0.${GITHUB_RUN_NUMBER}.dmg" \
              BUILD_STATUS.txt BUILD_MANIFEST.json SHA256SUMS.txt
          )
          printf '6\n' | python3 scripts/prepare_physical_artifact_hardened.py stage "${artifact}"

      - name: Upload hosted physical harness smoke
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-validation-harness-hosted-smoke-arm64
          path: physical-validation-results/
          if-no-files-found: ignore

      - name: Packaged runtime smoke guardrail
        timeout-minutes: 5
        run: |
          set +e
          bash scripts/run_ci_runtime_smoke.sh \
            build/MacVitals.xcarchive/Products/Applications/MacVitals.app \
            > runtime-smoke-run.log 2>&1
          status=$?
          cat runtime-smoke-run.log
          exit $status

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-smoke-evidence-arm64
          path: |
            runtime-smoke-run.log
            runtime-smoke-results/
          if-no-files-found: ignore

      - name: Upload arm64 release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacVitals-0.0.${{ github.run_number }}-arm64-unsigned
          path: dist/
          if-no-files-found: error

  ui-smoke:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Bilingual theme accessibility smoke test
        run: |
          set +e
          ui_derived_data="${RUNNER_TEMP}/MacVitals-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${ui_derived_data}"
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -destination 'platform=macOS' \
            -derivedDataPath "${ui_derived_data}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            clean test \
            -only-testing:MacVitalsUITests/MacVitalsUITests/testPreferencesWindowLaunches \
            > native-ui-tests.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|failed|Failure|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' native-ui-tests.log | tail -n 400 > native-ui-test-diagnostics.txt || true
          cat native-ui-test-diagnostics.txt
          exit $status

      - name: Upload native UI test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ui-test-diagnostics
          path: |
            native-ui-tests.log
            native-ui-test-diagnostics.txt
          if-no-files-found: ignore

  repository-safety:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Validate YAML, plist XML, localizations, icon and scripts
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/dependabot.yml'); Dir['.github/workflows/*.yml'].sort.each { |path| YAML.load_file(path) }"
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('.').rglob('*.plist'):
              ET.parse(path)
          PY
          python3 -m py_compile scripts/materialize_app_icon.py scripts/validate_localizations.py scripts/validate_output_path.py scripts/validate_release_metadata.py scripts/collect_runtime_metrics.py scripts/validate_runtime_metrics.py scripts/run_physical_validation.py scripts/run_physical_validation_hardened.py scripts/run_physical_validation_guided.py scripts/run_physical_validation_guided_hardened.py scripts/prepare_physical_artifact.py scripts/sign_notarize_release.py scripts/signed_release_entrypoint.py
          python3 scripts/materialize_app_icon.py --self-test
          python3 scripts/materialize_app_icon.py --check-only
          python3 scripts/validate_localizations.py
          python3 scripts/validate_output_path.py --self-test
          python3 scripts/validate_release_metadata.py --self-test
          python3 scripts/collect_runtime_metrics.py --self-test
          python3 scripts/validate_runtime_metrics.py --self-test
          python3 scripts/run_physical_validation.py self-test
          python3 scripts/run_physical_validation_hardened.py self-test
          python3 scripts/run_physical_validation_guided.py self-test
          python3 scripts/run_physical_validation_guided_hardened.py self-test
          python3 scripts/prepare_physical_artifact.py self-test
          python3 scripts/sign_notarize_release.py self-test
          python3 scripts/signed_release_entrypoint.py self-test
          bash -n \
            scripts/package_release.sh \
            scripts/verify_release.sh \
            scripts/collect_runtime_metrics.sh \
            scripts/run_ci_runtime_smoke.sh \
            scripts/run_ci_physical_validation_hardened.sh
          bash scripts/run_ci_physical_validation_hardened.sh --self-test

      - name: Install and run Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_DARWIN_ARM64_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          tool_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          python3 - "${archive}" "${GITLEAKS_DARWIN_ARM64_SHA256}" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          expected = sys.argv[2]
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Gitleaks checksum mismatch: expected {expected}, got {actual}")
          PY
          mkdir -p "${tool_dir}"
          tar -xzf "${archive}" -C "${tool_dir}" gitleaks
          chmod 0755 "${tool_dir}/gitleaks"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            scan_range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            scan_range="--all"
          fi
          "${tool_dir}/gitleaks" git \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --log-opts="${scan_range}" \
            .

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-results.sarif
          path: gitleaks-results.sarif
          if-no-files-found: ignore
