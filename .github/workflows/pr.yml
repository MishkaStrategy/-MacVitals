name: Pull Request
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Swift format lint
        run: swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests
      - name: Build
        run: |
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build > native-build.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)' native-build.log | tail -n 300 > native-build-diagnostics.txt || true
          cat native-build-diagnostics.txt
          exit $status
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-diagnostics
          path: |
            native-build.log
            native-build-diagnostics.txt
          if-no-files-found: error
      - name: Unit tests
        run: |
          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests > native-tests.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|failed|Failure|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' native-tests.log | tail -n 400 > native-test-diagnostics.txt || true
          cat native-test-diagnostics.txt
          exit $status
      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics
          path: |
            native-tests.log
            native-test-diagnostics.txt
          if-no-files-found: error
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate YAML and plist XML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/dependabot.yml')"
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('.').rglob('*.plist'): ET.parse(path)
          PY
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
