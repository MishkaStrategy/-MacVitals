name: Physical Test MacVitals 0.0.619 HUD Settings

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-0.0.619-hud-settings
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-test:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-0.0.619-hud-settings'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    env:
      VERSION: 0.0.619
      BUILD_NUMBER: '619'
      ARTIFACT_ID: '8832228428'
      SOURCE_WORKFLOW_RUN: '30743846319'
      OUTER_SHA256: ca58b6f9ce5bc9c23817c54427de096958addf2ca59f459ed124e20f40c36511
      INNER_SHA256: 08b1ce3f4133b4ab3695bf1b48de38e84a2138cf4682aac859e49bb058d66804
      MANIFEST_MERGE_SHA: 995bcdcb42eb015d800af71899812a3d8a8e6785
      FEATURE_HEAD_SHA: 1727ebfba14656312c4204a8174bc52f8cc2bc2a
      FEATURE_BASE_SHA: fe97c56e458b3a9dc67cab8451737bc6945703f5
      PREF_DOMAIN: com.mishkacher.MacVitals
      ENABLED_PREF_KEY: experimentalNotchHUDEnabled
      CONFIG_PREF_KEY: notchHUDConfiguration.v1

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Verify physical Apple Silicon runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null
          python3 -m py_compile \
            scripts/validate_app_zip.py \
            scripts/validate_runtime_metrics_hardened.py
          python3 scripts/validate_app_zip.py --self-test
          python3 scripts/validate_runtime_metrics_hardened.py --self-test

      - name: Download and validate exact unsigned 0.0.619 artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf exact-artifact exact-app physical-evidence hud-witness
          mkdir -p exact-artifact exact-app physical-evidence hud-witness
          outer="exact-artifact/workflow-artifact.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "${outer}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          outer_actual="$(shasum -a 256 "${outer}" | awk '{print $1}')"
          [[ "${outer_actual}" == "${OUTER_SHA256}" ]]
          ditto -x -k "${outer}" exact-artifact/content
          inner="exact-artifact/content/MacVitals-${VERSION}.zip"
          inner_actual="$(shasum -a 256 "${inner}" | awk '{print $1}')"
          [[ "${inner_actual}" == "${INNER_SHA256}" ]]
          python3 scripts/validate_app_zip.py "${inner}"

          MANIFEST="exact-artifact/content/BUILD_MANIFEST.json" \
          EXPECTED_SHA="${MANIFEST_MERGE_SHA}" \
          EXPECTED_VERSION="${VERSION}" \
          EXPECTED_BUILD="${BUILD_NUMBER}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "buildNumber": os.environ["EXPECTED_BUILD"],
              "gitCommit": os.environ["EXPECTED_SHA"],
              "architectures": ["arm64"],
              "signingStatus": "unsigned",
              "notarizationStatus": "not-notarized",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"manifest mismatch: {key}={manifest.get(key)!r}")
          PY

          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${MANIFEST_MERGE_SHA}" \
            > exact-artifact/merge-commit.json
          MERGE_JSON="exact-artifact/merge-commit.json" \
          MERGE_SHA="${MANIFEST_MERGE_SHA}" \
          HEAD_SHA="${FEATURE_HEAD_SHA}" \
          BASE_SHA="${FEATURE_BASE_SHA}" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["MERGE_JSON"]).read_text(encoding="utf-8"))
          expected_message = f"Merge {os.environ['HEAD_SHA']} into {os.environ['BASE_SHA']}"
          if payload.get("sha") != os.environ["MERGE_SHA"]:
              raise SystemExit("manifest merge SHA could not be resolved")
          if payload.get("commit", {}).get("message") != expected_message:
              raise SystemExit("manifest merge commit is not the expected feature-head merge")
          parents = [item.get("sha") for item in payload.get("parents", [])]
          if os.environ["HEAD_SHA"] not in parents or os.environ["BASE_SHA"] not in parents:
              raise SystemExit(f"unexpected merge parents: {parents}")
          PY

          ditto -x -k "${inner}" exact-app
          app="${PWD}/exact-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -x "${executable}" && ! -L "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == arm64 ]]
          if find "${app}" -type l -print -quit | grep -q .; then
            echo 'Application contains a symbolic link' >&2
            exit 1
          fi

          printf '{"artifactId":%s,"sourceWorkflowRun":%s,"version":"%s","manifestMergeCommit":"%s","featureHeadCommit":"%s","featureBaseCommit":"%s","outerSha256":"%s","innerSha256":"%s","architecture":"arm64","signing":"unsigned","notarization":"not-notarized"}\n' \
            "${ARTIFACT_ID}" "${SOURCE_WORKFLOW_RUN}" "${VERSION}" "${MANIFEST_MERGE_SHA}" \
            "${FEATURE_HEAD_SHA}" "${FEATURE_BASE_SHA}" "${outer_actual}" "${inner_actual}" \
            > physical-evidence/artifact-identity.json
          echo "app=${app}" >> "${GITHUB_OUTPUT}"

      - name: Save original HUD preferences
        shell: bash
        run: |
          set -Eeuo pipefail
          state="${RUNNER_TEMP}/macvitals-619-hud-pref-${GITHUB_RUN_ID}"
          rm -rf "${state}"
          mkdir -p "${state}"
          if ! defaults export "${PREF_DOMAIN}" - > "${state}/domain.plist" 2>/dev/null; then
            cat > "${state}/domain.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          PLIST
          fi
          STATE_PLIST="${state}/domain.plist" \
          STATE_JSON="${state}/state.json" \
          ENABLED_KEY="${ENABLED_PREF_KEY}" \
          CONFIG_KEY="${CONFIG_PREF_KEY}" \
          python3 - <<'PY'
          import base64
          import json
          import os
          import plistlib
          from pathlib import Path

          domain = plistlib.loads(Path(os.environ["STATE_PLIST"]).read_bytes())
          enabled = domain.get(os.environ["ENABLED_KEY"])
          config = domain.get(os.environ["CONFIG_KEY"])
          state = {
              "enabledPresent": os.environ["ENABLED_KEY"] in domain,
              "enabledValue": bool(enabled) if enabled is not None else False,
              "configPresent": os.environ["CONFIG_KEY"] in domain,
              "configBase64": base64.b64encode(config).decode("ascii") if isinstance(config, bytes) else "",
          }
          Path(os.environ["STATE_JSON"]).write_text(json.dumps(state), encoding="utf-8")
          PY
          echo "${state}" > physical-evidence/preference-state-path.txt

      - name: Build macOS 13 compatible HUD window witness
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="${PWD}/hud-witness/HUDConfigurationWitness.app"
          mkdir -p "${bundle}/Contents/MacOS"

          cat > hud-witness/HUDConfigurationWitness.swift <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          final class WitnessDelegate: NSObject, NSApplicationDelegate {
            func applicationDidFinishLaunching(_ notification: Notification) {
              let arguments = CommandLine.arguments
              guard arguments.count == 8,
                    let pidValue = Int32(arguments[2]),
                    let expectedLeftWidth = Double(arguments[3]),
                    let expectedRightWidth = Double(arguments[4]),
                    let expectedHeight = Double(arguments[5]),
                    let expectedPanelCount = Int(arguments[6]),
                    let tolerance = Double(arguments[7]) else {
                NSApp.terminate(nil)
                return
              }
              let outputURL = URL(fileURLWithPath: arguments[1])
              DispatchQueue.main.asyncAfter(deadline: .now() + 3) {
                self.inspect(
                  outputURL: outputURL,
                  targetPID: pidValue,
                  expectedLeftWidth: expectedLeftWidth,
                  expectedRightWidth: expectedRightWidth,
                  expectedHeight: expectedHeight,
                  expectedPanelCount: expectedPanelCount,
                  tolerance: tolerance)
              }
            }

            private func inspect(
              outputURL: URL,
              targetPID: Int32,
              expectedLeftWidth: Double,
              expectedRightWidth: Double,
              expectedHeight: Double,
              expectedPanelCount: Int,
              tolerance: Double
            ) {
              let raw = CGWindowListCopyWindowInfo(
                [.optionOnScreenOnly, .excludeDesktopElements],
                kCGNullWindowID) as? [[String: Any]] ?? []
              var windows: [[String: Any]] = []

              for info in raw {
                guard
                  let ownerPID = (info[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value,
                  ownerPID == targetPID,
                  let bounds = info[kCGWindowBounds as String] as? [String: Any],
                  let x = (bounds["X"] as? NSNumber)?.doubleValue,
                  let y = (bounds["Y"] as? NSNumber)?.doubleValue,
                  let width = (bounds["Width"] as? NSNumber)?.doubleValue,
                  let height = (bounds["Height"] as? NSNumber)?.doubleValue
                else { continue }

                windows.append([
                  "x": x,
                  "y": y,
                  "width": width,
                  "height": height,
                  "layer": (info[kCGWindowLayer as String] as? NSNumber)?.intValue ?? -1,
                  "alpha": (info[kCGWindowAlpha as String] as? NSNumber)?.doubleValue ?? -1,
                ])
              }

              func matches(_ window: [String: Any], width: Double) -> Bool {
                guard width > 0,
                      let actualWidth = window["width"] as? Double,
                      let actualHeight = window["height"] as? Double else { return false }
                return abs(actualWidth - width) <= tolerance
                  && abs(actualHeight - expectedHeight) <= tolerance
              }

              let leftObserved = expectedLeftWidth <= 0 || windows.contains {
                matches($0, width: expectedLeftWidth)
              }
              let rightObserved = expectedRightWidth <= 0 || windows.contains {
                matches($0, width: expectedRightWidth)
              }
              let expectedMatches = windows.filter {
                matches($0, width: expectedLeftWidth) || matches($0, width: expectedRightWidth)
              }
              let result: [String: Any] = [
                "targetProcessObserved": !windows.isEmpty,
                "leftPanelObserved": leftObserved,
                "rightPanelObserved": rightObserved,
                "expectedPanelCount": expectedPanelCount,
                "matchingPanelCount": expectedMatches.count,
                "windowCountForTargetPID": windows.count,
                "expectedLeftWidth": expectedLeftWidth,
                "expectedRightWidth": expectedRightWidth,
                "expectedHeight": expectedHeight,
                "windows": windows,
              ]

              do {
                let data = try JSONSerialization.data(
                  withJSONObject: result,
                  options: [.prettyPrinted, .sortedKeys])
                try data.write(to: outputURL, options: .atomic)
              } catch {
                try? "witness-error\n".write(to: outputURL, atomically: true, encoding: .utf8)
              }
              NSApp.terminate(nil)
            }
          }

          let app = NSApplication.shared
          let delegate = WitnessDelegate()
          app.delegate = delegate
          app.setActivationPolicy(.accessory)
          app.run()
          SWIFT

          cat > "${bundle}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>HUDConfigurationWitness</string>
            <key>CFBundleIdentifier</key><string>com.mishkacher.MacVitals.PhysicalHUDConfigurationWitness</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>HUDConfigurationWitness</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          xcrun swiftc -O \
            -target arm64-apple-macos13.0 \
            -framework AppKit \
            -framework CoreGraphics \
            hud-witness/HUDConfigurationWitness.swift \
            -o "${bundle}/Contents/MacOS/HUDConfigurationWitness"
          chmod 0755 "${bundle}/Contents/MacOS/HUDConfigurationWitness"
          plutil -lint "${bundle}/Contents/Info.plist"
          [[ "$(lipo -archs "${bundle}/Contents/MacOS/HUDConfigurationWitness")" == arm64 ]]
          [[ "$(otool -l "${bundle}/Contents/MacOS/HUDConfigurationWitness" | awk '/LC_BUILD_VERSION/{seen=1} seen && /minos/{print $2; exit}')" == 13.0 ]]

      - name: Physically verify configurable HUD and run detailed profile for ten minutes
        id: physical
        shell: bash
        env:
          APP_PATH: ${{ steps.candidate.outputs.app }}
        run: |
          set -Eeuo pipefail
          executable="${APP_PATH}/Contents/MacOS/MacVitals"
          current_pid=""

          stop_current() {
            if [[ -n "${current_pid}" ]] && kill -0 "${current_pid}" >/dev/null 2>&1; then
              kill -TERM "${current_pid}" >/dev/null 2>&1 || true
              for _ in {1..20}; do
                kill -0 "${current_pid}" >/dev/null 2>&1 || break
                sleep 0.25
              done
              kill -0 "${current_pid}" >/dev/null 2>&1 && kill -KILL "${current_pid}" >/dev/null 2>&1 || true
              wait "${current_pid}" 2>/dev/null || true
            fi
            current_pid=""
          }
          trap stop_current EXIT HUP INT TERM

          write_configuration() {
            local profile="$1"
            PROFILE="${profile}" OUTPUT="hud-witness/configuration.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = os.environ["PROFILE"]
          profiles = {
              "balanced": {
                  "leftMetrics": ["cpu", "gpu", "memory"],
                  "rightMetrics": ["fans", "temperature", "battery", "systemPower"],
                  "leftVisibleCount": 3,
                  "rightVisibleCount": 4,
                  "showLeftPanel": True,
                  "showRightPanel": True,
                  "density": "balanced",
                  "textSize": "medium",
                  "backgroundOpacity": 0.62,
                  "showLabels": True,
                  "showSeparators": True,
                  "hideUnavailableMetrics": False,
                  "showOnDisplaysWithoutNotch": True,
              },
              "minimal": {
                  "leftMetrics": ["cpu", "memory"],
                  "rightMetrics": ["temperature", "battery"],
                  "leftVisibleCount": 2,
                  "rightVisibleCount": 2,
                  "showLeftPanel": True,
                  "showRightPanel": True,
                  "density": "compact",
                  "textSize": "small",
                  "backgroundOpacity": 0.52,
                  "showLabels": False,
                  "showSeparators": False,
                  "hideUnavailableMetrics": False,
                  "showOnDisplaysWithoutNotch": True,
              },
              "left-only": {
                  "leftMetrics": ["cpu", "gpu", "memory"],
                  "rightMetrics": ["fans", "temperature", "battery", "systemPower"],
                  "leftVisibleCount": 3,
                  "rightVisibleCount": 4,
                  "showLeftPanel": True,
                  "showRightPanel": False,
                  "density": "balanced",
                  "textSize": "large",
                  "backgroundOpacity": 0.85,
                  "showLabels": True,
                  "showSeparators": True,
                  "hideUnavailableMetrics": False,
                  "showOnDisplaysWithoutNotch": True,
              },
              "detailed": {
                  "leftMetrics": ["cpu", "gpu", "memory", "temperature"],
                  "rightMetrics": ["fans", "battery", "systemPower", "adapterPower", "powerStatus"],
                  "leftVisibleCount": 4,
                  "rightVisibleCount": 5,
                  "showLeftPanel": True,
                  "showRightPanel": True,
                  "density": "spacious",
                  "textSize": "medium",
                  "backgroundOpacity": 0.72,
                  "showLabels": True,
                  "showSeparators": True,
                  "hideUnavailableMetrics": False,
                  "showOnDisplaysWithoutNotch": True,
              },
          }
          payload = {"schemaVersion": 1, "configuration": profiles[profile]}
          Path(os.environ["OUTPUT"]).write_bytes(json.dumps(payload, separators=(",", ":")).encode("utf-8"))
          PY
            hex="$(xxd -p -c 100000 hud-witness/configuration.json)"
            defaults write "${PREF_DOMAIN}" "${CONFIG_PREF_KEY}" -data "${hex}"
            defaults write "${PREF_DOMAIN}" "${ENABLED_PREF_KEY}" -bool true
            defaults read "${PREF_DOMAIN}" "${CONFIG_PREF_KEY}" >/dev/null
            [[ "$(defaults read "${PREF_DOMAIN}" "${ENABLED_PREF_KEY}")" == 1 ]]
          }

          launch_exact() {
            stop_current
            /usr/bin/open -n -F "${APP_PATH}" --args \
              -AppleLanguages '(en)' \
              -AppleLocale en_US \
              -notificationsEnabled NO \
              -showInDock NO \
              -samplingInterval 2 \
              -experimentalNotchHUDEnabled YES

            for _ in {1..160}; do
              matches=()
              while IFS= read -r candidate; do
                [[ "${candidate}" =~ ^[0-9]+$ ]] || continue
                command_line="$(ps -p "${candidate}" -o command= 2>/dev/null || true)"
                if [[ "${command_line}" == "${executable}" || "${command_line}" == "${executable} "* ]]; then
                  matches+=("${candidate}")
                fi
              done < <(pgrep -x MacVitals 2>/dev/null || true)
              if [[ ${#matches[@]} -eq 1 ]]; then
                current_pid="${matches[0]}"
                break
              fi
              if [[ ${#matches[@]} -gt 1 ]]; then
                echo 'Multiple exact MacVitals processes found' >&2
                exit 1
              fi
              sleep 0.25
            done
            [[ -n "${current_pid}" ]] || { echo 'Exact GUI process did not appear' >&2; exit 1; }
            sleep 10
            kill -0 "${current_pid}"
          }

          verify_geometry() {
            local profile="$1"
            local left_width="$2"
            local right_width="$3"
            local height="$4"
            local count="$5"
            local output="${PWD}/physical-evidence/${profile}-window-witness.json"
            /usr/bin/open -n -W -F "${PWD}/hud-witness/HUDConfigurationWitness.app" --args \
              "${output}" "${current_pid}" "${left_width}" "${right_width}" "${height}" "${count}" 12
            [[ -s "${output}" ]]
            WITNESS="${output}" EXPECTED_COUNT="${count}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ["WITNESS"]).read_text(encoding="utf-8"))
          for key in ("targetProcessObserved", "leftPanelObserved", "rightPanelObserved"):
              if evidence.get(key) is not True:
                  raise SystemExit(f"physical HUD witness failed: {key}={evidence.get(key)!r}")
          if evidence.get("matchingPanelCount") != int(os.environ["EXPECTED_COUNT"]):
              raise SystemExit(f"unexpected matching panel count: {evidence.get('matchingPanelCount')}")
          PY
          }

          write_configuration balanced
          launch_exact
          verify_geometry balanced 266 351 28 2
          stop_current

          write_configuration minimal
          launch_exact
          verify_geometry minimal 127 127 24 2
          stop_current

          write_configuration left-only
          launch_exact
          verify_geometry left-only 266 0 28 1
          stop_current

          write_configuration detailed
          launch_exact
          verify_geometry detailed 393 488 32 2

          EXECUTABLE="${executable}" PID_VALUE="${current_pid}" python3 - <<'PY' \
            > physical-evidence/launch-identity.json
          import hashlib
          import json
          import os
          from pathlib import Path

          executable = Path(os.environ["EXECUTABLE"]).resolve()
          print(json.dumps({
              "pidObserved": True,
              "pid": int(os.environ["PID_VALUE"]),
              "commandMatchesExactExecutable": True,
              "executableSha256": hashlib.sha256(executable.read_bytes()).hexdigest(),
              "profilesPhysicallyVerified": ["balanced", "minimal", "left-only", "detailed"],
              "detailedProfileUsedForRuntime": True,
          }, indent=2, sort_keys=True))
          PY

          PROCESS_NAME=MacVitals \
          PROCESS_ID="${current_pid}" \
          EXPECTED_EXECUTABLE_PATH="${executable}" \
          OUTPUT_ROOT="${PWD}/physical-evidence/runtime" \
          bash scripts/collect_runtime_metrics.sh 600 2

          summary="$(find physical-evidence/runtime -name summary.json -type f -print -quit)"
          [[ -n "${summary}" ]]
          python3 scripts/validate_runtime_metrics_hardened.py "${summary}" \
            --minimum-samples 250 \
            --minimum-observed-seconds 590 \
            --maximum-mean-cpu-percent 75 \
            --maximum-p95-cpu-percent 200 \
            --maximum-rss-mib 512 \
            --maximum-rss-growth-mib 128 \
            --maximum-threads 128 \
            --maximum-interval-multiplier 6 \
            | tee physical-evidence/runtime-validation.log

          kill -0 "${current_pid}"
          printf '{"durationRequestedSeconds":600,"processAliveAfterCollection":true,"balancedProfileObserved":true,"minimalProfileObserved":true,"leftOnlyProfileObserved":true,"detailedProfileObserved":true}\n' \
            > physical-evidence/physical-test-result.json
          echo "status=0" >> "${GITHUB_OUTPUT}"

      - name: Restore original HUD preferences
        id: restore
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          file="physical-evidence/preference-state-path.txt"
          if [[ -f "${file}" ]]; then
            state="$(cat "${file}")"
            STATE_JSON="${state}/state.json" \
            DOMAIN="${PREF_DOMAIN}" \
            ENABLED_KEY="${ENABLED_PREF_KEY}" \
            CONFIG_KEY="${CONFIG_PREF_KEY}" \
            python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          state = json.loads(Path(os.environ["STATE_JSON"]).read_text(encoding="utf-8"))
          domain = os.environ["DOMAIN"]
          enabled_key = os.environ["ENABLED_KEY"]
          config_key = os.environ["CONFIG_KEY"]

          if state["enabledPresent"]:
              subprocess.run([
                  "defaults", "write", domain, enabled_key, "-bool",
                  "true" if state["enabledValue"] else "false",
              ], check=True)
          else:
              subprocess.run(["defaults", "delete", domain, enabled_key], check=False)

          if state["configPresent"]:
              data = base64.b64decode(state["configBase64"])
              subprocess.run(["defaults", "write", domain, config_key, "-data", data.hex()], check=True)
          else:
              subprocess.run(["defaults", "delete", domain, config_key], check=False)
          PY
            rm -rf "${state}"
            rm -f "${file}"
          fi
          printf 'preferences-restored=true\n' > physical-evidence/preferences-restored.txt
          echo "status=0" >> "${GITHUB_OUTPUT}"

      - name: Sanitize physical evidence
        id: privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if find physical-evidence -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) -print -quit | grep -q .; then
            echo 'Image evidence is forbidden' >&2
            exit 1
          fi
          HOME_VALUE="${HOME:-}" USER_VALUE="$(id -un)" HOST_VALUE="$(hostname)" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path("physical-evidence")
          replacements = [
              (os.environ.get("HOME_VALUE", ""), "<HOME>"),
              (os.environ.get("USER_VALUE", ""), "<USER>"),
              (os.environ.get("HOST_VALUE", ""), "<HOST>"),
          ]
          path_pattern = re.compile(r"/(?:Users|home)/[^/\s<]+")
          temp_pattern = re.compile(r"/private/(?:tmp|var)/[^\s<]+")
          battery_pattern = re.compile(r"\bInternalBattery-\d+(?:\s+\(id=\d+\))?")
          if root.exists():
              for path in root.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit(f"symlink evidence: {path}")
                  if not path.is_file():
                      continue
                  payload = path.read_bytes()
                  if b"\0" in payload:
                      raise SystemExit(f"binary evidence: {path}")
                  text = payload.decode("utf-8")
                  text = path_pattern.sub("<HOME>", text)
                  text = temp_pattern.sub("<TEMP>", text)
                  text = battery_pattern.sub("<BATTERY_ID>", text)
                  for source, target in replacements:
                      if source and len(source) >= 3:
                          text = text.replace(source, target)
                  path.write_text(text, encoding="utf-8")
          (root / "privacy-passed.txt").write_text("privacy-scan=passed\n", encoding="utf-8")
          PY
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Upload physical test evidence
        if: always() && steps.privacy.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-MacVitals-0.0.619-hud-settings
          path: |
            physical-evidence/
            exact-artifact/content/BUILD_MANIFEST.json
            exact-artifact/content/BUILD_STATUS.txt
            exact-artifact/content/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce physical test result
        if: always()
        shell: bash
        env:
          PHYSICAL_OUTCOME: ${{ steps.physical.outcome }}
          PHYSICAL_STATUS: ${{ steps.physical.outputs.status }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          RESTORE_STATUS: ${{ steps.restore.outputs.status }}
          PRIVACY_OUTCOME: ${{ steps.privacy.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "${PHYSICAL_OUTCOME}" == success ]]
          [[ "${PHYSICAL_STATUS}" == 0 ]]
          [[ "${RESTORE_OUTCOME}" == success ]]
          [[ "${RESTORE_STATUS}" == 0 ]]
          [[ "${PRIVACY_OUTCOME}" == success ]]
