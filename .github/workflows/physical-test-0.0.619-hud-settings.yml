name: Physical Test MacVitals 0.0.619 HUD Settings

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-0.0.619-hud-settings
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-test:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-0.0.619-hud-settings'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Run exact physical HUD validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "${RUNNER_TEMP}/hud-test.b64" <<'PAYLOAD'
          
          PAYLOAD
          /usr/bin/base64 -D < "${RUNNER_TEMP}/hud-test.b64" | /usr/bin/gzip -dc > "${RUNNER_TEMP}/run-physical-hud.sh"
          /bin/bash "${RUNNER_TEMP}/run-physical-hud.sh"

      - name: Upload physical test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-MacVitals-0.0.619-hud-settings
          path: |
            physical-evidence/
            exact-artifact/content/BUILD_MANIFEST.json
            exact-artifact/content/BUILD_STATUS.txt
            exact-artifact/content/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
