name: Interactive Electric Dragon Preview

on:
  pull_request:
    branches: [agent/status-bar-electric-dragon]
    types: [opened, synchronize, reopened]

concurrency:
  group: interactive-electric-dragon-preview
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  launch-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/status-bar-electric-dragon-preview'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      ARTIFACT_ID: '8838601366'
      ARTIFACT_SHA256: a23d3b5dc0bb11a753c5cf788eac406a28322bd7e40390dedf308f3367758303
      FEATURE_HEAD_SHA: bc5ec61901d93ee4b6a92b1baf648c09345bb5df
      PREVIEW_BUNDLE_ID: com.mishkacher.MacVitals.DragonPreview

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Install and launch interactive preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]

          console_user="$(stat -f '%Su' /dev/console)"
          [[ -n "${console_user}" && "${console_user}" != root ]]
          console_uid="$(id -u "${console_user}")"
          [[ "$(id -un)" == "${console_user}" ]]
          launchctl print "gui/${console_uid}" >/dev/null

          rm -rf dragon-preview-download dragon-preview-extract dragon-preview-evidence
          mkdir -p dragon-preview-download dragon-preview-extract dragon-preview-evidence

          outer="dragon-preview-download/artifact.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "${outer}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          actual_sha="$(shasum -a 256 "${outer}" | awk '{print $1}')"
          [[ "${actual_sha}" == "${ARTIFACT_SHA256}" ]]

          ditto -x -k "${outer}" dragon-preview-download/content
          inner="$(find dragon-preview-download/content -type f -name 'MacVitals-*.zip' -print -quit)"
          [[ -n "${inner}" ]]
          python3 scripts/validate_app_zip.py "${inner}"
          ditto -x -k "${inner}" dragon-preview-extract
          source_app="${PWD}/dragon-preview-extract/MacVitals.app"
          [[ -x "${source_app}/Contents/MacOS/MacVitals" ]]
          [[ "$(lipo -archs "${source_app}/Contents/MacOS/MacVitals")" == arm64 ]]

          preview_root="${HOME}/Applications"
          preview_app="${preview_root}/MacVitals Dragon Preview.app"
          preview_executable="${preview_app}/Contents/MacOS/MacVitals"
          mkdir -p "${preview_root}"

          # Stop only a previous Dragon Preview instance. Never touch a normal MacVitals process.
          while IFS= read -r pid; do
            [[ -n "${pid}" ]] || continue
            command="$(ps -p "${pid}" -o command= 2>/dev/null || true)"
            if [[ "${command}" == "${preview_executable}"* ]]; then
              kill -TERM "${pid}" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "${pid}" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL "${pid}" 2>/dev/null || true
            fi
          done < <(pgrep -x MacVitals || true)

          rm -rf "${preview_app}"
          ditto "${source_app}" "${preview_app}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${PREVIEW_BUNDLE_ID}" \
            "${preview_app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName MacVitals Dragon Preview' \
            "${preview_app}/Contents/Info.plist"
          /usr/bin/plutil -lint "${preview_app}/Contents/Info.plist"

          # Store the preview configuration in the isolated preview bundle domain.
          python3 - <<'PY' > dragon-preview-evidence/pet-config.hex
          import json
          payload = {
              "schemaVersion": 1,
              "configuration": {
                  "isEnabled": True,
                  "roamEnabled": True,
                  "cursorInteractionEnabled": True,
                  "respectReducedMotion": False,
                  "size": "medium",
                  "movementSpeed": 1.25,
                  "sparkIntensity": 1.0,
              },
          }
          print(json.dumps(payload, separators=(",", ":")).encode().hex())
          PY
          config_hex="$(cat dragon-preview-evidence/pet-config.hex)"
          defaults write "${PREVIEW_BUNDLE_ID}" statusBarPetConfiguration.v1 -data "${config_hex}"
          defaults read "${PREVIEW_BUNDLE_ID}" statusBarPetConfiguration.v1 \
            > dragon-preview-evidence/defaults-roundtrip.txt

          # Unset runner tracking so the preview remains alive after the Actions job ends.
          launchctl asuser "${console_uid}" /usr/bin/env \
            -u RUNNER_TRACKING_ID \
            -u GITHUB_ACTIONS \
            -u CI \
            /usr/bin/open -na "${preview_app}"

          preview_pid=""
          for _ in {1..100}; do
            while IFS= read -r pid; do
              [[ -n "${pid}" ]] || continue
              command="$(ps -p "${pid}" -o command= 2>/dev/null || true)"
              if [[ "${command}" == "${preview_executable}"* ]]; then
                preview_pid="${pid}"
                break
              fi
            done < <(pgrep -x MacVitals || true)
            [[ -n "${preview_pid}" ]] && break
            sleep 0.2
          done
          [[ -n "${preview_pid}" ]]

          sleep 5
          kill -0 "${preview_pid}"

          cat > dragon-preview-evidence/preview.json <<JSON
          {
            "featureHead": "${FEATURE_HEAD_SHA}",
            "artifactId": ${ARTIFACT_ID},
            "artifactSha256": "${ARTIFACT_SHA256}",
            "bundleIdentifier": "${PREVIEW_BUNDLE_ID}",
            "applicationPath": "${preview_app}",
            "processPID": ${preview_pid},
            "processAlive": true,
            "configuration": {
              "enabled": true,
              "size": "medium",
              "movementSpeed": 1.25,
              "sparkIntensity": 1.0,
              "roam": true,
              "cursorInteraction": true,
              "respectReducedMotion": false
            }
          }
          JSON

          ps -p "${preview_pid}" -o pid=,ppid=,%cpu=,rss=,etime=,command= \
            > dragon-preview-evidence/process.txt
          echo "preview-launched=true" > dragon-preview-evidence/result.txt

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interactive-electric-dragon-preview-evidence
          path: dragon-preview-evidence/
          if-no-files-found: error
          retention-days: 14
