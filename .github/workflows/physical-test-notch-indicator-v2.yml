name: Physical Test Notch Indicator V2

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-notch-indicator
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-notch-indicator:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-notch-indicator'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      APP_ARTIFACT_ID: '8834411613'
      APP_ARTIFACT_DIGEST: 'c0e20c958f24ac098824b2eb176dbd88008509844cca595d0c99a7c477efcd38'
      FEATURE_HEAD_SHA: '10d2766b7bc8f4427043ccc3574a4f2d89eed753'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Validate one physical notch overlay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null
          rm -rf physical-app physical-artifact physical-evidence physical-tools
          mkdir -p physical-app physical-artifact physical-evidence physical-tools

          archive="physical-artifact/candidate.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "${archive}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${APP_ARTIFACT_ID}/zip"
          [[ "$(shasum -a 256 "${archive}" | awk '{print $1}')" == "${APP_ARTIFACT_DIGEST}" ]]
          ditto -x -k "${archive}" physical-artifact/content
          inner="$(find physical-artifact/content -type f -name 'MacVitals-*.zip' -print -quit)"
          python3 scripts/validate_app_zip.py "${inner}"
          ditto -x -k "${inner}" physical-app
          app="${PWD}/physical-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")"
          [[ -x "${executable}" && "$(lipo -archs "${executable}")" == arm64 ]]
          [[ -z "$(pgrep -x MacVitals || true)" ]]

          cat > physical-tools/Preferences.swift <<'SWIFT'
          import CoreFoundation
          import Foundation
          guard CommandLine.arguments.count == 3 else { exit(2) }
          let bundle = CommandLine.arguments[1] as CFString
          let enabled = CommandLine.arguments[2] == "true"
          CFPreferencesSetAppValue("experimentalNotchHUDEnabled" as CFString, enabled as CFBoolean, bundle)
          guard CFPreferencesAppSynchronize(bundle) else { exit(3) }
          guard let stored = CFPreferencesCopyAppValue(
            "experimentalNotchHUDEnabled" as CFString,
            bundle
          ) as? Bool, stored == enabled else { exit(4) }
          SWIFT

          cat > physical-tools/Evidence.swift <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation
          guard CommandLine.arguments.count == 2, let pid = Int32(CommandLine.arguments[1]) else { exit(2) }
          let screens = NSScreen.screens.map { s in
            ["x": s.frame.minX, "width": s.frame.width, "safeAreaTop": s.safeAreaInsets.top,
             "isMain": s == NSScreen.main] as [String: Any]
          }
          let raw = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID)
            as? [[String: Any]] ?? []
          let windows = raw.compactMap { info -> [String: Any]? in
            guard (info[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == pid,
                  let bounds = info[kCGWindowBounds as String] as? [String: Any],
                  let x = (bounds["X"] as? NSNumber)?.doubleValue,
                  let width = (bounds["Width"] as? NSNumber)?.doubleValue,
                  let height = (bounds["Height"] as? NSNumber)?.doubleValue else { return nil }
            return ["x": x, "width": width, "height": height,
                    "alpha": (info[kCGWindowAlpha as String] as? NSNumber)?.doubleValue ?? -1]
          }
          let data = try JSONSerialization.data(
            withJSONObject: ["screens": screens, "windows": windows], options: [.prettyPrinted, .sortedKeys])
          FileHandle.standardOutput.write(data)
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 physical-tools/Preferences.swift -o physical-tools/preferences
          xcrun swiftc -O -target arm64-apple-macos13.0 -framework AppKit -framework CoreGraphics \
            physical-tools/Evidence.swift -o physical-tools/evidence

          original="missing"
          if defaults read "${bundle_id}" experimentalNotchHUDEnabled >/tmp/notch-original 2>/dev/null; then
            original="$(cat /tmp/notch-original)"
          fi
          cleanup() {
            set +e
            [[ -n "${app_pid:-}" ]] && kill -TERM "${app_pid}" 2>/dev/null
            if [[ "${original}" == missing ]]; then
              defaults delete "${bundle_id}" experimentalNotchHUDEnabled 2>/dev/null || true
            elif [[ "${original}" == 1 ]]; then
              physical-tools/preferences "${bundle_id}" true || true
            else
              physical-tools/preferences "${bundle_id}" false || true
            fi
          }
          trap cleanup EXIT
          physical-tools/preferences "${bundle_id}" true
          printf 'bundle-id=%s\nenabled-roundtrip=true\n' "${bundle_id}" \
            > physical-evidence/preference-check.txt

          MACVITALS_NOTCH_DIAGNOSTICS_PATH="${PWD}/physical-evidence/notch-controller.json" \
          "${executable}" -ApplePersistenceIgnoreState YES \
            > physical-evidence/app.stdout.log 2> physical-evidence/app.stderr.log &
          app_pid=$!
          for _ in {1..100}; do
            kill -0 "${app_pid}" 2>/dev/null || exit 1
            physical-tools/evidence "${app_pid}" > physical-evidence/evidence.json
            if EVIDENCE=physical-evidence/evidence.json python3 - <<'PY'
          import json, os
          e=json.load(open(os.environ['EVIDENCE']))
          c=[w for w in e['windows'] if 300 <= w['width'] <= 600 and 45 <= w['height'] <= 100]
          raise SystemExit(0 if len(c)==1 else 1)
          PY
            then break; fi
            sleep .2
          done

          APP_PID="${app_pid}" FEATURE_HEAD_SHA="${FEATURE_HEAD_SHA}" \
          EVIDENCE=physical-evidence/evidence.json python3 - <<'PY' > physical-evidence/summary.json
          import json, os
          e=json.load(open(os.environ['EVIDENCE']))
          main=next((s for s in e['screens'] if s['isMain']), e['screens'][0])
          assert main['safeAreaTop'] > 0, main
          c=[w for w in e['windows'] if 300 <= w['width'] <= 600 and 45 <= w['height'] <= 100]
          assert len(c)==1, c
          w=c[0]
          expected_width=356
          expected_height=min(max(main['safeAreaTop'],30),44)+30
          center_delta=(w['x']+w['width']/2)-(main['x']+main['width']/2)
          assert abs(w['width']-expected_width)<=3, (w,expected_width)
          assert abs(w['height']-expected_height)<=3, (w,expected_height)
          assert abs(center_delta)<=3, center_delta
          print(json.dumps({"result":"passed","featureHead":os.environ['FEATURE_HEAD_SHA'],
            "processPID":int(os.environ['APP_PID']),"physicalSafeAreaTop":main['safeAreaTop'],
            "overlayWindowCount":1,"overlay":w,"centerDelta":center_delta,
            "oldTwoPanelLayoutAbsent":True},indent=2,sort_keys=True))
          PY
          sleep 30
          kill -0 "${app_pid}"
          printf 'process-alive-after-30s=true\npreferences-restored-on-exit=true\n' \
            > physical-evidence/runtime.txt

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-notch-indicator-evidence-v2
          path: physical-evidence/
          if-no-files-found: error
          retention-days: 30
