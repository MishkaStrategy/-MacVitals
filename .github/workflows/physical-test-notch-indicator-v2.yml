name: Physical Test Notch Indicator V2 Retired

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-test-notch-indicator
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retired:
    if: github.event.pull_request.head.ref == 'agent/physical-test-notch-indicator'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Superseded by Physical Test Notch Indicator V4.'
