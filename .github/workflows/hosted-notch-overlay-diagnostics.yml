name: Hosted Notch Overlay Diagnostics

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: hosted-notch-overlay-diagnostics
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  hosted-notch-overlay:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/physical-test-notch-indicator'
    runs-on: macos-15
    timeout-minutes: 12
    env:
      APP_ARTIFACT_ID: '8834411613'
      APP_ARTIFACT_DIGEST: 'c0e20c958f24ac098824b2eb176dbd88008509844cca595d0c99a7c477efcd38'
      FEATURE_HEAD_SHA: '10d2766b7bc8f4427043ccc3574a4f2d89eed753'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Validate hosted overlay lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin ]]
          rm -rf hosted-app hosted-artifact hosted-evidence hosted-tools
          mkdir -p hosted-app hosted-artifact hosted-evidence hosted-tools

          archive="hosted-artifact/candidate.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "${archive}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${APP_ARTIFACT_ID}/zip"
          [[ "$(shasum -a 256 "${archive}" | awk '{print $1}')" == "${APP_ARTIFACT_DIGEST}" ]]
          ditto -x -k "${archive}" hosted-artifact/content
          inner="$(find hosted-artifact/content -type f -name 'MacVitals-*.zip' -print -quit)"
          python3 scripts/validate_app_zip.py "${inner}"
          ditto -x -k "${inner}" hosted-app
          app="${PWD}/hosted-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")"
          [[ -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == *arm64* ]]

          cat > hosted-tools/Preferences.swift <<'SWIFT'
          import CoreFoundation
          import Foundation

          guard CommandLine.arguments.count == 2 else { exit(2) }
          let bundle = CommandLine.arguments[1] as CFString
          let configuration = """
          {"schemaVersion":3,"configuration":{"metric":"cpu","showValueText":true,"showSensorName":true,"colorMode":"automatic","accent":"cyan","lineThickness":2.5,"horizontalExtension":72,"trackOpacity":0.18,"glowIntensity":0.62,"warningThreshold":75,"criticalThreshold":90,"animateChanges":true,"showOnDisplaysWithoutNotch":true}}
          """
          guard let data = configuration.data(using: .utf8) else { exit(3) }
          CFPreferencesSetAppValue("experimentalNotchHUDEnabled" as CFString, true as CFBoolean, bundle)
          CFPreferencesSetAppValue("notchHUDConfiguration.v1" as CFString, data as CFData, bundle)
          guard CFPreferencesAppSynchronize(bundle) else { exit(4) }
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 hosted-tools/Preferences.swift -o hosted-tools/preferences

          original_domain="hosted-evidence/original-defaults.plist"
          defaults export "${bundle_id}" "${original_domain}" >/dev/null 2>&1 || true
          cleanup() {
            set +e
            launchctl unsetenv MACVITALS_NOTCH_DIAGNOSTICS_PATH 2>/dev/null || true
            [[ -n "${app_pid:-}" ]] && kill -TERM "${app_pid}" 2>/dev/null || true
            if [[ -s "${original_domain}" ]]; then
              defaults import "${bundle_id}" "${original_domain}" >/dev/null 2>&1 || true
            else
              defaults delete "${bundle_id}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          hosted-tools/preferences "${bundle_id}"

          diagnostics="${PWD}/hosted-evidence/notch-controller.json"
          launchctl setenv MACVITALS_NOTCH_DIAGNOSTICS_PATH "${diagnostics}"
          /usr/bin/open -na "${app}" --args -ApplePersistenceIgnoreState YES
          app_pid=""
          for _ in {1..120}; do
            app_pid="$(pgrep -x MacVitals | tail -n 1 || true)"
            [[ -n "${app_pid}" && -s "${diagnostics}" ]] && break
            sleep .1
          done
          [[ -n "${app_pid}" ]]
          [[ -s "${diagnostics}" ]]

          DIAGNOSTICS="${diagnostics}" FEATURE_HEAD_SHA="${FEATURE_HEAD_SHA}" \
          python3 - <<'PY' > hosted-evidence/summary.json
          import json, os
          path = os.environ['DIAGNOSTICS']
          diagnostic = json.load(open(path, encoding='utf-8'))
          assert diagnostic['event'] in ('ordered', 'ordered-next-run-loop'), diagnostic
          assert diagnostic['enabled'] is True, diagnostic
          assert diagnostic['panelAllocated'] is True, diagnostic
          assert diagnostic['panelVisible'] is True, diagnostic
          assert diagnostic['panelWindowNumber'] > 0, diagnostic
          assert abs(diagnostic['frameWidth'] - 356) <= 3, diagnostic
          print(json.dumps({
            'result': 'passed',
            'featureHead': os.environ['FEATURE_HEAD_SHA'],
            'diagnostic': diagnostic,
            'launchMode': 'LaunchServices',
            'simulatedNoNotchDisplay': True,
          }, indent=2, sort_keys=True))
          PY
          sleep 10
          kill -0 "${app_pid}"
          printf 'process-alive-after-10s=true\npreferences-restored-on-exit=true\n' \
            > hosted-evidence/runtime.txt

      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-notch-overlay-evidence
          path: hosted-evidence/
          if-no-files-found: error
          retention-days: 30
