name: Physical Run MacVitals 0.0.601 Notch HUD v5

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-run-0.0.601-notch-hud-v5
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  physical-run:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-test-0.0.601-notch-hud'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      VERSION: 0.0.601
      ARTIFACT_ID: '8830297443'
      OUTER_SHA256: 933b0d195a9f5291c28ade9c3595e1b298540d6c5074385c81c0c854932af026
      INNER_SHA256: 8eeba29ecb0d18ba22a8454349590977a2ab51bb5d8aa2789d820ac0ba159100
      MANIFEST_SHA: f7a915a001ab12e1b490986555aa8e089ff225c6
      PREF_DOMAIN: com.mishkacher.MacVitals
      PREF_KEY: experimentalNotchHUDEnabled

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Verify physical GUI runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null
          command -v screencapture >/dev/null
          python3 -m py_compile scripts/validate_app_zip.py scripts/validate_runtime_metrics_hardened.py
          python3 scripts/validate_app_zip.py --self-test
          python3 scripts/validate_runtime_metrics_hardened.py --self-test

      - name: Download and validate exact build 0.0.601
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf exact-artifact exact-app physical-evidence
          mkdir -p exact-artifact exact-app physical-evidence
          outer="exact-artifact/workflow-artifact.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "${outer}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          outer_actual="$(shasum -a 256 "${outer}" | awk '{print $1}')"
          [[ "${outer_actual}" == "${OUTER_SHA256}" ]]
          ditto -x -k "${outer}" exact-artifact/content
          inner="exact-artifact/content/MacVitals-${VERSION}.zip"
          inner_actual="$(shasum -a 256 "${inner}" | awk '{print $1}')"
          [[ "${inner_actual}" == "${INNER_SHA256}" ]]
          python3 scripts/validate_app_zip.py "${inner}"
          MANIFEST="exact-artifact/content/BUILD_MANIFEST.json" EXPECTED_SHA="${MANIFEST_SHA}" EXPECTED_VERSION="${VERSION}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8'))
          expected = {
              'version': os.environ['EXPECTED_VERSION'],
              'buildNumber': '601',
              'gitCommit': os.environ['EXPECTED_SHA'],
              'architectures': ['arm64'],
              'signingStatus': 'unsigned',
              'notarizationStatus': 'not-notarized',
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'manifest mismatch: {key}={manifest.get(key)!r}')
          PY
          ditto -x -k "${inner}" exact-app
          app="${PWD}/exact-app/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -x "${executable}" && ! -L "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == arm64 ]]
          if find "${app}" -type l -print -quit | grep -q .; then
            echo 'Application contains a symbolic link' >&2
            exit 1
          fi
          printf '{"artifactId":8830297443,"sourceWorkflowRun":30737961096,"version":"0.0.601","sourceCommit":"%s","outerSha256":"%s","innerSha256":"%s","architecture":"arm64","signing":"unsigned","notarization":"not-notarized"}\n' \
            "${MANIFEST_SHA}" "${outer_actual}" "${inner_actual}" > physical-evidence/artifact-identity.json
          echo "app=${app}" >> "${GITHUB_OUTPUT}"

      - name: Save original HUD preference
        shell: bash
        run: |
          set -Eeuo pipefail
          state="${RUNNER_TEMP}/macvitals-601-pref-v5-${GITHUB_RUN_ID}"
          rm -rf "${state}"
          mkdir -p "${state}"
          if defaults read "${PREF_DOMAIN}" "${PREF_KEY}" > "${state}/value" 2>/dev/null; then
            echo present > "${state}/status"
          else
            echo absent > "${state}/status"
          fi
          echo "${state}" > physical-evidence/preference-state-path.txt

      - name: Verify HUD locally and run ten-minute stability test
        id: physical
        shell: bash
        env:
          APP_PATH: ${{ steps.candidate.outputs.app }}
        run: |
          set -Eeuo pipefail
          executable="${APP_PATH}/Contents/MacOS/MacVitals"
          private_dir="${RUNNER_TEMP}/macvitals-601-private-visual-${GITHUB_RUN_ID}"
          rm -rf "${private_dir}"
          mkdir -p "${private_dir}"
          baseline_png="${private_dir}/baseline.png"
          enabled_png="${private_dir}/enabled.png"
          pid=""

          stop_candidate() {
            if [[ -n "${pid}" ]] && kill -0 "${pid}" >/dev/null 2>&1; then
              kill -TERM "${pid}" >/dev/null 2>&1 || true
              for _ in {1..20}; do
                kill -0 "${pid}" >/dev/null 2>&1 || break
                sleep 0.25
              done
              kill -0 "${pid}" >/dev/null 2>&1 && kill -KILL "${pid}" >/dev/null 2>&1 || true
              wait "${pid}" 2>/dev/null || true
            fi
            pid=""
          }
          cleanup() {
            stop_candidate
            rm -rf "${private_dir}"
          }
          trap cleanup EXIT HUP INT TERM

          find_candidate_pid() {
            local candidate command_line
            local -a matches=()
            for _ in {1..120}; do
              matches=()
              while IFS= read -r candidate; do
                [[ "${candidate}" =~ ^[0-9]+$ ]] || continue
                command_line="$(ps -p "${candidate}" -o command= 2>/dev/null || true)"
                if [[ "${command_line}" == "${executable}" || "${command_line}" == "${executable} "* ]]; then
                  matches+=("${candidate}")
                fi
              done < <(pgrep -x MacVitals 2>/dev/null || true)
              if [[ ${#matches[@]} -eq 1 ]]; then
                printf '%s\n' "${matches[0]}"
                return 0
              fi
              [[ ${#matches[@]} -le 1 ]] || return 2
              sleep 0.25
            done
            return 1
          }

          defaults write "${PREF_DOMAIN}" "${PREF_KEY}" -bool false
          /usr/bin/open -n -F "${APP_PATH}" --args \
            -AppleLanguages '(en)' -AppleLocale en_US \
            -notificationsEnabled NO -showInDock NO -samplingInterval 2 \
            -experimentalNotchHUDEnabled NO
          pid="$(find_candidate_pid)"
          sleep 12
          kill -0 "${pid}"
          screencapture -x -D 1 "${baseline_png}"
          [[ -s "${baseline_png}" ]]
          stop_candidate

          defaults write "${PREF_DOMAIN}" "${PREF_KEY}" -bool true
          /usr/bin/open -n -F "${APP_PATH}" --args \
            -AppleLanguages '(en)' -AppleLocale en_US \
            -notificationsEnabled NO -showInDock NO -samplingInterval 2 \
            -experimentalNotchHUDEnabled YES
          pid="$(find_candidate_pid)"
          sleep 15
          kill -0 "${pid}"
          screencapture -x -D 1 "${enabled_png}"
          [[ -s "${enabled_png}" ]]

          cat > "${RUNNER_TEMP}/compare-hud-v5.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          import ImageIO

          struct Raster {
            let width: Int
            let height: Int
            let bytes: [UInt8]
          }

          func load(_ path: String) throws -> Raster {
            let url = URL(fileURLWithPath: path) as CFURL
            guard let source = CGImageSourceCreateWithURL(url, nil),
                  let image = CGImageSourceCreateImageAtIndex(source, 0, nil) else {
              throw NSError(domain: "MacVitalsVisualDiff", code: 1)
            }
            let width = image.width
            let height = image.height
            var bytes = [UInt8](repeating: 0, count: width * height * 4)
            guard let context = CGContext(
              data: &bytes,
              width: width,
              height: height,
              bitsPerComponent: 8,
              bytesPerRow: width * 4,
              space: CGColorSpaceCreateDeviceRGB(),
              bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue
                | CGBitmapInfo.byteOrder32Big.rawValue) else {
              throw NSError(domain: "MacVitalsVisualDiff", code: 2)
            }
            context.draw(image, in: CGRect(x: 0, y: 0, width: width, height: height))
            return Raster(width: width, height: height, bytes: bytes)
          }

          struct Metrics {
            let changedFraction: Double
            let meanRGBDelta: Double
            let changedPixels: Int
            let totalPixels: Int
          }

          func metrics(_ a: Raster, _ b: Raster, yStart: Int, yEnd: Int) -> Metrics {
            let xStart = Int(Double(a.width) * 0.34)
            let xEnd = Int(Double(a.width) * 0.66)
            var changed = 0
            var total = 0
            var deltaSum = 0
            for y in max(0, yStart)..<min(a.height, yEnd) {
              for x in xStart..<xEnd {
                let index = (y * a.width + x) * 4
                let delta = abs(Int(a.bytes[index]) - Int(b.bytes[index]))
                  + abs(Int(a.bytes[index + 1]) - Int(b.bytes[index + 1]))
                  + abs(Int(a.bytes[index + 2]) - Int(b.bytes[index + 2]))
                deltaSum += delta
                if delta >= 45 { changed += 1 }
                total += 1
              }
            }
            return Metrics(
              changedFraction: total > 0 ? Double(changed) / Double(total) : 0,
              meanRGBDelta: total > 0 ? Double(deltaSum) / Double(total) : 0,
              changedPixels: changed,
              totalPixels: total)
          }

          let baseline = try load(ProcessInfo.processInfo.environment["BASELINE"]!)
          let enabled = try load(ProcessInfo.processInfo.environment["ENABLED"]!)
          guard baseline.width == enabled.width, baseline.height == enabled.height else {
            throw NSError(domain: "MacVitalsVisualDiff", code: 3)
          }
          let roiHeight = min(Int(Double(baseline.height) * 0.27), 650)
          let first = metrics(baseline, enabled, yStart: 0, yEnd: roiHeight)
          let last = metrics(
            baseline,
            enabled,
            yStart: baseline.height - roiHeight,
            yEnd: baseline.height)
          let selected = first.changedFraction >= last.changedFraction ? first : last
          let passed = selected.changedFraction >= 0.025
            && selected.meanRGBDelta >= 2.0
            && selected.changedPixels >= 5_000
          let payload: [String: Any] = [
            "method": "private before-after screenshot diff; screenshots deleted before upload",
            "imageWidth": baseline.width,
            "imageHeight": baseline.height,
            "roiHeight": roiHeight,
            "changedFraction": selected.changedFraction,
            "meanRGBDelta": selected.meanRGBDelta,
            "changedPixels": selected.changedPixels,
            "totalPixels": selected.totalPixels,
            "requiredChangedFraction": 0.025,
            "requiredMeanRGBDelta": 2.0,
            "requiredChangedPixels": 5_000,
            "passed": passed,
          ]
          let data = try JSONSerialization.data(withJSONObject: payload, options: [.prettyPrinted, .sortedKeys])
          FileHandle.standardOutput.write(data)
          FileHandle.standardOutput.write(Data("\n".utf8))
          guard passed else { exit(1) }
          SWIFT
          BASELINE="${baseline_png}" ENABLED="${enabled_png}" \
            xcrun swift "${RUNNER_TEMP}/compare-hud-v5.swift" \
            > physical-evidence/hud-visual-diff.json
          rm -f "${baseline_png}" "${enabled_png}"

          PROCESS_NAME=MacVitals \
          PROCESS_ID="${pid}" \
          EXPECTED_EXECUTABLE_PATH="${executable}" \
          OUTPUT_ROOT="${PWD}/physical-evidence/runtime" \
          bash scripts/collect_runtime_metrics.sh 600 2
          summary="$(find physical-evidence/runtime -name summary.json -type f -print -quit)"
          [[ -n "${summary}" ]]
          python3 scripts/validate_runtime_metrics_hardened.py "${summary}" \
            --minimum-samples 250 \
            --minimum-observed-seconds 590 \
            --maximum-mean-cpu-percent 75 \
            --maximum-p95-cpu-percent 200 \
            --maximum-rss-mib 512 \
            --maximum-rss-growth-mib 128 \
            --maximum-threads 128 \
            --maximum-interval-multiplier 6 \
            | tee physical-evidence/runtime-validation.log
          kill -0 "${pid}"
          echo "status=0" >> "${GITHUB_OUTPUT}"

      - name: Restore original HUD preference
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          file="physical-evidence/preference-state-path.txt"
          [[ -f "${file}" ]] || exit 0
          state="$(cat "${file}")"
          if [[ "$(cat "${state}/status" 2>/dev/null || echo absent)" == present ]]; then
            case "$(cat "${state}/value")" in
              1|true|TRUE|yes|YES) defaults write "${PREF_DOMAIN}" "${PREF_KEY}" -bool true ;;
              *) defaults write "${PREF_DOMAIN}" "${PREF_KEY}" -bool false ;;
            esac
          else
            defaults delete "${PREF_DOMAIN}" "${PREF_KEY}" >/dev/null 2>&1 || true
          fi
          rm -rf "${state}"
          rm -f "${file}"

      - name: Sanitize evidence and assert no screenshot remains
        id: privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if find physical-evidence -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) -print -quit | grep -q .; then
            echo 'Screenshot leaked into uploadable evidence' >&2
            exit 1
          fi
          HOME_VALUE="${HOME:-}" USER_VALUE="$(id -un)" HOST_VALUE="$(hostname)" python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          root = Path('physical-evidence')
          replacements = [
              (os.environ.get('HOME_VALUE', ''), '<HOME>'),
              (os.environ.get('USER_VALUE', ''), '<USER>'),
              (os.environ.get('HOST_VALUE', ''), '<HOST>'),
          ]
          path_pattern = re.compile(r'/(?:Users|home)/[^/\s<]+')
          temp_pattern = re.compile(r'/private/(?:tmp|var)/[^\s<]+')
          battery_pattern = re.compile(r'\bInternalBattery-\d+(?:\s+\(id=\d+\))?')
          if root.exists():
              for path in root.rglob('*'):
                  if path.is_symlink():
                      raise SystemExit(f'symlink evidence: {path}')
                  if not path.is_file():
                      continue
                  payload = path.read_bytes()
                  if b'\0' in payload:
                      raise SystemExit(f'binary evidence: {path}')
                  text = payload.decode('utf-8')
                  text = path_pattern.sub('<HOME>', text)
                  text = temp_pattern.sub('<TEMP>', text)
                  text = battery_pattern.sub('<BATTERY_ID>', text)
                  for source, target in replacements:
                      if source and len(source) >= 3:
                          text = text.replace(source, target)
                  path.write_text(text, encoding='utf-8')
          (root / 'privacy-passed.txt').write_text('privacy-scan=passed\n', encoding='utf-8')
          PY
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Upload physical evidence
        if: always() && steps.privacy.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-MacVitals-0.0.601-notch-hud-v5
          path: |
            physical-evidence/
            exact-artifact/content/BUILD_MANIFEST.json
            exact-artifact/content/BUILD_STATUS.txt
            exact-artifact/content/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce physical result
        if: always()
        shell: bash
        env:
          PHYSICAL: ${{ steps.physical.outputs.status }}
          PRIVACY: ${{ steps.privacy.outputs.ready }}
        run: |
          set -Eeuo pipefail
          [[ "${PHYSICAL:-}" == 0 ]]
          [[ "${PRIVACY:-}" == true ]]
          echo 'Exact MacVitals 0.0.601 physical HUD test passed'
