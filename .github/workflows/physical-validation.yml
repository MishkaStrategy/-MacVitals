name: Physical Apple Silicon Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: physical-apple-silicon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  physical-validation:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.actor == github.repository_owner &&
       github.event.pull_request.head.ref == 'feature/macvitals-v1')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 540
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Register runner privacy masks
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace_parent=""
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            workspace_parent="$(dirname "${GITHUB_WORKSPACE}")"
          fi
          for value in \
            "${HOME:-}" \
            "${USER:-}" \
            "$(id -un 2>/dev/null || true)" \
            "$(hostname 2>/dev/null || true)" \
            "${RUNNER_NAME:-}" \
            "${GITHUB_WORKSPACE:-}" \
            "${workspace_parent}"; do
            if [[ -n "${value}" && ${#value} -ge 3 ]]; then
              echo "::add-mask::${value}"
            fi
          done

      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify runner and exact checkout
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == "Darwin" ]] || { echo "Physical runner must be macOS" >&2; exit 1; }
          [[ "$(uname -m)" == "arm64" ]] || { echo "Physical runner must be native arm64" >&2; exit 1; }
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Candidate SHA is invalid" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || { echo "Exact candidate checkout mismatch" >&2; exit 1; }
          [[ "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]] || { echo "GitHub run number is not numeric" >&2; exit 1; }
          build_number=$((500000 + 10#${GITHUB_RUN_NUMBER}))
          candidate_version="0.0.${build_number}"
          echo "sha=${CANDIDATE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${CANDIDATE_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          echo "version=${candidate_version}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "CANDIDATE_VERSION=${candidate_version}" >> "${GITHUB_ENV}"
          echo "PHYSICAL_BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"

      - name: Validate tooling and physical host without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          for command_name in python3 stat sw_vers xcodebuild xcodegen xcrun swift pmset; do
            command -v "${command_name}" >/dev/null 2>&1 || {
              echo "Required preinstalled runner tool is missing: ${command_name}" >&2
              exit 1
            }
          done
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcodegen --version
          swift --version
          runner_user="$(id -un)"
          console_user="$(stat -f '%Su' /dev/console 2>/dev/null || true)"
          echo "Runner user is registered; console-session state will be enforced by the physical collector."
          if [[ -n "${console_user}" && "${console_user}" != "root" && "${console_user}" != "loginwindow" && "${console_user}" != "${runner_user}" ]]; then
            echo "Active console user differs from runner user; GUI-dependent gates may report unsupported." >&2
          fi
          pmset -g batt || true
          pmset -g therm || true
          python3 -m py_compile \
            scripts/materialize_app_icon.py \
            scripts/validate_localizations.py \
            scripts/validate_output_path.py \
            scripts/validate_release_metadata.py \
            scripts/collect_runtime_metrics.py \
            scripts/validate_runtime_metrics.py \
            scripts/run_physical_validation.py \
            scripts/run_physical_validation_guided.py \
            scripts/prepare_physical_artifact.py \
            scripts/sign_notarize_release.py \
            scripts/signed_release_entrypoint.py
          bash -n \
            scripts/package_release.sh \
            scripts/verify_release.sh \
            scripts/collect_runtime_metrics.sh \
            scripts/run_ci_runtime_smoke.sh \
            scripts/run_ci_physical_validation.sh
          bash scripts/run_ci_physical_validation.sh --self-test
          python3 scripts/run_physical_validation.py self-test
          python3 scripts/run_physical_validation_guided.py self-test
          python3 scripts/prepare_physical_artifact.py self-test

      - name: Generate project and lint
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/materialize_app_icon.py
          python3 scripts/validate_localizations.py
          xcodegen generate
          swift format lint --recursive MacVitals MacVitalsTests MacVitalsUITests

      - name: Run native arm64 tests
        shell: bash
        run: >-
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals
          -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests

      - name: Build and verify exact unsigned candidate
        id: package
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.identity.outputs.build_number }}
          CODE_SIGNING_ALLOWED: NO
        run: bash scripts/package_release.sh "${CANDIDATE_VERSION}"

      - name: Collect physical and local-only Instruments evidence
        id: physical
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f physical-validation-run.raw.log physical-validation-run.log
          set +e
          bash scripts/run_ci_physical_validation.sh \
            "${CANDIDATE_VERSION}" \
            build/MacVitals.xcarchive/Products/Applications/MacVitals.app \
            "${CANDIDATE_SHA}" \
            > physical-validation-run.raw.log 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "Physical collection exit status: ${status}"

      - name: Sanitize and authorize evidence upload
        id: privacy
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          REDACT_HOME="${HOME:-}" REDACT_USER="$(id -un 2>/dev/null || true)" REDACT_HOST="$(hostname 2>/dev/null || true)" python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import re

          raw_log = Path("physical-validation-run.raw.log")
          safe_log = Path("physical-validation-run.log")
          evidence_root = Path("physical-validation-results")
          ready = Path("physical-evidence-upload-ready.txt")
          ready.unlink(missing_ok=True)
          home = os.environ.get("REDACT_HOME", "")
          user = os.environ.get("REDACT_USER", "")
          host = os.environ.get("REDACT_HOST", "")
          replacements = [(home, "<HOME>"), (host, "<HOST>")]
          if len(user) >= 3:
              replacements.append((user, "<USER>"))
          path_pattern = re.compile(r"/(?:Users|home)/[^/\s<]+")
          temp_pattern = re.compile(r"/private/tmp/macvitals-instruments\.[^/\s<]+")
          battery_id_pattern = re.compile(r"\bInternalBattery-\d+(?:\s+\(id=\d+\))?")

          def sanitize(text: str) -> str:
              text = path_pattern.sub("<HOME>", text)
              text = temp_pattern.sub("<TRACE_WORKSPACE>", text)
              text = battery_id_pattern.sub("<BATTERY_ID>", text)
              for value, replacement in replacements:
                  if value:
                      text = text.replace(value, replacement)
              return text

          def verify_clean(text: str, source: Path) -> None:
              forbidden = [value for value, _ in replacements if value]
              forbidden.append("InternalBattery-")
              for value in forbidden:
                  if value and value in text:
                      raise SystemExit(f"Privacy scan failed for {source.name}")
              if path_pattern.search(text) or temp_pattern.search(text):
                  raise SystemExit(f"Path privacy scan failed for {source.name}")

          raw_text = "Physical collection log was not created.\n"
          if raw_log.exists():
              if raw_log.is_symlink() or not raw_log.is_file() or raw_log.stat().st_nlink != 1:
                  raise SystemExit("Raw physical log is unsafe")
              if raw_log.stat().st_size > 20 * 1024 * 1024:
                  raise SystemExit("Raw physical log exceeds the 20 MiB limit")
              raw_bytes = raw_log.read_bytes()
              if b"\x00" in raw_bytes:
                  raise SystemExit("Raw physical log is unexpectedly binary")
              raw_text = raw_bytes.decode("utf-8", errors="strict")
          safe_text = sanitize(raw_text)
          verify_clean(safe_text, raw_log)
          safe_log.write_text(safe_text, encoding="utf-8")
          raw_log.unlink(missing_ok=True)

          total_size = 0
          if evidence_root.exists():
              if evidence_root.is_symlink() or not evidence_root.is_dir():
                  raise SystemExit("Physical evidence root is unsafe")
              for path in sorted(evidence_root.rglob("*")):
                  if path.is_symlink():
                      raise SystemExit(f"Symlink is forbidden in physical evidence: {path.name}")
                  if path.is_dir():
                      continue
                  if not path.is_file() or path.stat().st_nlink != 1:
                      raise SystemExit(f"Unsafe physical evidence entry: {path.name}")
                  total_size += path.stat().st_size
                  if total_size > 100 * 1024 * 1024:
                      raise SystemExit("Physical evidence exceeds the 100 MiB upload limit")
                  payload = path.read_bytes()
                  if b"\x00" in payload:
                      raise SystemExit(f"Binary evidence is forbidden from upload: {path.name}")
                  text = sanitize(payload.decode("utf-8", errors="strict"))
                  verify_clean(text, path)
                  path.write_text(text, encoding="utf-8")
          ready.write_text("privacy-scan=passed\n", encoding="utf-8")
          PYCODE
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          tail -n 200 physical-validation-run.log

      - name: Add conservative job summary
        if: always()
        shell: bash
        env:
          PHYSICAL_STATUS: ${{ steps.physical.outputs.status }}
          PRIVACY_READY: ${{ steps.privacy.outputs.ready }}
        run: |
          {
            echo "## Physical Apple Silicon validation"
            echo
            echo "- Exact commit: \`${CANDIDATE_SHA}\`"
            echo "- Architecture: \`$(uname -m)\`"
            echo "- Runner labels: \`self-hosted\`, \`macOS\`, \`ARM64\`"
            echo "- Physical collector exit: \`${PHYSICAL_STATUS:-not-run}\`"
            echo "- Evidence privacy gate: \`${PRIVACY_READY:-failed-or-not-run}\`"
            echo "- No manual or independent gate is auto-approved."
            echo "- Raw Instruments traces remain local on the runner."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload redacted physical evidence
        id: evidence_upload
        if: always() && steps.privacy.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-apple-silicon-${{ steps.identity.outputs.short_sha }}
          path: |
            physical-validation-run.log
            physical-evidence-upload-ready.txt
            physical-validation-results/
            dist/BUILD_STATUS.txt
            dist/BUILD_MANIFEST.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact tested unsigned candidate
        if: >-
          always() &&
          steps.package.outcome == 'success' &&
          steps.identity.outputs.version != '' &&
          hashFiles('dist/BUILD_MANIFEST.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacVitals-${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.short_sha }}-arm64-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Clean generated workspace data
        if: always()
        shell: bash
        run: |
          rm -rf build dist physical-validation-results physical-validation-apps staged-physical-artifacts MacVitals.xcodeproj MacVitals/Resources/AppIcon.icns
          rm -f physical-validation-run.raw.log physical-validation-run.log physical-evidence-upload-ready.txt
          git clean -ffdX || true

      - name: Enforce physical and privacy results
        if: always()
        shell: bash
        env:
          PHYSICAL_STATUS: ${{ steps.physical.outputs.status }}
          PRIVACY_READY: ${{ steps.privacy.outputs.ready }}
        run: |
          set -Eeuo pipefail
          [[ "${PRIVACY_READY:-}" == "true" ]] || {
            echo "Physical evidence privacy gate did not pass" >&2
            exit 1
          }
          [[ "${PHYSICAL_STATUS:-}" =~ ^[0-9]+$ ]] || {
            echo "Physical collector did not produce a valid exit status" >&2
            exit 1
          }
          if [[ "${PHYSICAL_STATUS}" -ne 0 ]]; then
            echo "Physical collector failed with exit ${PHYSICAL_STATUS}; sanitized evidence was retained" >&2
            exit "${PHYSICAL_STATUS}"
          fi
