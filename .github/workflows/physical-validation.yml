name: Physical Legacy Queue Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-apple-silicon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  superseded-physical-path:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate physical tooling
        run: |
          python3 -m py_compile scripts/run_physical_validation_hardened.py scripts/run_physical_validation_guided_hardened.py
          bash -n scripts/run_ci_physical_validation_hardened.sh
          bash scripts/run_ci_physical_validation_hardened.sh --self-test
