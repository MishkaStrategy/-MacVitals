name: Inspect Notch Lifecycle

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/physical-test-notch-indicator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true
      - name: Print application lifecycle sources
        shell: bash
        run: |
          set -euo pipefail
          echo '=== lifecycle files ==='
          find MacVitals -type f -name '*.swift' -print | sort | grep -E 'App|Lifecycle|StatusItem' || true
          echo '=== StatusItemController references ==='
          grep -R -n --include='*.swift' 'StatusItemController' MacVitals || true
          echo '=== AppDelegate ==='
          find MacVitals -type f -name '*AppDelegate*.swift' -exec sh -c 'echo ---$1; sed -n "1,260p" "$1"' _ {} \;
          echo '=== app entry ==='
          find MacVitals -type f \( -name '*App.swift' -o -name '*Application.swift' \) -exec sh -c 'echo ---$1; sed -n "1,260p" "$1"' _ {} \;
