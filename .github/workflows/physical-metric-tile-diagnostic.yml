name: Physical Metric Tile Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-metric-tile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metric-tile-diagnostic:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.event.pull_request.head.ref == 'bugfix/metric-card-crash-diagnostic'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Register runner privacy masks
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace_parent="$(dirname "${GITHUB_WORKSPACE}")"
          for value in "${HOME:-}" "${USER:-}" "$(id -un)" "$(hostname)" "${RUNNER_NAME:-}" "${GITHUB_WORKSPACE}" "${workspace_parent}"; do
            if [[ -n "${value}" && ${#value} -ge 3 ]]; then echo "::add-mask::${value}"; fi
          done

      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify native Apple Silicon runner
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]]
          [[ "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]]
          build_number=$((800000 + 10#${GITHUB_RUN_NUMBER}))
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          echo "CANDIDATE_VERSION=0.0.${build_number}" >> "${GITHUB_ENV}"

      - name: Resolve preinstalled developer tools
        shell: bash
        run: |
          set -Eeuo pipefail
          developer_dir="$(xcode-select -p)"
          [[ -x "${developer_dir}/usr/bin/xcodebuild" ]] || { echo "Full Xcode is unavailable" >&2; exit 1; }
          echo "DEVELOPER_DIR=${developer_dir}" >> "${GITHUB_ENV}"
          swift_path="$(DEVELOPER_DIR="${developer_dir}" xcrun --find swift)"
          echo "$(dirname "${swift_path}")" >> "${GITHUB_PATH}"
          for candidate in "$(command -v xcodegen 2>/dev/null || true)" /opt/homebrew/bin/xcodegen /usr/local/bin/xcodegen; do
            if [[ -n "${candidate}" && -x "${candidate}" ]]; then
              echo "$(dirname "${candidate}")" >> "${GITHUB_PATH}"
              exit 0
            fi
          done
          echo "xcodegen is unavailable" >&2
          exit 1

      - name: Build exact unsigned diagnostic candidate
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.identity.outputs.build_number }}
          CODE_SIGNING_ALLOWED: NO
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/diagnose_app_lifetime.py
          python3 scripts/diagnose_app_lifetime.py --self-test
          python3 scripts/materialize_app_icon.py
          python3 scripts/validate_localizations.py
          xcodegen generate
          swift format lint --recursive MacVitals MacVitalsFanHelper MacVitalsFanProbe MacVitalsTests MacVitalsUITests
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO test -only-testing:MacVitalsTests
          bash scripts/package_release.sh "${CANDIDATE_VERSION}"
          [[ "$(lipo -archs build/MacVitals.xcarchive/Products/Applications/MacVitals.app/Contents/MacOS/MacVitals)" == "arm64" ]]

      - name: Run manual metric tile diagnostic
        id: diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- metric-tile-evidence metric-tile-run.log
          echo "MacVitals will now remain open for 15 minutes without XCTest or UI automation."
          echo "Open CPU, Memory, GPU and Battery tiles and leave each detail window open for at least 10 seconds."
          shim_root="$(mktemp -d /private/tmp/macvitals-metric-tile-launchctl.XXXXXX)"
          trap 'rm -rf "${shim_root}"' EXIT
          cat > "${shim_root}/launchctl" <<'SHIM'
          #!/bin/bash
          set -Eeuo pipefail
          if [[ "${1:-}" == "asuser" ]]; then
            [[ $# -ge 3 ]] || { echo "launchctl asuser shim requires UID and command" >&2; exit 64; }
            requested_uid="$2"
            shift 2
            [[ "${requested_uid}" == "$(id -u)" ]] || { echo "launchctl asuser shim refuses a foreign UID" >&2; exit 77; }
            exec "$@"
          fi
          exec /bin/launchctl "$@"
          SHIM
          chmod 700 "${shim_root}/launchctl"
          set +e
          PATH="${shim_root}:${PATH}" launchctl asuser "$(id -u)" caffeinate -ims \
            python3 scripts/diagnose_app_lifetime.py \
              --repository "${PWD}" \
              --app build/MacVitals.xcarchive/Products/Applications/MacVitals.app \
              --duration 900 \
              --interval 1 \
              --output metric-tile-evidence \
              > metric-tile-run.log 2>&1
          status=$?
          set -e
          cat metric-tile-run.log
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Upload metric tile crash evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metric-tile-${{ env.CANDIDATE_SHA }}
          path: |
            metric-tile-evidence/
            metric-tile-run.log
          if-no-files-found: error

      - name: Enforce manual metric tile result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ steps.diagnostic.outputs.status }}" == "0" ]] || {
            echo "MacVitals exited before the 15-minute manual metric tile diagnostic completed" >&2
            exit 1
          }
