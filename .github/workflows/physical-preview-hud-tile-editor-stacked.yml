name: Physical Preview HUD Tile Editor Stacked

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-preview-hud-tile-editor
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-preview-hud-tile-editor'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      ARTIFACT_ID: '8832785557'
      ARTIFACT_SHA256: 29a18647946cded72104a8af3dcacc28f6cdc796d084b837ea95efe296ae5572
      FEATURE_HEAD_SHA: 54e7cbfc8fcaf9a6ea81d13b347543ec1e375436

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Materialize safe CoreGraphics capture script
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/physical-preview-hud-tile-editor.yml').read_text(encoding='utf-8').splitlines()
          capture_step = next(i for i, line in enumerate(source) if line.strip() == '- name: Capture exact physical preview')
          run_line = next(i for i in range(capture_step + 1, len(source)) if source[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].strip() == '- name: Upload physical preview')
          body = []
          for line in source[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(body) + '\n'

          helper = r'''cat > preview-tools/CaptureWindow.swift <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          guard CommandLine.arguments.count == 3,
                let rawID = UInt32(CommandLine.arguments[1]) else { exit(2) }
          let output = URL(fileURLWithPath: CommandLine.arguments[2])
          guard let image = CGWindowListCreateImage(
            .null,
            .optionIncludingWindow,
            CGWindowID(rawID),
            [.boundsIgnoreFraming, .bestResolution]) else { exit(3) }
          let representation = NSBitmapImageRep(cgImage: image)
          guard let data = representation.representation(using: .png, properties: [:]) else { exit(4) }
          try data.write(to: output, options: .atomic)
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 -framework AppKit -framework CoreGraphics \
            preview-tools/CaptureWindow.swift -o preview-tools/capture-window
          '''
          marker = '"${executable}" -experimentalNotchHUDEnabled YES -ApplePersistenceIgnoreState YES'
          if marker not in script:
              raise SystemExit('application launch marker not found')
          script = script.replace(marker, helper + '\n' + marker, 1)
          script = script.replace('/usr/sbin/screencapture -x -l "${settings}" preview-evidence/hud-tile-editor.png', 'preview-tools/capture-window "${settings}" preview-evidence/hud-tile-editor.png')
          script = script.replace('/usr/sbin/screencapture -x -l "${hud1}" preview-evidence/hud-panel-1.png', 'preview-tools/capture-window "${hud1}" preview-evidence/hud-panel-1.png')
          script = script.replace('/usr/sbin/screencapture -x -l "${hud2}" preview-evidence/hud-panel-2.png', 'preview-tools/capture-window "${hud2}" preview-evidence/hud-panel-2.png')

          original_guard = '''existing="$(pgrep -x MacVitals || true)"
          if [[ -n "${existing}" ]]; then
            echo "A MacVitals process is already running; refusing to disturb the user's instance: ${existing}" >&2
            exit 1
          fi'''
          safe_guard = r'''existing="$(pgrep -x MacVitals || true)"
          user_processes=""
          for existing_pid in ${existing}; do
            existing_command="$(ps -p "${existing_pid}" -o command= 2>/dev/null || true)"
            if [[ "${existing_command}" == *"GitHubActionsRunners/"*"/preview-app/MacVitals.app/Contents/MacOS/MacVitals"* ]]; then
              echo "Cleaning orphaned preview process ${existing_pid}"
              kill -TERM "${existing_pid}" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "${existing_pid}" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL "${existing_pid}" 2>/dev/null || true
            else
              user_processes="${user_processes} ${existing_pid}"
            fi
          done
          if [[ -n "${user_processes// /}" ]]; then
            echo "A non-preview MacVitals process is running; refusing to disturb it:${user_processes}" >&2
            exit 1
          fi'''
          if original_guard not in script:
              raise SystemExit('existing-process guard not found')
          script = script.replace(original_guard, safe_guard, 1)
          Path('/tmp/run-physical-hud-preview.sh').write_text(script, encoding='utf-8')
          PY
          bash -n /tmp/run-physical-hud-preview.sh

      - name: Capture exact physical preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash /tmp/run-physical-hud-preview.sh

      - name: Upload physical preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-preview-hud-tile-editor
          path: preview-evidence/
          if-no-files-found: error
          retention-days: 30
