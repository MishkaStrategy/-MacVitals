name: Physical Preview HUD Tile Editor Stacked

on:
  pull_request:
    branches: [agent/hud-tile-editor]
    types: [opened, synchronize, reopened]

concurrency:
  group: physical-preview-hud-tile-editor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'mishkacher' &&
      github.actor == 'mishkacher' &&
      github.event.pull_request.head.ref == 'agent/physical-preview-hud-tile-editor'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    env:
      FEATURE_HEAD_SHA: 54e7cbfc8fcaf9a6ea81d13b347543ec1e375436

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true

      - name: Build and capture physical HUD editor
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(uname -s)" == Darwin ]]
          [[ "$(uname -m)" == arm64 ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null

          rm -rf preview-derived preview-evidence preview-tools
          mkdir -p preview-evidence preview-tools

          python3 - <<'PY'
          from pathlib import Path

          status_path = Path('MacVitals/MenuBar/StatusItemController.swift')
          status = status_path.read_text(encoding='utf-8')
          status_needle = '''      .store(in: &cancellables)
            }

            @objc private func togglePopover()'''
          status_replacement = '''      .store(in: &cancellables)

              if ProcessInfo.processInfo.environment["MACVITALS_PHYSICAL_PREVIEW_HUD_EDITOR"] == "1" {
                DispatchQueue.main.asyncAfter(deadline: .now() + 1) { [weak self] in
                  self?.openNotchHUDSettings()
                }
              }
            }

            @objc private func togglePopover()'''
          if status_needle not in status:
              raise SystemExit('StatusItemController preview insertion point not found')
          status_path.write_text(status.replace(status_needle, status_replacement, 1), encoding='utf-8')

          settings_path = Path('MacVitals/UI/Preferences/NotchHUDSettingsView.swift')
          settings = settings_path.read_text(encoding='utf-8')
          settings_needle = '''  func present() {
              showWindow(nil)
              window?.makeKeyAndOrderFront(nil)
              NSApp.activate(ignoringOtherApps: true)
            }'''
          settings_replacement = '''  func present() {
              showWindow(nil)
              window?.makeKeyAndOrderFront(nil)
              NSApp.activate(ignoringOtherApps: true)

              guard let outputPath = ProcessInfo.processInfo.environment["MACVITALS_PHYSICAL_PREVIEW_OUTPUT"] else {
                return
              }
              DispatchQueue.main.asyncAfter(deadline: .now() + 2) { [weak self] in
                guard let view = self?.window?.contentView else { return }
                let bounds = view.bounds
                guard !bounds.isEmpty,
                  let representation = view.bitmapImageRepForCachingDisplay(in: bounds)
                else { return }
                view.cacheDisplay(in: bounds, to: representation)
                guard let data = representation.representation(using: .png, properties: [:]) else {
                  return
                }
                try? data.write(
                  to: URL(fileURLWithPath: outputPath),
                  options: .atomic)
              }
            }'''
          if settings_needle not in settings:
              raise SystemExit('HUD settings preview insertion point not found')
          settings_path.write_text(settings.replace(settings_needle, settings_replacement, 1), encoding='utf-8')
          PY

          python3 scripts/materialize_app_icon.py
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

          set +e
          xcodebuild -project MacVitals.xcodeproj -scheme MacVitals \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "${PWD}/preview-derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            clean build > preview-evidence/build.log 2>&1
          build_status=$?
          set -e
          if [[ ${build_status} -ne 0 ]]; then
            tail -n 300 preview-evidence/build.log
            exit ${build_status}
          fi

          app="${PWD}/preview-derived/Build/Products/Debug/MacVitals.app"
          executable="${app}/Contents/MacOS/MacVitals"
          [[ -x "${executable}" ]]
          [[ "$(lipo -archs "${executable}")" == arm64 ]]

          cat > preview-tools/WindowTools.swift <<'SWIFT'
          import AppKit
          import CoreGraphics
          import Foundation

          guard CommandLine.arguments.count >= 3 else { exit(2) }
          let command = CommandLine.arguments[1]
          guard let targetPID = Int32(CommandLine.arguments[2]) else { exit(2) }
          let raw = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          var windows: [[String: Any]] = []
          for info in raw {
            guard (info[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value == targetPID,
                  let number = (info[kCGWindowNumber as String] as? NSNumber)?.uint32Value,
                  let bounds = info[kCGWindowBounds as String] as? [String: Any],
                  let width = (bounds["Width"] as? NSNumber)?.doubleValue,
                  let height = (bounds["Height"] as? NSNumber)?.doubleValue else { continue }
            windows.append([
              "id": number,
              "name": info[kCGWindowName as String] as? String ?? "",
              "width": width,
              "height": height,
              "layer": (info[kCGWindowLayer as String] as? NSNumber)?.intValue ?? -1,
            ])
          }

          if command == "list" {
            let data = try JSONSerialization.data(withJSONObject: windows, options: [.prettyPrinted, .sortedKeys])
            FileHandle.standardOutput.write(data)
            exit(0)
          }

          guard command == "capture", CommandLine.arguments.count == 5,
                let rawID = UInt32(CommandLine.arguments[3]) else { exit(2) }
          let output = URL(fileURLWithPath: CommandLine.arguments[4])
          guard let image = CGWindowListCreateImage(
            .null,
            .optionIncludingWindow,
            CGWindowID(rawID),
            [.boundsIgnoreFraming, .bestResolution]) else { exit(3) }
          let representation = NSBitmapImageRep(cgImage: image)
          guard let data = representation.representation(using: .png, properties: [:]) else { exit(4) }
          try data.write(to: output, options: .atomic)
          SWIFT
          xcrun swiftc -O -target arm64-apple-macos13.0 \
            -framework AppKit -framework CoreGraphics \
            preview-tools/WindowTools.swift -o preview-tools/window-tools

          cleanup() {
            set +e
            if [[ -n "${app_pid:-}" ]]; then
              kill -TERM "${app_pid}" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "${app_pid}" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL "${app_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          output="${PWD}/preview-evidence/hud-tile-editor.png"
          MACVITALS_PHYSICAL_PREVIEW_HUD_EDITOR=1 \
          MACVITALS_PHYSICAL_PREVIEW_OUTPUT="${output}" \
          "${executable}" \
            -experimentalNotchHUDEnabled YES \
            -ApplePersistenceIgnoreState YES \
            > preview-evidence/app.stdout.log \
            2> preview-evidence/app.stderr.log &
          app_pid=$!

          for _ in {1..150}; do
            kill -0 "${app_pid}" 2>/dev/null || {
              echo 'MacVitals exited before creating the preview' >&2
              cat preview-evidence/app.stderr.log >&2 || true
              exit 1
            }
            [[ -s "${output}" ]] && break
            sleep 0.2
          done
          [[ -s "${output}" ]]
          /usr/bin/sips -Z 1800 "${output}" >/dev/null
          /usr/bin/sips -g pixelWidth -g pixelHeight "${output}" \
            > preview-evidence/image-dimensions.txt

          preview-tools/window-tools list "${app_pid}" > preview-evidence/windows.json
          WINDOWS_JSON="preview-evidence/windows.json" python3 - <<'PY' > preview-evidence/hud-window-ids.txt
          import json, os
          windows = json.load(open(os.environ['WINDOWS_JSON'], encoding='utf-8'))
          hud = [w for w in windows if 20 <= w['height'] <= 60 and w['width'] >= 70]
          hud.sort(key=lambda w: w['width'], reverse=True)
          for index, window in enumerate(hud[:2], 1):
              print(f"hud{index}={window['id']}")
          PY
          source preview-evidence/hud-window-ids.txt || true
          if [[ -n "${hud1:-}" ]]; then
            preview-tools/window-tools capture "${app_pid}" "${hud1}" \
              preview-evidence/hud-panel-1.png || rm -f preview-evidence/hud-panel-1.png
          fi
          if [[ -n "${hud2:-}" ]]; then
            preview-tools/window-tools capture "${app_pid}" "${hud2}" \
              preview-evidence/hud-panel-2.png || rm -f preview-evidence/hud-panel-2.png
          fi

          FEATURE_HEAD_SHA="${FEATURE_HEAD_SHA}" APP_PID="${app_pid}" python3 - <<'PY' \
            > preview-evidence/preview-metadata.json
          import json, os
          print(json.dumps({
            'featureHead': os.environ['FEATURE_HEAD_SHA'],
            'processPID': int(os.environ['APP_PID']),
            'sourceUI': 'PR 37 exact source',
            'previewOnlyRuntimeHook': True,
            'captureScope': 'MacVitals content view and own windows only',
            'desktopCaptured': False,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload physical preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-preview-hud-tile-editor
          path: preview-evidence/
          if-no-files-found: error
          retention-days: 30
