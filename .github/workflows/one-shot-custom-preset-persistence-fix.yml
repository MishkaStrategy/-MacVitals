name: Apply Custom Preset Persistence Fix

on:
  push:
    branches: [feature/historical-consumption-leaders-preview]
    paths:
      - .github/workflows/one-shot-custom-preset-persistence-fix.yml

permissions:
  contents: write

concurrency:
  group: one-shot-custom-preset-persistence-fix
  cancel-in-progress: true

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Patch custom preset persistence and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          workdir="${RUNNER_TEMP}/macvitals-custom-preset-fix"
          rm -rf -- "${workdir}"
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${workdir}"
          cd "${workdir}"

          python3 - <<'PY'
          from pathlib import Path

          settings_path = Path("MacVitals/Persistence/SettingsStore.swift")
          tests_path = Path("MacVitalsTests/MenuLayoutRulesTests.swift")
          workflow_path = Path(".github/workflows/one-shot-custom-preset-persistence-fix.yml")

          settings = settings_path.read_text()

          enum_anchor = "nonisolated enum MenuConfigurationPersistence {\n"
          enum_insert = (
              "nonisolated enum MenuPresetApplication {\n"
              "  static func metrics(\n"
              "    for preset: MenuPreset,\n"
              "    customMetrics: [MenuMetric]\n"
              "  ) -> [MenuMetric] {\n"
              "    preset == .custom\n"
              "      ? MenuLayoutRules.normalized(customMetrics)\n"
              "      : preset.metrics\n"
              "  }\n\n"
              "  static func initialCustomMetrics(\n"
              "    storedCustomMetrics: [MenuMetric]?,\n"
              "    storedPreset: MenuPreset,\n"
              "    resolvedPreset: MenuPreset,\n"
              "    activeMetrics: [MenuMetric]\n"
              "  ) -> [MenuMetric] {\n"
              "    let normalizedActive = MenuLayoutRules.normalized(activeMetrics)\n"
              "    if resolvedPreset == .custom, storedPreset != .custom {\n"
              "      return normalizedActive\n"
              "    }\n"
              "    return MenuLayoutRules.normalized(storedCustomMetrics ?? normalizedActive)\n"
              "  }\n"
              "}\n\n"
          )
          if settings.count(enum_anchor) != 1:
              raise SystemExit("MenuConfigurationPersistence anchor not found exactly once")
          settings = settings.replace(enum_anchor, enum_insert + enum_anchor, 1)

          storage_anchor = "  private let launchAtLoginManager: any LaunchAtLoginManaging\n"
          storage_insert = (
              "  private let launchAtLoginManager: any LaunchAtLoginManaging\n"
              "  private var customMetrics: [MenuMetric] = []\n"
              "  private var hasSavedCustomMetrics = false\n"
          )
          if settings.count(storage_anchor) != 1:
              raise SystemExit("launchAtLoginManager anchor not found exactly once")
          settings = settings.replace(storage_anchor, storage_insert, 1)

          old_init = (
              "    let storedConfigurationData = defaults.data(forKey: Keys.menuConfiguration)\n"
              "    let storedMetrics: [MenuMetric]? =\n"
              "      storedConfigurationData.flatMap { MenuConfigurationPersistence.decode($0) }\n"
              "    let initialMetrics =\n"
              "      storedMetrics\n"
              "      ?? (storedPreset == .custom ? MenuPreset.performance.metrics : storedPreset.metrics)\n"
              "    let initialPreset = MenuPresetResolution.resolve(\n"
              "      storedPreset: storedPreset,\n"
              "      metrics: initialMetrics,\n"
              "      preserveExplicitCustom: storedMetrics != nil)\n\n"
              "    selectedPreset = initialPreset\n"
              "    enabledMetrics = initialMetrics\n"
          )
          new_init = (
              "    let storedConfigurationData = defaults.data(forKey: Keys.menuConfiguration)\n"
              "    let storedMetrics: [MenuMetric]? =\n"
              "      storedConfigurationData.flatMap { MenuConfigurationPersistence.decode($0) }\n"
              "    let initialActiveMetrics =\n"
              "      storedMetrics\n"
              "      ?? (storedPreset == .custom ? MenuPreset.performance.metrics : storedPreset.metrics)\n"
              "    let initialPreset = MenuPresetResolution.resolve(\n"
              "      storedPreset: storedPreset,\n"
              "      metrics: initialActiveMetrics,\n"
              "      preserveExplicitCustom: storedMetrics != nil)\n\n"
              "    let storedCustomMetrics = defaults.data(forKey: Keys.customMenuConfiguration)\n"
              "      .flatMap { MenuConfigurationPersistence.decode($0) }\n"
              "    let resolvedCustomMetrics = MenuPresetApplication.initialCustomMetrics(\n"
              "      storedCustomMetrics: storedCustomMetrics,\n"
              "      storedPreset: storedPreset,\n"
              "      resolvedPreset: initialPreset,\n"
              "      activeMetrics: initialActiveMetrics)\n"
              "    let shouldPersistCustomRecovery =\n"
              "      initialPreset == .custom\n"
              "      && storedCustomMetrics != Optional(resolvedCustomMetrics)\n\n"
              "    customMetrics = resolvedCustomMetrics\n"
              "    hasSavedCustomMetrics = storedCustomMetrics != nil || initialPreset == .custom\n"
              "    selectedPreset = initialPreset\n"
              "    enabledMetrics =\n"
              "      initialPreset == .custom ? resolvedCustomMetrics : initialActiveMetrics\n\n"
              "    if shouldPersistCustomRecovery,\n"
              "      let data = MenuConfigurationPersistence.encode(resolvedCustomMetrics)\n"
              "    {\n"
              "      defaults.set(data, forKey: Keys.customMenuConfiguration)\n"
              "    }\n"
          )
          if settings.count(old_init) != 1:
              raise SystemExit("SettingsStore init persistence block not found exactly once")
          settings = settings.replace(old_init, new_init, 1)

          old_apply = (
              "  func applyPreset(_ preset: MenuPreset) {\n"
              "    guard preset != .custom else { return }\n"
              "    enabledMetrics = preset.metrics\n"
              "  }\n"
          )
          new_apply = (
              "  func applyPreset(_ preset: MenuPreset) {\n"
              "    if preset == .custom {\n"
              "      if !hasSavedCustomMetrics {\n"
              "        saveCustomMetrics(enabledMetrics)\n"
              "      }\n"
              "      enabledMetrics = MenuPresetApplication.metrics(\n"
              "        for: preset,\n"
              "        customMetrics: customMetrics)\n"
              "      return\n"
              "    }\n"
              "    enabledMetrics = preset.metrics\n"
              "  }\n"
          )
          if settings.count(old_apply) != 1:
              raise SystemExit("applyPreset block not found exactly once")
          settings = settings.replace(old_apply, new_apply, 1)

          old_set = (
              "  func setMetric(_ metric: MenuMetric, enabled: Bool) {\n"
              "    enabledMetrics = MenuLayoutRules.setting(metric, enabled: enabled, in: enabledMetrics)\n"
              "    selectedPreset = .custom\n"
              "  }\n"
          )
          new_set = (
              "  func setMetric(_ metric: MenuMetric, enabled: Bool) {\n"
              "    let updated = MenuLayoutRules.setting(\n"
              "      metric,\n"
              "      enabled: enabled,\n"
              "      in: enabledMetrics)\n"
              "    saveCustomMetrics(updated)\n"
              "    selectedPreset = .custom\n"
              "  }\n"
          )
          if settings.count(old_set) != 1:
              raise SystemExit("setMetric block not found exactly once")
          settings = settings.replace(old_set, new_set, 1)

          old_move = (
              "  func move(from source: IndexSet, to destination: Int) {\n"
              "    enabledMetrics.move(fromOffsets: source, toOffset: destination)\n"
              "    enabledMetrics = MenuLayoutRules.normalized(enabledMetrics)\n"
              "    selectedPreset = .custom\n"
              "  }\n"
          )
          new_move = (
              "  func move(from source: IndexSet, to destination: Int) {\n"
              "    var updated = enabledMetrics\n"
              "    updated.move(fromOffsets: source, toOffset: destination)\n"
              "    saveCustomMetrics(updated)\n"
              "    selectedPreset = .custom\n"
              "  }\n"
          )
          if settings.count(old_move) != 1:
              raise SystemExit("move block not found exactly once")
          settings = settings.replace(old_move, new_move, 1)

          persist_anchor = "  private func persistMenuConfiguration() {\n"
          persist_insert = (
              "  private func saveCustomMetrics(_ metrics: [MenuMetric]) {\n"
              "    customMetrics = MenuLayoutRules.normalized(metrics)\n"
              "    hasSavedCustomMetrics = true\n"
              "    if let data = MenuConfigurationPersistence.encode(customMetrics) {\n"
              "      UserDefaults.standard.set(data, forKey: Keys.customMenuConfiguration)\n"
              "    }\n"
              "  }\n\n"
          )
          if settings.count(persist_anchor) != 1:
              raise SystemExit("persistMenuConfiguration anchor not found exactly once")
          settings = settings.replace(persist_anchor, persist_insert + persist_anchor, 1)

          key_anchor = '    static let menuConfiguration = "menuConfiguration.v1"\n'
          key_replace = key_anchor + '    static let customMenuConfiguration = "customMenuConfiguration.v1"\n'
          if settings.count(key_anchor) != 1:
              raise SystemExit("menuConfiguration key anchor not found exactly once")
          settings = settings.replace(key_anchor, key_replace, 1)
          settings_path.write_text(settings)

          tests = tests_path.read_text()
          tests_anchor = "  func testMenuConfigurationRoundTripNormalizesMetrics() throws {\n"
          tests_insert = (
              "  func testCustomPresetRestoresItsSavedLayout() {\n"
              "    let custom: [MenuMetric] = [.battery, .cpu, .temperature]\n"
              "    XCTAssertEqual(\n"
              "      MenuPresetApplication.metrics(for: .custom, customMetrics: custom),\n"
              "      custom)\n"
              "  }\n\n"
              "  func testNamedPresetDoesNotOverwriteSavedCustomLayout() {\n"
              "    let custom: [MenuMetric] = [.battery, .cpu]\n"
              "    XCTAssertEqual(\n"
              "      MenuPresetApplication.metrics(for: .power, customMetrics: custom),\n"
              "      MenuPreset.power.metrics)\n"
              "    XCTAssertEqual(\n"
              "      MenuPresetApplication.metrics(for: .custom, customMetrics: custom),\n"
              "      custom)\n"
              "  }\n\n"
              "  func testInterruptedCustomSelectionPromotesActiveLayout() {\n"
              "    let active: [MenuMetric] = [.memory, .battery, .cpu]\n"
              "    XCTAssertEqual(\n"
              "      MenuPresetApplication.initialCustomMetrics(\n"
              "        storedCustomMetrics: [.cpu],\n"
              "        storedPreset: .performance,\n"
              "        resolvedPreset: .custom,\n"
              "        activeMetrics: active),\n"
              "      active)\n"
              "  }\n\n"
              "  func testExplicitCustomPresetUsesStoredCustomLayout() {\n"
              "    let saved: [MenuMetric] = [.temperature, .fans, .battery]\n"
              "    XCTAssertEqual(\n"
              "      MenuPresetApplication.initialCustomMetrics(\n"
              "        storedCustomMetrics: saved,\n"
              "        storedPreset: .custom,\n"
              "        resolvedPreset: .custom,\n"
              "        activeMetrics: MenuPreset.performance.metrics),\n"
              "      saved)\n"
              "  }\n\n"
          )
          if tests.count(tests_anchor) != 1:
              raise SystemExit("MenuLayoutRulesTests insertion anchor not found exactly once")
          tests = tests.replace(tests_anchor, tests_insert + tests_anchor, 1)
          tests_path.write_text(tests)

          workflow_path.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            MacVitals/Persistence/SettingsStore.swift \
            MacVitalsTests/MenuLayoutRulesTests.swift \
            .github/workflows/one-shot-custom-preset-persistence-fix.yml
          git commit -m "fix: persist and restore custom menu preset"
          git push origin "HEAD:${GITHUB_REF_NAME}"
