name: History Archive Benchmark PR

on:
  pull_request:
    branches:
      - integration/network-history-leaders-post-notch
    paths:
      - .github/workflows/history-archive-benchmark-pr.yml
      - MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-archive-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mature-seven-day-baseline:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    concurrency:
      group: macvitals-physical-runtime
      cancel-in-progress: false
      queue: max
    env:
      PRODUCT_BASE_SHA: 27acea6376230672ddaedce3c8098c52c0a75735
      BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BENCHMARK_OUTPUT: ${{ github.workspace }}/history-benchmark/history-archive-baseline.json
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-HistoryBenchmark
      BENCHMARK_CONFIG: ${{ github.workspace }}/.macvitals-history-benchmark.json
    steps:
      - name: Checkout exact benchmark head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact product ancestry and benchmark-only scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PRODUCT_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BENCHMARK_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${BENCHMARK_SHA}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor \
            4d143aaa082b0fb15ce86d19ba72c40557939692 \
            "${BENCHMARK_SHA}"
          git merge-base --is-ancestor "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}"
          git diff --quiet "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}" -- \
            MacVitals MacVitalsUITests project.yml
          git diff --name-only "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}" > benchmark-changes.txt
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              ".github/workflows/history-archive-benchmark-pr.yml",
              "MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift",
          }
          actual = {
              line.strip()
              for line in Path("benchmark-changes.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          if actual != expected:
              raise SystemExit(
                  f"benchmark branch contains unexpected changes: expected={sorted(expected)} actual={sorted(actual)}"
              )
          PY
          ! git grep -nE 'Pet|petState|PetView' -- MacVitals
          {
            printf 'product_base_sha=%s\n' "${PRODUCT_BASE_SHA}"
            printf 'benchmark_sha=%s\n' "${BENCHMARK_SHA}"
          } > benchmark-source.txt

      - name: Validate workflow and benchmark source
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/history-archive-benchmark-pr.yml')"
          grep -Fq 'benchmarkConfiguration()' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq '.macvitals-history-benchmark.json' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'HistoricalConsumptionRange.sevenDays' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'processLifetimePeakRSS' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'peakRSSCalibration()' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'currentResidentKiBAtCalibration' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'ruMaxRSSScaleToBytes' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build benchmark tests
        shell: bash
        run: |
          set +e
          rm -rf -- "${DERIVED_DATA}"
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            > history-benchmark-build.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)' \
            history-benchmark-build.log | tail -n 400 \
            > history-benchmark-build-diagnostics.txt || true
          cat history-benchmark-build-diagnostics.txt
          exit ${status}

      - name: Run mature seven-day archive baseline
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          mkdir -p "$(dirname "${BENCHMARK_OUTPUT}")"
          rm -f -- "${BENCHMARK_OUTPUT}" "${BENCHMARK_CONFIG}"

          python3 - \
            "${BENCHMARK_CONFIG}" \
            "${PRODUCT_BASE_SHA}" \
            "${BENCHMARK_SHA}" \
            "${BENCHMARK_OUTPUT}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          config = Path(sys.argv[1])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if config.resolve().parent != workspace:
              raise SystemExit("benchmark config must remain at the workspace root")
          payload = {
              "productBaseSHA": sys.argv[2],
              "benchmarkSHA": sys.argv[3],
              "outputPath": sys.argv[4],
          }
          config.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          config.chmod(0o600)
          PY
          config_status=$?
          if [[ ${config_status} -ne 0 ]]; then
            exit ${config_status}
          fi

          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            test-without-building \
            -only-testing:MacVitalsTests/HistoricalConsumptionBenchmarkTests/testMatureSevenDayArchiveBaseline \
            > history-benchmark-run.log 2>&1
          status=$?
          rm -f -- "${BENCHMARK_CONFIG}"

          grep -E 'failed|Failure|skipped|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' \
            history-benchmark-run.log | tail -n 400 \
            > history-benchmark-run-diagnostics.txt || true
          cat history-benchmark-run-diagnostics.txt

          if [[ ${status} -eq 0 ]]; then
            validation_status=0
            if grep -Fq 'Test skipped - Mature history benchmark is opt-in' history-benchmark-run.log; then
              echo 'Benchmark unexpectedly skipped despite explicit workspace configuration.' >&2
              validation_status=1
            fi
            test -s "${BENCHMARK_OUTPUT}" || validation_status=1
            if [[ ${validation_status} -eq 0 ]]; then
              python3 -m json.tool "${BENCHMARK_OUTPUT}" >/dev/null || validation_status=$?
            fi
            if [[ ${validation_status} -eq 0 ]]; then
              python3 - "${BENCHMARK_OUTPUT}" "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}" <<'PY' || validation_status=$?
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          identity = payload.get("identity", {})
          memory = payload.get("memory", {})
          fixture = payload.get("fixture", {})
          record = payload.get("record", {})
          if payload.get("schemaVersion") != 3:
              raise SystemExit("benchmark report schema mismatch")
          if identity.get("productBaseSHA") != sys.argv[2]:
              raise SystemExit("benchmark report product base SHA mismatch")
          if identity.get("benchmarkSHA") != sys.argv[3]:
              raise SystemExit("benchmark report benchmark SHA mismatch")
          if fixture.get("bucketCount") != 2016 or fixture.get("applicationsPerBucket") != 24:
              raise SystemExit("benchmark report does not contain the mature seven-day fixture")
          if fixture.get("aggregateCount") != 2016 * 24:
              raise SystemExit("benchmark aggregate count mismatch")
          if memory.get("semantics") != "processLifetimePeakRSS" or memory.get("unit") != "bytes":
              raise SystemExit("benchmark memory semantics mismatch")
          scale = memory.get("ruMaxRSSScaleToBytes")
          if scale not in (1, 1024):
              raise SystemExit(f"benchmark ru_maxrss calibration scale is invalid: {scale}")
          raw = memory.get("ruMaxRSSRawAtCalibration")
          current_kib = memory.get("currentResidentKiBAtCalibration")
          physical = memory.get("systemPhysicalMemoryBytes")
          if not isinstance(raw, int) or raw <= 0:
              raise SystemExit("benchmark raw ru_maxrss calibration is invalid")
          if not isinstance(current_kib, int) or current_kib <= 0:
              raise SystemExit("benchmark current RSS calibration is invalid")
          if not isinstance(physical, int) or physical <= 0:
              raise SystemExit("benchmark physical memory calibration is invalid")
          peaks = [
              memory.get("peakResidentBytesAtStart"),
              memory.get("peakResidentBytesAfterFixture"),
              memory.get("peakResidentBytesAfterLoad"),
              memory.get("peakResidentBytesAfterRecords"),
              memory.get("peakResidentBytesAfterQueries"),
          ]
          if any(not isinstance(value, int) or value <= 0 or value > physical for value in peaks):
              raise SystemExit(f"benchmark calibrated peak RSS values are invalid: {peaks}")
          if peaks != sorted(peaks):
              raise SystemExit(f"process-lifetime peak RSS checkpoints are not monotonic: {peaks}")
          current_bytes = current_kib * 1024
          if peaks[0] < current_bytes // 2:
              raise SystemExit("calibrated peak RSS is implausibly below live RSS")
          if record.get("sampleCount") != 120:
              raise SystemExit("benchmark record sample count mismatch")
          PY
            fi
            if [[ ${validation_status} -eq 0 ]]; then
              cat "${BENCHMARK_OUTPUT}"
            else
              status=${validation_status}
            fi
          fi
          exit ${status}

      - name: Build benchmark evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${BENCHMARK_CONFIG}"
          python3 - "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          paths = [
              Path("benchmark-source.txt"),
              Path("benchmark-changes.txt"),
              Path("history-benchmark/history-archive-baseline.json"),
              Path("history-benchmark-build.log"),
              Path("history-benchmark-build-diagnostics.txt"),
              Path("history-benchmark-run.log"),
              Path("history-benchmark-run-diagnostics.txt"),
          ]
          files = []
          for path in paths:
              if path.is_file() and not path.is_symlink():
                  data = path.read_bytes()
                  files.append({
                      "path": str(path),
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
          manifest = {
              "schemaVersion": 1,
              "productBaseSHA": sys.argv[1],
              "benchmarkSHA": sys.argv[2],
              "files": files,
          }
          Path("history-benchmark-evidence-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if not files:
              raise SystemExit("benchmark produced no evidence")
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: history-archive-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-source.txt
            benchmark-changes.txt
            history-benchmark/
            history-benchmark-build.log
            history-benchmark-build-diagnostics.txt
            history-benchmark-run.log
            history-benchmark-run-diagnostics.txt
            history-benchmark-evidence-manifest.json
          if-no-files-found: warn
          retention-days: 30
