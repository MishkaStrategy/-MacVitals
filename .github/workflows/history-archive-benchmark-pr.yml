name: History Archive Benchmark Replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macvitals-physical-runtime
  cancel-in-progress: false

jobs:
  mature-seven-day-baseline:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      PRODUCT_BASE_SHA: e4a71fda0b3ed50aabd3b92ede06d32c39ef5d40
      BENCHMARK_SHA: ${{ github.sha }}
      BENCHMARK_OUTPUT: ${{ github.workspace }}/history-benchmark/history-archive-baseline.json
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-HistoryBenchmark
    steps:
      - name: Checkout exact benchmark head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify exact product ancestry and benchmark-only scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PRODUCT_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BENCHMARK_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${BENCHMARK_SHA}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor \
            4d143aaa082b0fb15ce86d19ba72c40557939692 \
            "${BENCHMARK_SHA}"
          git merge-base --is-ancestor "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}"
          git diff --quiet "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}" -- \
            MacVitals MacVitalsUITests project.yml
          git diff --name-only "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}" > benchmark-changes.txt
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              ".github/workflows/history-archive-benchmark-pr.yml",
              "MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift",
          }
          actual = {
              line.strip()
              for line in Path("benchmark-changes.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          if actual != expected:
              raise SystemExit(
                  f"benchmark branch contains unexpected changes: expected={sorted(expected)} actual={sorted(actual)}"
              )
          PY
          ! git grep -nE 'Pet|petState|PetView' -- MacVitals
          {
            printf 'product_base_sha=%s\n' "${PRODUCT_BASE_SHA}"
            printf 'benchmark_sha=%s\n' "${BENCHMARK_SHA}"
          } > benchmark-source.txt

      - name: Validate workflow and benchmark source
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/history-archive-benchmark-pr.yml')"
          grep -Fq 'MACVITALS_RUN_HISTORY_BENCHMARK' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'HistoricalConsumptionRange.sevenDays' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'productBaseSHA' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift
          grep -Fq 'benchmarkSHA' \
            MacVitalsTests/HistoricalConsumptionBenchmarkTests.swift

      - name: Materialize application icon
        run: python3 scripts/materialize_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build benchmark tests
        shell: bash
        run: |
          set +e
          rm -rf -- "${DERIVED_DATA}"
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            > history-benchmark-build.log 2>&1
          status=$?
          grep -E '(^|[[:space:]])(error:|warning:)|BUILD (FAILED|SUCCEEDED)' \
            history-benchmark-build.log | tail -n 400 \
            > history-benchmark-build-diagnostics.txt || true
          cat history-benchmark-build-diagnostics.txt
          exit ${status}

      - name: Run mature seven-day archive baseline
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          mkdir -p "$(dirname "${BENCHMARK_OUTPUT}")"
          GITHUB_SHA="${BENCHMARK_SHA}" \
          MACVITALS_RUN_HISTORY_BENCHMARK=1 \
          MACVITALS_HISTORY_PRODUCT_BASE_SHA="${PRODUCT_BASE_SHA}" \
          MACVITALS_HISTORY_BENCHMARK_OUTPUT="${BENCHMARK_OUTPUT}" \
          xcodebuild \
            -project MacVitals.xcodeproj \
            -scheme MacVitals \
            -destination 'platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            test-without-building \
            -only-testing:MacVitalsTests/HistoricalConsumptionBenchmarkTests/testMatureSevenDayArchiveBaseline \
            > history-benchmark-run.log 2>&1
          status=$?
          grep -E 'failed|Failure|Test Suite|Executed [0-9]+ tests|TEST (FAILED|SUCCEEDED)' \
            history-benchmark-run.log | tail -n 400 \
            > history-benchmark-run-diagnostics.txt || true
          cat history-benchmark-run-diagnostics.txt
          if [[ ${status} -eq 0 ]]; then
            test -s "${BENCHMARK_OUTPUT}"
            python3 -m json.tool "${BENCHMARK_OUTPUT}" >/dev/null
            python3 - "${BENCHMARK_OUTPUT}" "${PRODUCT_BASE_SHA}" "${BENCHMARK_SHA}" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          identity = payload.get("identity", {})
          if identity.get("productBaseSHA") != sys.argv[2]:
              raise SystemExit("benchmark report product base SHA mismatch")
          if identity.get("benchmarkSHA") != sys.argv[3]:
              raise SystemExit("benchmark report benchmark SHA mismatch")
          if payload.get("fixture", {}).get("bucketCount") != 2016:
              raise SystemExit("benchmark report does not contain a mature seven-day fixture")
          PY
            cat "${BENCHMARK_OUTPUT}"
          fi
          exit ${status}

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: history-archive-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-source.txt
            benchmark-changes.txt
            history-benchmark/
            history-benchmark-build.log
            history-benchmark-build-diagnostics.txt
            history-benchmark-run.log
            history-benchmark-run-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30
