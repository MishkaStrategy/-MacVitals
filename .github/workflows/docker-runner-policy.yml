name: Dependency runner policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/audit_docker_runner_routing.py"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/**"
      - "scripts/audit_docker_runner_routing.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-runner-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-dependency-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify dependency jobs use matching runner labels
        run: python3 scripts/audit_docker_runner_routing.py
