name: Mac ARM64 runner policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/audit_docker_runner_routing.py"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/**"
      - "scripts/audit_docker_runner_routing.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-arm64-runner-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-runner-routing:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify every job uses the Mac ARM64 runner
        run: python3 scripts/audit_docker_runner_routing.py
